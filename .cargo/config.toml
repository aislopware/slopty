[alias]
xtask = "run --quiet --package xtask --"
gate = "run --quiet --package xtask -- gate"

[env]
# libghostty-vt-sys builds from the vendored ghostty tree; never fetches at build time.
GHOSTTY_SOURCE_DIR = { value = "vendor/ghostty", relative = true }
MACOSX_DEPLOYMENT_TARGET = "26.5"
IPHONEOS_DEPLOYMENT_TARGET = "26.5"

[target.aarch64-apple-darwin]
rustflags = [ "-C", "target-cpu=apple-m1" ]

[target.aarch64-apple-ios]
rustflags = [ "-C", "target-cpu=apple-a14" ]

[target.aarch64-apple-ios-sim]
rustflags = [ "-C", "target-cpu=apple-m1" ]
