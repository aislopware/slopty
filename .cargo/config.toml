[build]
# Every rustc call goes through sccache: dependency compiles are shared between the main
# checkout, the worktrees the parallel sessions build in, and the three triples' target dirs.
rustc-wrapper = "sccache"

[alias]
xtask = "run --quiet --package xtask --"
gate = "run --quiet --package xtask -- gate"

[env]
# libghostty-vt-sys builds from the vendored ghostty tree; never fetches at build time.
GHOSTTY_SOURCE_DIR = { value = "vendor/ghostty", relative = true }
# Every profile here keeps line tables (`debug = "line-tables-only"`), which makes cargo hand
# build scripts `DEBUG=true`, and libghostty-vt-sys reads that as "build the zig library in
# Debug mode": 50 KB/s of VT parsing in release (MEASUREMENTS 2026-09-06, checkpoint cost). Pin
# the optimised library for every profile; the Rust side keeps its own debug info.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseFast"
MACOSX_DEPLOYMENT_TARGET = "26.5"
IPHONEOS_DEPLOYMENT_TARGET = "26.5"

[target.aarch64-apple-darwin]
rustflags = [ "-C", "target-cpu=apple-m1" ]

[target.aarch64-apple-ios]
rustflags = [ "-C", "target-cpu=apple-a14" ]

[target.aarch64-apple-ios-sim]
rustflags = [ "-C", "target-cpu=apple-m1" ]
