# Named roots, not `**/*.toml`: a bare glob walks `.research/` and every `target/` (minutes on a
# busy disk) before the exclude list gets a say.
include = [
    "*.toml",
    ".cargo/*.toml",
    ".config/*.toml",
    "apps/**/*.toml",
    "crates/**/*.toml",
    "xtask/**/*.toml",
]
# Vendored crates keep their published manifests byte for byte (`*.toml` above reaches them);
# `cargo hakari` writes the workspace-hack manifest in its own style.
exclude = [ "vendor/**", "workspace-hack/Cargo.toml" ]

[formatting]
align_entries = false
array_auto_expand = true
array_auto_collapse = false
compact_arrays = false
indent_string = "    "
reorder_keys = false
column_width = 100
