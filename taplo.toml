# Named roots, not `**/*.toml`: a bare glob walks `.research/` and every `target/` (minutes on a
# busy disk) before the exclude list gets a say.
include = [
    "*.toml",
    ".cargo/*.toml",
    ".config/*.toml",
    "apps/**/*.toml",
    "crates/**/*.toml",
    "fuzz/*.toml",
    "xtask/**/*.toml",
]
# Vendored crates keep their published manifests byte for byte (`*.toml` above reaches them);
# `cargo hakari` writes the workspace-hack manifest in its own style. The copied UI crates keep
# the style they arrived in, as they keep its rustfmt and lints, so a sync's merge sees only real
# edits (`xtask/zeron.toml`, docs/decisions/ui.md).
exclude = [
    "vendor/**",
    "workspace-hack/Cargo.toml",
    "crates/slopty-markdown/Cargo.toml",
    "crates/slopty-shell/Cargo.toml",
    "crates/slopty-shell-theme/Cargo.toml",
    "crates/slopty-syntax/Cargo.toml",
    "crates/slopty-veil/Cargo.toml",
    "crates/slopty-view-doc/Cargo.toml",
    "crates/slopty-view-proto/Cargo.toml",
    "crates/slopty-view-rpc/Cargo.toml",
]

[formatting]
align_entries = false
array_auto_expand = true
array_auto_collapse = false
compact_arrays = false
indent_string = "    "
reorder_keys = false
column_width = 100
