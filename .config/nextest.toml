[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s" }
fail-fast = false
status-level = "fail"
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }
fail-fast = false
status-level = "fail"

[profile.ci.junit]
path = "junit.xml"
report-name = "slopty"
store-success-output = false
store-failure-output = true

[[profile.default.overrides]]
filter = 'test(/^(proptest|fuzz|slow)_/)'
slow-timeout = { period = "120s", terminate-after = 2 }

# The simulator self-test: boot, launch, pair and a real shell take minutes, not seconds.
[[profile.default.overrides]]
filter = 'package(slopty-e2e) & binary(ios)'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }

# The path-flap harness: 90 s of load per shape on a machine it deliberately saturates, so it
# gets the whole runner to itself and a timeout that fits the load, not a unit test.
[[profile.default.overrides]]
filter = 'package(slopty-hostd) & test(/^path_flap_/)'
slow-timeout = { period = "120s", terminate-after = 4, grace-period = "15s" }
threads-required = "num-test-threads"
