[profile.default]
retries = 0
# A test that leaves a child (ptyd, a worker, a shell) holding its output fails.
leak-timeout = { period = "500ms", result = "fail" }
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s" }
fail-fast = false
status-level = "fail"
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# A runner: the gate's profile (its named retries and no others), with the longer timeouts a
# three-core runner needs and a JUnit report. A blanket retry here would hide any flake behind a
# pass; only a test named under `profile.gate` is retried.
[profile.ci]
inherits = "gate"
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }
fail-fast = false
status-level = "fail"
# The tests that read hardware a hosted runner's virtual Mac does not have. nextest lists them
# as skipped here, and every local gate runs them. Each is named with what it lacks; only
# missing hardware puts a test here, never timing and never a pattern.
# - The guest has no performance counters: `proc_pid_rusage` reads 0 instructions and 0 cycles.
# - The guest has no wake-on-LAN: `pmset -g` gives no `womp` setting.
# - The guest has no SoC counters: IOReport offers none of the encode-engine, memory-controller,
#   GPU or energy channels, so there is nothing to subscribe to.
default-filter = '''
not (
    (package(slopty-testkit) & (
        test(=bench::tests::a_series_reports_per_operation_and_as_json)
        | test(=process::tests::this_process_reads_back)
        | test(=soc::tests::a_span_reads_back)))
    | (package(slopty-worker) & test(=caps::tests::this_mac_says_whether_it_wakes_on_lan))
)
'''

[profile.ci.junit]
path = "junit.xml"
report-name = "slopty"
store-success-output = false
store-failure-output = true

# The icon test compiles with `actool` and renders with `ictool`, whose services start cold on a
# fresh runner: 124 s there against 7 s here (run 36765252672). Started last, as its binary
# sorts, it ran alone at the end of a 318 s run; started first, it runs beside the rest. Beside
# the rest it took 165 s, then passed the lane's 180 s (run 36906102487): the cold start is
# Apple's services', not the test's, so it alone is given 360 s.
[[profile.ci.overrides]]
filter = 'package(xtask) & test(=icon::tests::compiles_and_the_prompt_reads_at_every_size_and_appearance)'
priority = 100
slow-timeout = { period = "60s", terminate-after = 6, grace-period = "10s" }

[[profile.default.overrides]]
filter = 'test(/^(proptest|fuzz|slow)_/)'
slow-timeout = { period = "120s", terminate-after = 2 }

# The simulator self-test: boot, launch, pair and a real shell take minutes, not seconds.
[[profile.default.overrides]]
filter = 'package(slopty-e2e) & (binary(ios) | binary(ios_uikit))'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }

# Echo latency is measured against the frame pace; the rest of the suite competing for the
# cores is noise in that measurement.
[[profile.default.overrides]]
filter = '''
(package(slopty-worker) & (test(an_echo_beside_a_flood_is_not_held_to_the_frame_pace)
    | test(a_key_after_a_pause_does_not_wait_for_the_checkpoint)))
| (package(slopty-workerd) & test(echo_is_not_held_behind_slow_requests))
| (package(slopty-shape) & test(a_short_wait_ends_when_it_was_asked_to))
'''
threads-required = "num-test-threads"

# CoreAudio's first client on a fresh session takes seconds (~7 s, and past 20 s right after an
# iOS simulator run); the two tests that open a player must not both be that client at once.
[test-groups.coreaudio]
max-threads = 1

# The client's audio test waits up to 100 s for the player after its Opus encoder (which took
# 40 s in a loaded gate): past that bound it fails with its stats before the harness kills it.
[[profile.default.overrides]]
filter = '(package(slopty-codec) & test(player_starts_and_drains)) | (package(slopty-client) & test(audio_waits_for_the_player))'
test-group = 'coreaudio'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "5s" }

# The loom models of the audio ring (`cargo xtask deep loom`; built only under `--cfg
# slopty_loom`, so never in the gate) explore every interleaving: a minute or two each on a loaded
# Mac. They open no VideoToolbox session, so they stay out of its group.
[[profile.default.overrides]]
filter = 'package(slopty-codec) & test(/^audio::ring_model::/)'
slow-timeout = { period = "120s", terminate-after = 5 }
test-group = '@global'

# Each VideoToolbox session revalidates the test binary's signature through syspolicyd on this
# volume (mounted noowners), so codec tests started all at once queue behind each other past the
# timeout; one alone takes seconds. Two at a time keeps the hardware sessions from piling up.
[test-groups.videotoolbox]
max-threads = 2

[[profile.default.overrides]]
filter = '''
(package(slopty-codec) & !test(player_starts_and_drains))
| (package(slopty-worker) & test(=screen::tests::a_rebuild_beside_a_cadence_change_finishes))
'''
test-group = 'videotoolbox'

# The gate's tests lane (`cargo gate`): the default profile, plus retries for the tests named
# below. They time the session actor or the relay's timer against the machine's load: in a loaded
# gate they have missed their deadline, even run alone in nextest (the gate's other lanes still
# compile beside them), and alone they pass (2026-09-28, 2026-09-30). A pass on a retry shows as
# FLAKY in the gate log; failing every try still fails the gate. Name a test here only when it is
# timing-sensitive this way, never by pattern.
[profile.gate]

[[profile.gate.overrides]]
filter = '''
(package(slopty-worker) & binary(session_actor) & (
    test(=actor::a_slow_viewer_is_skipped_then_caught_up_never_dropped)
    | test(=actor::a_silent_command_after_a_clear_is_seen_running_at_once)
    | test(=actor::an_echo_beside_a_flood_is_not_held_to_the_frame_pace)))
| (package(slopty-shape) & test(=relay::tests::a_short_wait_ends_when_it_was_asked_to))
'''
retries = { backoff = "fixed", count = 2, delay = "1s" }

# `cargo xtask deep miri`: the pure crates' tests under the interpreter, 50–100 times slower than
# native. A test still running after 20 minutes is ended and fails, so one slow test is a finding
# and not a night.
[profile.miri]
slow-timeout = { period = "300s", terminate-after = 4, grace-period = "10s" }
fail-fast = false

[profile.miri.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
