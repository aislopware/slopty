[profile.default]
retries = 0
# A test that leaves a child (ptyd, a worker, a shell) holding its output fails.
leak-timeout = { period = "500ms", result = "fail" }
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "5s" }
fail-fast = false
status-level = "fail"
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci]
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "10s" }
fail-fast = false
status-level = "fail"

[profile.ci.junit]
path = "junit.xml"
report-name = "slopty"
store-success-output = false
store-failure-output = true

[[profile.default.overrides]]
filter = 'test(/^(proptest|fuzz|slow)_/)'
slow-timeout = { period = "120s", terminate-after = 2 }

# The simulator self-test: boot, launch, pair and a real shell take minutes, not seconds.
[[profile.default.overrides]]
filter = 'package(slopty-e2e) & (binary(ios) | binary(ios_uikit))'
slow-timeout = { period = "60s", terminate-after = 5, grace-period = "10s" }

# Echo latency is measured against the frame pace; the rest of the suite competing for the
# cores is noise in that measurement.
[[profile.default.overrides]]
filter = '''
(package(slopty-worker) & (test(an_echo_beside_a_flood_is_not_held_to_the_frame_pace)
    | test(a_key_after_a_pause_does_not_wait_for_the_checkpoint)))
| (package(slopty-workerd) & test(echo_is_not_held_behind_slow_requests))
| (package(slopty-shape) & test(a_short_wait_ends_when_it_was_asked_to))
'''
threads-required = "num-test-threads"

# CoreAudio's first client on a fresh session takes seconds (~7 s, and past 20 s right after an
# iOS simulator run); the two tests that open a player must not both be that client at once.
[test-groups.coreaudio]
max-threads = 1

# The client's audio test waits up to 100 s for the player after its Opus encoder (which took
# 40 s in a loaded gate): past that bound it fails with its stats before the harness kills it.
[[profile.default.overrides]]
filter = '(package(slopty-codec) & test(player_starts_and_drains)) | (package(slopty-client) & test(audio_waits_for_the_player))'
test-group = 'coreaudio'
slow-timeout = { period = "60s", terminate-after = 3, grace-period = "5s" }

# Each VideoToolbox session revalidates the test binary's signature through syspolicyd on this
# volume (mounted noowners), so codec tests started all at once queue behind each other past the
# timeout; one alone takes seconds. Two at a time keeps the hardware sessions from piling up.
[test-groups.videotoolbox]
max-threads = 2

[[profile.default.overrides]]
filter = 'package(slopty-codec) & !test(player_starts_and_drains)'
test-group = 'videotoolbox'

# The gate's tests lane (`cargo gate`): the default profile, plus retries for the tests named
# below. They time the session actor against the rest of the suite's load: in a loaded gate they
# have missed their deadline, and alone they pass (2026-09-28). A pass on a retry shows as FLAKY
# in the gate log; failing every try still fails the gate. Name a test here only when it is
# timing-sensitive this way, never by pattern.
[profile.gate]

[[profile.gate.overrides]]
filter = '''
package(slopty-worker) & binary(session_actor) & (
    test(=actor::a_slow_viewer_is_skipped_then_caught_up_never_dropped)
    | test(=actor::a_silent_command_after_a_clear_is_seen_running_at_once)
    | test(=actor::an_echo_beside_a_flood_is_not_held_to_the_frame_pace))
'''
retries = { backoff = "fixed", count = 2, delay = "1s" }
