[package]
name = "slopty-hostd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty host daemon: serves terminal sessions and remote windows to paired clients over iroh"

[lints]
workspace = true

[[bin]]
name = "slopty-hostd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
slopty-core.workspace = true
slopty-host.workspace = true
slopty-net = { workspace = true, features = [ "mdns" ] }
slopty-proto.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
