[package]
name = "slopty-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "slopty: command-line client and worker control for Slopty"

[lints]
workspace = true

# The command line is a library with a binary of one call over it: sccache caches a library but
# never a binary, so a build that leaves this package unchanged links it instead of compiling it
# again (MEASUREMENTS 2026-10-02, "the tests lane's build"). The unit tests are the library's,
# and so are the docs.
[[bin]]
name = "slopty"
path = "src/main.rs"
doc = false
test = false

# The developer's measurements against a worker (`cargo xtask probe`): built beside `slopty`,
# shipped in no bundle.
[[bin]]
name = "slopty-probe"
path = "src/probe_main.rs"
doc = false
test = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = [ "transport-io" ] }
rustix = { workspace = true, features = [ "system" ] }
serde.workspace = true
serde_json.workspace = true
slopty-agent.workspace = true
slopty-client.workspace = true
slopty-core.workspace = true
slopty-crash.workspace = true
slopty-deploy.workspace = true
slopty-grid.workspace = true
slopty-net.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
slopty-pty.workspace = true
slopty-settings.workspace = true
# The server machine's Tailscale peer relay pref (`relay`).
slopty-tailnet.workspace = true
slopty-tools.workspace = true
tokio = { workspace = true, features = [ "io-std" ] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# The screen bench's capture clock (`bench::screen`), Apple only like the bench.
[target.'cfg(target_vendor = "apple")'.dependencies]
slopty-capture.workspace = true

[dev-dependencies]
slopty-server.workspace = true
slopty-tailnet = { workspace = true, features = [ "fake" ] }
tempfile.workspace = true
# The daemons and doubles the tests spawn, found built (`slopty_testkit::bins`).
slopty-testkit.workspace = true
tokio = { workspace = true, features = [ "test-util" ] }
