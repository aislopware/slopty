[package]
name = "slopty-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty's File Provider extension: each worker's home in Finder, fetched as it is read"

[lints]
workspace = true

# The extension's executable, which `cargo xtask bundle` puts in
# `Slopty.app/Contents/PlugIns/SloptyFiles.appex`. `doc = false`: its docs would land where the
# library's do.
[[bin]]
name = "slopty-files"
path = "src/main.rs"
doc = false

[dependencies]
# A file's version as its listing's time (`item`), on every platform.
slopty-core.workspace = true
slopty-proto.workspace = true
thiserror.workspace = true
uuid.workspace = true

# The extension itself, a Mac's alone: its link to a worker (`worker`, `domain`), its classes
# and the system's entry point (`extension`).
[target.'cfg(target_os = "macos")'.dependencies]
parking_lot.workspace = true
slopty-client.workspace = true
slopty-net.workspace = true
slopty-platform.workspace = true
tokio.workspace = true
tracing.workspace = true
block2.workspace = true
objc2.workspace = true
objc2-file-provider = { workspace = true, features = [
    "block2",
    "Extension",
    "NSFileProviderDomain",
    "NSFileProviderEnumerating",
    "NSFileProviderError",
    "NSFileProviderItem",
    "NSFileProviderModifyItemOptions",
    "NSFileProviderReplicatedExtension",
    "NSFileProviderRequest",
    "objc2-uniform-type-identifiers",
] }
objc2-foundation = { workspace = true, features = [
    "FoundationErrors",
    "NSData",
    "NSDate",
    "NSError",
    "NSProgress",
    "NSURL",
    "NSValue",
] }
objc2-uniform-type-identifiers = { workspace = true, features = [ "UTCoreTypes", "UTType" ] }
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The daemons the tests spawn, found built (`slopty_testkit::bins`).
slopty-testkit.workspace = true
