[package]
name = "slopty-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty iOS app: UIKit's delegates and `main`, as the static library the bundle links"

[lints]
workspace = true

[features]
default = [  ]
# The test socket's renderer access, as `slopty/e2e` (`cargo xtask e2e ios`). Off otherwise.
e2e = [ "slopty-app/e2e" ]

[lib]
name = "slopty_ios"
path = "src/lib.rs"
crate-type = [ "staticlib", "rlib" ]

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
gpui-kit.workspace = true
gpui_ios.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [ "NSDictionary", "NSSet", "NSURL" ] }
# The app and scene delegates, and `UIApplicationMain`.
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIOpenURLContext",
    "UIResponder",
    "UIScene",
    "UISceneOptions",
    "UISceneSession",
    "UIWindowScene",
] }
slopty-app.workspace = true
slopty-e2e = { workspace = true, default-features = false }
slopty-platform.workspace = true
slopty-ui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
