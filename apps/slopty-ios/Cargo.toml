[package]
name = "slopty-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty iOS app: the static library the UIKit shell links"

[lints]
workspace = true

[features]
default = [  ]
# The test socket's renderer access, as `slopty/e2e` (`cargo xtask e2e ios`). Off otherwise.
e2e = [ "slopty-app/e2e" ]

[lib]
name = "slopty_ios"
path = "src/lib.rs"
crate-type = [ "staticlib", "rlib" ]

[target.'cfg(target_os = "ios")'.dependencies]
gpui.workspace = true
gpui-kit.workspace = true
gpui_ios.workspace = true
slopty-app.workspace = true
slopty-platform.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
