[package]
name = "slopty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty macOS app"

[lints]
workspace = true

[features]
default = [  ]
# Renderer access for the self-test socket; see `slopty-app`.
e2e = [ "slopty-app/e2e" ]

[[bin]]
name = "slopty-app"
path = "src/main.rs"

# The app as `cargo xtask e2e` drives it, under a name a plain build never makes: a build of
# the workspace's tests rebuilds `slopty-app` without the self-test (`tests/crash.rs` runs it),
# and that app never opens the test socket.
[[bin]]
name = "slopty-app-e2e"
path = "src/bin/slopty-app-e2e.rs"
required-features = [ "e2e" ]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui-kit.workspace = true
slopty-app.workspace = true
slopty-crash.workspace = true
slopty-platform.workspace = true
slopty-ui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
