[package]
name = "slopty-workerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty worker daemon: serves terminal sessions and remote windows to clients over QUIC"

[lints]
workspace = true

# The package takes another name than the library's; the binary keeps the one people type.
# `doc = false`: its docs would land where the library's do.
[[bin]]
name = "slopty-worker"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
