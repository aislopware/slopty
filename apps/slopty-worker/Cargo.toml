[package]
name = "slopty-workerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty worker daemon: serves terminal sessions and remote windows to clients over QUIC"

[lints]
workspace = true

# The package takes another name than the library's; the binary keeps the one people type.
# `doc = false`: its docs would land where the library's do.
[[bin]]
name = "slopty-worker"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
# A download's digest, sent in `Done` (`xfer`).
blake3.workspace = true
bytes.workspace = true
clap.workspace = true
# The mod socket: HTTP/1.1 on a Unix socket, the one transport the Claude Code mod's `fetch`
# offers (`modsock`). Already in the daemon through `slopty-tailnet`'s LocalAPI client.
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
noq.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
slopty-agent.workspace = true
slopty-capture.workspace = true
slopty-core.workspace = true
slopty-crash.workspace = true
slopty-worker.workspace = true
slopty-input.workspace = true
slopty-net.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
slopty-settings.workspace = true
slopty-tailnet.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The drag helper the daemon runs as `slopty-worker dnd`: a drop from a client carried as a real
# drag session at its point (`dnd`).
[target.'cfg(target_os = "macos")'.dependencies]
slopty-dnd.workspace = true

[dev-dependencies]
slopty-codec.workspace = true
serde_json.workspace = true
slopty-worker.workspace = true
slopty-media.workspace = true
slopty-shape.workspace = true
slopty-client.workspace = true
# A stand-in LocalAPI for the path reader's tests (`tailnet`).
slopty-tailnet = { workspace = true, features = [ "fake" ] }
tempfile.workspace = true
# The daemons and doubles the tests spawn, found built (`slopty_testkit::bins`).
slopty-testkit.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-application-services.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
