[default]
# Hex colours quoted in the docs' token tables (`D8DBE1`) are not words.
extend-ignore-re = [
    "(?i)objc",
    "\\b[0-9a-f]{7,40}\\b",
    "\\bBA\\b",
    "`[0-9A-Fa-f]{6}`",
    # terminfo names ghostty's entry uses: shifted Home and its modifier variants.
    "kHOM[0-9]?",
    # A PEM body's base64 lines (`slopty_push::provider`'s test key).
    "(?m)^[A-Za-z0-9+/]{40,}={0,2}$",
]

[default.extend-words]
# terminal / VT jargon that typos flags
ser = "ser"
de = "de"
sav = "sav"
LOD = "LOD"     # level of detail
flate = "flate" # DEFLATE
udid = "udid"   # Apple device identifier (simctl/devicectl)
# terminfo capability names (`crates/slopty-pty/src/terminfo.rs`)
rin = "rin"       # scroll back n lines
kend = "kend"     # the End key
WRONLY = "WRONLY" # the POSIX open(2) flag
ue = "ue"         # ue(v), the H.26x unsigned exp-Golomb code (`slopty_codec::conformance`)
nd = "nd"         # the English ordinal suffix, 2nd (`slopty_ui::project::model::queue_words`)
styl = "styl"     # the Stylus file extension (`slopty_kit::file_icons`)
ede = "ede"       # Claude Code's own `ede_diagnostic` error tag (`slopty_testkit::claude_stream`)
BRE = "BRE"       # POSIX basic regular expressions (`slopty_markdown::parser`'s tests)
# the physically based material's metal factor (`slopty_visual::scene`)
metalness = "metalness"
# TeX names (`slopty_math`): the contour integral, the hom operator, amsmath's environment
oint = "oint"
hom = "hom"
multline = "multline"

[default.extend-identifiers]
# the `image` crate's `Delay::from_numer_denom_ms`
from_numer_denom_ms = "from_numer_denom_ms"

[files]
extend-exclude = [
    "**/*.snap",
    "Cargo.lock",
    "vendor/",
    ".research/",
    "**/*.metal",
    "**/fixtures/",
    # Fuzzers' inputs, byte for byte: the gate's `typos -w` must not rewrite one.
    "fuzz/corpus/",
    "fuzz/regressions/",
    # Upstream's minified chart libraries, vendored byte for byte (`web::page::libs`).
    "crates/slopty-platform/assets/page-libs/",
    # The copied UI crates keep their text as written, so a sync's merge sees only real edits
    # (`xtask/zeron.toml`, docs/decisions/ui.md).
    "crates/slopty-shell/",
    "crates/slopty-view-doc/",
    "crates/slopty-view-proto/",
    "crates/slopty-view-rpc/",
]
