[package]
name = "slopty-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty agent tracking: Claude Code hook events → per-session agent status"

[lints]
workspace = true

[dependencies]
# ACP's wire types, for any agent driven over ACP (`acp`), with the token counts an agent
# gives at a turn's end (`PromptResponse.usage`), which one that does not send leaves out,
# and the fork of a session an agent advertises (`session/fork`).
agent-client-protocol-schema = { workspace = true, features = [
    "unstable_end_turn_token_usage",
    "unstable_session_fork",
] }
# The Claude mod's directory is named by its files' digest (`claude_mod`).
blake3.workspace = true
# The pictures in a transcript are base64; the worker sends their bytes.
data-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
slopty-core.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
uuid.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
