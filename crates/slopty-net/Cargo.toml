[package]
name = "slopty-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty transport: QUIC over plain UDP with a null crypto provider, admission by address, framed control and session streams"

[lints]
workspace = true

[dependencies]
bytes.workspace = true
# `EMSGSIZE`, to tell a datagram too large for the interface from other send errors (`udp`).
libc.workspace = true
noq.workspace = true
noq-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
slopty-core.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
# Who is calling, from the tailnet (`admission`).
slopty-tailnet.workspace = true
parking_lot.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Apple's batched `sendmsg_x`/`recvmsg_x` datapath, compiled in on macOS only (private calls
# reached by `dlsym`, never on iOS), on unless `SLOPTY_BATCHED_UDP=0`
# (`endpoint::Tuning::batched_udp`, docs/decisions/transport.md).
[target.'cfg(target_os = "macos")'.dependencies]
noq = { workspace = true, features = [ "fast-apple-datapath" ] }

[dev-dependencies]
slopty-tailnet = { workspace = true, features = [ "fake" ] }
slopty-shape.workspace = true
tempfile.workspace = true
# `start_paused`: the simulated network runs on tokio's paused clock (`tests/sim.rs`).
tokio = { workspace = true, features = [ "test-util" ] }
