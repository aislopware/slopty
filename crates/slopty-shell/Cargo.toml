[package]
name = "slopty-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
slopty-veil = { path = "../slopty-veil" }
url = "2"
slopty-view-proto = { path = "../slopty-view-proto" }
similar = "3"
slopty-view-doc = { path = "../slopty-view-doc" }
slopty-view-rpc = { path = "../slopty-view-rpc" }
slopty-syntax = { path = "../slopty-syntax" }
slopty-shell-theme = { path = "../slopty-shell-theme" }
slopty-visual = { path = "../slopty-visual" }
slopty-visual-gpu = { path = "../slopty-visual-gpu" }
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
gpui-base.workspace = true
tokio = { version = "1", features = [ "full" ] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
slopty-markdown = { path = "../slopty-markdown" }
# The maths typesetter (`markdown/math.rs`).
slopty-math = { path = "../slopty-math", features = [ "bundled" ] }
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
] }
# GPUI's release: an SVG written out here is parsed again by GPUI, so the two move together
# (gpui-fast's `usvg` first).
usvg = "0.48"
# Mermaid's successor renderer (follows Mermaid 12; Zed's choice): every diagram kind, SVG out,
# the cytoscape layouts Zed uses; no ELK, no export or font discovery (GPUI measures text).
merman = { version = "0.9", default-features = false, features = [
    "all-diagrams",
    "layout-cytoscape",
    "svg",
] }
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.24"
# The code a phone or iPad scans for the server (`settings::invite`): the matrix alone.
qrcode = { version = "0.14.1", default-features = false }
ttf-parser = "0.25.1"
uuid = { version = "1", features = [ "v4", "v7", "serde" ] }
chrono = { version = "0.4", features = [ "serde" ] }
anyhow = "1"
tracing = "0.1"
data-encoding.workspace = true
sha2 = "0.11"
thiserror = "2"
parking_lot.workspace = true
# One rust-embed 8 in the graph, the workspace's.
rust-embed = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.57", default-features = false, features = [ "os-webview" ] }
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSView",
] }
objc2-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGDirectDisplay",
    "CGEvent",
    "CGEventTypes",
] }
objc2-web-kit = { version = "0.3.2", features = [
    "WKWebView",
    "WKNavigationDelegate",
    "WKNavigationAction",
] }

[dev-dependencies]
gpui = { workspace = true, features = [ "test-support" ] }
tempfile = "3"
# The window drawn in the test process (`shell::goldens`): Core Text and the headless Metal
# renderer, the comparator the self-test shares, and the snapshots of what a frame says and paints.
gpui_platform = { workspace = true, features = [ "font-kit", "test-support" ] }
insta.workspace = true
# The words a run that fails says (`shell::goldens`' stand-in machine), from where a deploy says
# them.
slopty-deploy.workspace = true
slopty-testkit = { workspace = true, features = [ "golden" ] }
