[package]
name = "slopty-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty server: the control plane — worker registry and leases, the directory for clients, orchestration verbs over QUIC and MCP"

[lints]
workspace = true

[dependencies]
hyper.workspace = true
hyper-util.workspace = true
parking_lot.workspace = true
rmcp = { workspace = true, features = [ "transport-streamable-http-server" ] }
serde_json.workspace = true
slopty-core.workspace = true
slopty-net.workspace = true
# The data directory's platform rules (`store::default_data_dir`).
slopty-platform.workspace = true
slopty-tailnet.workspace = true
slopty-proto.workspace = true
slopty-tools.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
slopty-tailnet = { workspace = true, features = [ "fake" ] }
tempfile.workspace = true
tokio = { workspace = true, features = [ "test-util" ] }
