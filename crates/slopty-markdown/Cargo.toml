[package]
name = "slopty-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Block-level markdown model + append-incremental reparse. Shared by the gpui
# desktop transcript and the mobile layout core, so it stays UI-free.
# slopty: upstream code that clippy 1.99's defaults flag, allowed by name rather than edited, so
# the copy stays diffable (`vendor/slopty/README.md`).
[lints.clippy]
enum_variant_names = "allow"

[dependencies]
pulldown-cmark = "0.12"
