[package]
name = "slopty-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Block-level markdown model + append-incremental reparse. Shared by the gpui
# desktop transcript and the mobile layout core, so it stays UI-free.
# Clippy lints this code trips, allowed by name.
[lints.clippy]
enum_variant_names = "allow"

[dependencies]
pulldown-cmark = "0.13"
