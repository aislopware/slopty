[package]
name = "slopty-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty app self-test: the test-socket protocol, a driver, a daemon+app harness and render snapshots"

[lints]
workspace = true

[features]
default = [ "harness" ]
# The driver, the harness and the snapshot comparison (everything but the protocol types).
harness = [
    "dep:tokio",
    "dep:image",
    "dep:anyhow",
    "dep:tempfile",
    "dep:slopty-pty",
    "dep:slopty-shape",
]

[dependencies]
data-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
image = { workspace = true, optional = true }
slopty-pty = { workspace = true, optional = true }
# The link the second worker is reached over (`harness::SecondWorker`).
slopty-shape = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [ "process" ] }

# The idle-window helper (`src/bin/slopty-idle-window.rs`): AppKit, macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
# The run's named pasteboards, released when it ends.
slopty-platform.workspace = true

[dev-dependencies]
anyhow.workspace = true
slopty-agent.workspace = true
slopty-media.workspace = true
slopty-pty.workspace = true
image.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [ "process" ] }
