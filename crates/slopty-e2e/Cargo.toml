[package]
name = "slopty-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty app self-test: the test-socket protocol, a driver, a daemon+app harness and render snapshots"

[lints]
workspace = true

[features]
default = [ "harness" ]
# The driver, the harness and the snapshot comparison (everything but the protocol types).
harness = [
    "dep:tokio",
    "dep:image",
    "dep:anyhow",
    "dep:tempfile",
    "dep:slopty-pty",
    "dep:slopty-shape",
    "dep:slopty-testkit",
]
# The live test targets below: `cargo xtask e2e` (and `vm e2e`, `linux e2e`) builds them, and
# host clippy lints them. Every test in them is `#[ignore]`d, so `cargo gate` would build and
# link them only to list nothing; without the feature it builds none of them.
live = [ "harness" ]

# It runs a tokio client, which the `harness` feature brings.
[[bin]]
name = "slopty-glass"
required-features = [ "harness" ]

[[test]]
name = "app"
required-features = [ "live" ]

[[test]]
name = "ios"
required-features = [ "live" ]

[[test]]
name = "ios_uikit"
required-features = [ "live" ]

[[test]]
name = "linux"
required-features = [ "live" ]

[[test]]
name = "pair"
required-features = [ "live" ]

[[test]]
name = "server"
required-features = [ "live" ]

[[test]]
name = "smooth"
required-features = [ "live" ]

[[test]]
name = "through_server"
required-features = [ "live" ]

[[test]]
name = "vm"
required-features = [ "live" ]

[[test]]
name = "workers"
required-features = [ "live" ]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow = { workspace = true, optional = true }
image = { workspace = true, optional = true }
slopty-pty = { workspace = true, optional = true }
# The link the second worker is reached over (`harness::SecondWorker`).
slopty-shape = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
# The clean environment every daemon and CLI the harness starts runs in (`env::scrub`).
slopty-testkit = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = [ "process" ] }

# The idle-window helper (`src/bin/slopty-idle-window.rs`): AppKit, macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
# The run's named pasteboards, released when it ends.
slopty-platform.workspace = true
# The glass measurement's client (`src/bin/slopty-glass.rs`): the app's receive path.
slopty-capture.workspace = true
slopty-client.workspace = true
slopty-core.workspace = true
slopty-net.workspace = true
slopty-proto.workspace = true

[dev-dependencies]
anyhow.workspace = true
# A drop's files, as the worker's record of its release names them (`tests/app/dnd.rs`).
blake3.workspace = true
data-encoding.workspace = true
slopty-agent.workspace = true
# The Linux worker test reaches its worker as the app does (`tests/linux.rs`).
slopty-client.workspace = true
slopty-core.workspace = true
# The app's hang reports, read as `slopty crashes` reads them (`tests/app/hangs.rs`).
slopty-crash.workspace = true
slopty-media.workspace = true
slopty-net.workspace = true
slopty-proto.workspace = true
slopty-pty.workspace = true
slopty-testkit.workspace = true
image.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [ "process" ] }
