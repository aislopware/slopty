[package]
name = "slopty-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Test-only measuring and doubles: a counting allocator, percentiles, retired instructions, process footprint, the SoC's media counters, and the stand-ins for agents and an app's window"

[lints]
workspace = true

[features]
# Golden frames (`golden`): the comparator a picture of the interface is held to, the backdrop it
# is laid over and the words it says, for the app's self-test and the shell's in-process tests.
# Off for xtask, which builds this crate too.
golden = [ "dep:anyhow", "dep:image", "dep:similar" ]

[dependencies]
anyhow = { workspace = true, optional = true }
image = { workspace = true, optional = true }
libc.workspace = true
# A test's daemons ended as a process group and waited for (`group`).
rustix.workspace = true
# The stand-in `claude` (`slopty-stub-claude`) reads its settings and speaks MCP in JSON.
serde_json.workspace = true
# A golden's words against the frame's, as the lines that changed (`golden`).
similar = { workspace = true, optional = true }
# A link a test cuts and restores (`relay`), on the runtime the tests run on.
tokio.workspace = true

# The SoC's media and graphics counters over a span (`soc`), read through IOReport.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
# The stand-in app window (`slopty-stub-window`), an AppKit window asked for by message.
objc2.workspace = true
# `NSGeometry`'s types need `objc2-core-foundation` too: the workspace's features hid it until
# Deep's per-feature check built the crate alone (run 38228066972).
objc2-foundation = { workspace = true, features = [
    "NSGeometry",
    "NSString",
    "objc2-core-foundation",
] }
