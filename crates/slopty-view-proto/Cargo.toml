[package]
name = "slopty-view-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# slopty: uuid is not taken; only the code cut here used it.
chrono = { version = "0.4", features = ["serde"] }

# slopty: upstream docs that Slopty's rustdoc check (private items, warnings denied) trips.
[lints.rustdoc]
broken_intra_doc_links = "allow"
