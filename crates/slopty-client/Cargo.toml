[package]
name = "slopty-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty client core: terminal session state, line cache, connection lifecycle"

[lints]
workspace = true

[dependencies]
# A download's end-to-end check against the worker's digest (`xfer`).
blake3.workspace = true
bytes.workspace = true
parking_lot.workspace = true
slopty-core.workspace = true
slopty-grid.workspace = true
slopty-media.workspace = true
slopty-net.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
rustix.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The decoders behind remote windows and displays, which only Apple clients show.
[target.'cfg(target_vendor = "apple")'.dependencies]
slopty-codec.workspace = true
# This device's display key (`screen::display`).
uuid.workspace = true
# A dragged file's URL read as its path (`dnd`).
url.workspace = true

[features]
# `ScreenHandle::detached` for the headless UI tests.
headless = [  ]

[dev-dependencies]
pretty_assertions.workspace = true
# The observed Claude Code thread's id, and its fixtures, for `tests/threads.rs`.
slopty-agent.workspace = true
slopty-shape.workspace = true
# The daemons the thread test spawns, found built (`slopty_testkit::bins`).
slopty-testkit.workspace = true
tempfile.workspace = true

# The worker's own pasteboard, released when the thread test ends.
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
slopty-input.workspace = true
