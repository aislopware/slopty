[package]
name = "slopty-shape"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "A UDP link shaper: the degraded path Slopty's congestion rulings are measured on, as a relay or as an in-memory network on tokio's clock"

[lints]
workspace = true

[[bin]]
name = "slopty-shape"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# `sim`: the in-memory network is a socket noq drives.
noq.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = [ "test-util" ] }
