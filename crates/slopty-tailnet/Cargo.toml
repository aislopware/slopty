[package]
name = "slopty-tailnet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The local Tailscale daemon, read through its LocalAPI: peers, paths and who is calling"

[lints]
workspace = true

[features]
# `fake`: a stand-in LocalAPI on loopback, for the tests of the crates that read Tailscale.
fake = [ "dep:parking_lot" ]

[dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = [ "client" ] }
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
slopty-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
parking_lot = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The App Store Tailscale's LocalAPI is named only by a file its extension holds open.
slopty-platform.workspace = true

[dev-dependencies]
parking_lot.workspace = true
tempfile.workspace = true
