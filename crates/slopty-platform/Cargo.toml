[package]
name = "slopty-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Process-level platform helpers shared by the Slopty apps and daemons (macOS, iOS, Linux)"

[lints]
workspace = true

[dependencies]
# Whose runtime directory a Linux socket falls back to (`dirs`); on Apple, also whether the run
# that left a drop's landing behind is still alive (`file_drop::sweep`).
rustix.workspace = true
tracing.workspace = true
# The daemons' `LaunchAgent` definitions (`service`), written and read back.
plist.workspace = true
# The wait for launchd to let go of an agent before it is loaded again (`service`).
tokio.workspace = true
# What an install does to ptyd (`service::Ptyd`), read by a deploy from the CLI's JSON.
serde.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-audio-toolbox.workspace = true
# The clipboard origin marker's type and format (`transfer::ORIGIN_TYPE`), shared with the worker.
slopty-proto.workspace = true
block2.workspace = true
# A drop's files, received off the main thread, reach the app on it (`file_drop`).
dispatch2.workspace = true
# A drop's landing, shared by the callbacks its files arrive on (`file_drop`).
parking_lot.workspace = true
# A thread's QoS class (`user_interactive_thread`): pthread/qos.h, which rustix does not wrap.
libc.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSURL",
    "NSURLRequest",
    "NSValue",
    "NSDictionary",
    "NSOperation",
    "NSError",
    # The iOS pasteboard's promises and the iPad's drops (`pasteboard`, `file_drop`).
    "NSItemProvider",
    "NSProgress",
    # The iOS pasteboard's items, one by one (`pasteboard`).
    "NSIndexSet",
    "block2",
    # A page's ⌘Z and ⇧⌘Z go to its own undo manager (`web`).
    "NSUndoManager",
    # Whether the app runs from a bundle, which the notification centre needs (`notify`).
    "NSBundle",
    # The hotkey layer follows this app in and out of the front (`system_keys`).
    "NSNotification",
    # The screen's unlock, heard from the login window (`resume`).
    "NSDistributedNotificationCenter",
    # A worker's pages keep their own data store, named by the worker (`web`).
    "NSUUID",
    # The container the app shares with its File Provider extension (`files`), and the
    # Finder's trash (`trash`).
    "NSFileManager",
    # Which of the trash's errors is a volume without one (`trash`).
    "FoundationErrors",
] }
# Local notifications, their taps and the icon badge (`notify`).
objc2-user-notifications = { workspace = true, features = [
    "bitflags",
    "block2",
    "UNNotification",
    # The approval note's "Allow", "Deny" and "Show" (`notify::APPROVAL`).
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The session tap that takes system shortcuts for a remote Mac (`system_keys`).
objc2-core-graphics = { workspace = true, features = [ "CGEvent", "CGEventTypes" ] }
objc2-core-foundation = { workspace = true, features = [
    "CFMachPort",
    "CFRunLoop",
    # The input source's changes, heard from HIToolbox (`input_source`).
    "CFNotificationCenter",
] }
objc2-app-kit = { workspace = true, features = [
    "NSPasteboardItem",
    "NSFilePromiseProvider",
    # Drops from Mail and Photos, which promise files rather than name them (`file_drop`).
    "NSFilePromiseReceiver",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSView",
    # The refresh the terminal's guesses are timed against (`display_refresh`).
    "NSScreen",
    # System shortcuts are taken only while this app is frontmost (`system_keys`).
    "NSRunningApplication",
    # A remote tile's keys, taken before the text system composes them (`keyboard`), and the
    # media keys the tap reads (`system_keys`).
    "NSEvent",
    "NSApplication",
    "block2",
    # The browser tile (`web`): its first responder, the key and click watch, the snapshot.
    "NSBitmapImageRep",
    "objc2-core-foundation",
    # The Mac waking, its screens and its session (`resume`).
    "NSWorkspace",
    # The Dock tile's progress bar (`dock`).
    "NSControl",
    "NSImageView",
    "NSProgressIndicator",
] }
objc2-web-kit = { workspace = true, features = [
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKSnapshotConfiguration",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
# Each worker's home in Finder, the app's half (`files`): the domains, their switch-on, and
# the directory the extension reads.
objc2-file-provider = { workspace = true, features = [
    "block2",
    "Extension",
    "NSFileProviderDomain",
    "NSFileProviderItem",
] }
objc2-finder-sync.workspace = true
# The signing team, which the shared container is named for (`files`).
objc2-security = { workspace = true, features = [ "CSCommon", "SecCode" ] }
serde_json.workspace = true
slopty-core.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# A trashed entry's deletion date in local time, as the freedesktop.org trash asks (`trash`).
libc.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio.workspace = true
objc2-game-controller.workspace = true
objc2-core-foundation.workspace = true
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIResponder",
    "block2",
    # The clipboard (`pasteboard`) and the iPad's file drops (`file_drop`).
    "UIPasteboard",
    "UIDropInteraction",
    "UIDragItem",
    "UIDragSession",
    "UIInteraction",
    # Worker files dragged out of an iPad, lifted as their kind's icon (`file_drop::out`).
    "UIDragInteraction",
    "UITargetedDragPreview",
    "UITargetedPreview",
    "UIDragPreviewParameters",
    "UIPreviewParameters",
    "UIImageView",
    # The Files picker, shown over the key window's controller (`file_drop::picker`).
    "UIDocumentPickerViewController",
    "UIViewController",
    "UIWindow",
    # The browser tile (`web`): its view and the snapshot.
    "UIView",
    # The refresh the terminal's guesses are timed against (`display_refresh`).
    "UIScene",
    "UIWindowScene",
    "UIScreen",
    "UIImage",
    "objc2-core-foundation",
    # The system's paste button, which pastes without the prompt (`paste_control`).
    "UIControl",
    "UIPasteControl",
    "UIPasteConfiguration",
    "UIPasteConfigurationSupporting",
    "UIButtonConfiguration",
    "UIColor",
] }
objc2-web-kit = { workspace = true, features = [
    "block2",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKSnapshotConfiguration",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }

[dev-dependencies]
tempfile.workspace = true
# The Linux service tests stand in for `loginctl` behind a lock.
parking_lot.workspace = true
# The install plan's JSON, as the CLI prints it for a deploy (`service::Ptyd`).
serde_json.workspace = true

# What only the main thread sees: Finder's view of a download's progress, which Foundation hands
# to a subscriber there, and a browser page's Web Inspector. Its own harness, so its tests run
# there (`tests/main_thread.rs`).
[[test]]
name = "main_thread"
harness = false
