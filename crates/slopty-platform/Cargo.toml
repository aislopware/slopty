[package]
name = "slopty-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Process-level platform helpers shared by the Slopty apps and daemons (macOS, iOS, Linux)"

[lints]
workspace = true

[dependencies]
# Whose runtime directory a Linux socket falls back to (`dirs`); on Apple, also whether the run
# that left a drop's landing behind is still alive (`file_drop::sweep`).
rustix.workspace = true
tracing.workspace = true
# The daemons' `LaunchAgent` definitions (`service`), written and read back.
plist.workspace = true
# The wait for launchd to let go of an agent before it is loaded again (`service`).
tokio.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-audio-toolbox.workspace = true
# The clipboard origin marker's type and format (`transfer::ORIGIN_TYPE`), shared with the worker.
slopty-proto.workspace = true
block2.workspace = true
# A drop's files, received off the main thread, reach the app on it (`file_drop`).
dispatch2.workspace = true
# A drop's landing, shared by the callbacks its files arrive on (`file_drop`).
parking_lot.workspace = true
# A thread's QoS class (`user_interactive_thread`): pthread/qos.h, which rustix does not wrap.
libc.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSURL",
    "NSURLRequest",
    "NSValue",
    "NSDictionary",
    "NSOperation",
    "NSError",
    # The iOS pasteboard's promises and the iPad's drops (`pasteboard`, `file_drop`).
    "NSItemProvider",
    "NSProgress",
    "block2",
    # A page's ⌘Z and ⇧⌘Z go to its own undo manager (`web`).
    "NSUndoManager",
    # Whether the app runs from a bundle, which the notification centre needs (`notify`).
    "NSBundle",
] }
# Local notifications, their taps and the icon badge (`notify`).
objc2-user-notifications = { workspace = true, features = [
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The session tap that takes system shortcuts for a remote Mac (`system_keys`).
objc2-core-graphics = { workspace = true, features = [ "CGEvent", "CGEventTypes" ] }
objc2-core-foundation = { workspace = true, features = [ "CFMachPort", "CFRunLoop" ] }
objc2-app-kit = { workspace = true, features = [
    "NSPasteboardItem",
    "NSFilePromiseProvider",
    # Drops from Mail and Photos, which promise files rather than name them (`file_drop`).
    "NSFilePromiseReceiver",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSView",
    # The refresh the terminal's guesses are timed against (`display_refresh`).
    "NSScreen",
    # System shortcuts are taken only while this app is frontmost (`system_keys`).
    "NSRunningApplication",
    "block2",
    # The browser tile (`web`): its first responder, the key and click watch, the snapshot.
    "NSBitmapImageRep",
    "objc2-core-foundation",
    # The Dock tile's progress bar (`dock`).
    "NSControl",
    "NSImageView",
    "NSProgressIndicator",
] }
objc2-web-kit = { workspace = true, features = [
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKSnapshotConfiguration",
    "WKWebView",
    "WKWebViewConfiguration",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio.workspace = true
objc2-game-controller.workspace = true
objc2-core-foundation.workspace = true
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIResponder",
    "block2",
    # The clipboard (`pasteboard`) and the iPad's file drops (`file_drop`).
    "UIPasteboard",
    "UIDropInteraction",
    "UIDragItem",
    "UIDragSession",
    "UIInteraction",
    # Worker files dragged out of an iPad, lifted as their kind's icon (`file_drop::out`).
    "UIDragInteraction",
    "UITargetedDragPreview",
    "UITargetedPreview",
    "UIDragPreviewParameters",
    "UIPreviewParameters",
    "UIImageView",
    # The Files picker, shown over the key window's controller (`file_drop::picker`).
    "UIDocumentPickerViewController",
    "UIViewController",
    "UIWindow",
    # The browser tile (`web`): its views, the tap that focuses it, the snapshot.
    "UIView",
    "UIEvent",
    # The refresh the terminal's guesses are timed against (`display_refresh`).
    "UIScene",
    "UIWindowScene",
    "UIScreen",
    "UIImage",
    "objc2-core-foundation",
    # The system's paste button, which pastes without the prompt (`paste_control`).
    "UIControl",
    "UIPasteControl",
    "UIPasteConfiguration",
    "UIPasteConfigurationSupporting",
    "UIButtonConfiguration",
    "UIColor",
] }
objc2-web-kit = { workspace = true, features = [
    "block2",
    "WKNavigation",
    "WKNavigationDelegate",
    "WKSnapshotConfiguration",
    "WKWebViewConfiguration",
] }

[dev-dependencies]
tempfile.workspace = true
