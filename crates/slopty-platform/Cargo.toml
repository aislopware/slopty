[package]
name = "slopty-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Process-level platform helpers shared by the Slopty apps and daemons (macOS, iOS)"

[lints]
workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-audio-toolbox.workspace = true
# The clipboard origin marker's type and format (`transfer::ORIGIN_TYPE`), shared with the worker.
slopty-proto.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSURL",
    "NSDictionary",
    "NSOperation",
    "NSError",
] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSPasteboardItem",
    "NSFilePromiseProvider",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSView",
    "block2",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio.workspace = true
objc2-game-controller.workspace = true
objc2-ui-kit = { workspace = true, features = [ "UIApplication", "UIResponder", "block2" ] }
