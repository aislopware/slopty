[package]
name = "slopty-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty GPUI views and elements: terminal, workspace, chrome"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# A file tile's picture or PDF, shared with its link without a copy (`file::decode`).
bytes.workspace = true
core-foundation.workspace = true
core-video.workspace = true
gpui.workspace = true
# A stream's `VideoLayer` (`screen::glass`).
gpui_apple.workspace = true
gpui-kit.workspace = true
# A worktree's branch named from the first message, a Latin letter's marks folded away
# (`workspace::starting`).
icu_normalizer.workspace = true
icu_properties.workspace = true
# The formats the model reads, for fitting a pasted picture (`terminal::attachment`); GPUI
# already builds these decoders, so the binary grows by nothing.
image = { workspace = true, features = [ "gif", "jpeg", "webp" ] }
# A file tile's picture or PDF, decoded or drawn at the size the tile shows it (`file::decode`).
objc2-core-foundation = { workspace = true, features = [ "CFData", "CFDate", "CFTimeZone" ] }
objc2-core-graphics = { workspace = true, features = [
    "CGAffineTransform",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGPDFDocument",
    "CGPDFPage",
] }
# GPUI's surface takes `objc2-core-video`'s pixel buffer; a remote picture is handed to it as one
# (`screen::glass::surface`).
objc2-core-video.workspace = true
objc2-image-io = { workspace = true, features = [
    "CGImageProperties",
    "CGImageSource",
    "objc2-core-graphics",
] }
# What a stream's decoder thread, its layer's reports and the view share (`screen::glass`).
parking_lot.workspace = true
# The palette's, the pickers' and the symbols' fuzzy match (`fuzzy`).
nucleo-matcher.workspace = true
rustc-hash.workspace = true
regex.workspace = true
# The native view under the window, where a browser tile's page goes (`browser`).
raw-window-handle.workspace = true
# Which lines an agent's edit changed, when a file tile reads its file again (`file`).
similar.workspace = true
# Which of Claude Code's commands open a dialog in its terminal, as its build says
# (`slopty_agent::commands`). The captured sessions feed the face's tests too.
slopty-agent.workspace = true
slopty-client.workspace = true
slopty-platform.workspace = true
slopty-core.workspace = true
slopty-grid.workspace = true
slopty-predict.workspace = true
slopty-proto.workspace = true
# The settings form's rows: every key of `settings.toml` with its type, default and range
# (`settings_form`).
slopty-settings.workspace = true
slopty-theme.workspace = true
# The device's layout, saved as `layout.json`, and its drafts, as `drafts.json` (`workspace`).
serde.workspace = true
serde_json.workspace = true
# Syntax colouring for a file tile and a fenced code block (`highlight`).
syntect.workspace = true
two-face.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# `a11y::tree` for the self-test socket (`slopty/e2e`); tests get it through `cfg(test)`.
e2e = [ "gpui/test-support" ]

[dev-dependencies]
gpui = { workspace = true, features = [ "test-support" ] }
# The platform's own text system (Core Text), for the grid's paint oracle to shape and
# rasterise real glyphs (`terminal::view::paint_oracle`).
gpui_platform = { workspace = true, features = [ "font-kit" ] }
slopty-client = { workspace = true, features = [ "headless" ] }
tempfile.workspace = true
