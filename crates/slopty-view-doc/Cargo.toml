[package]
name = "slopty-view-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Clippy lints this code trips, allowed by name.
[lints.clippy]
cloned_ref_to_slice_refs = "allow"
explicit_counter_loop = "allow"
large_enum_variant = "allow"

[dependencies]
slopty-view-proto = { path = "../slopty-view-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
similar = "3"

# Rustdoc lints these docs trip under the check (private items, warnings denied), allowed by name.
[lints.rustdoc]
broken_intra_doc_links = "allow"
invalid_html_tags = "allow"
private_intra_doc_links = "allow"
