[package]
name = "slopty-visual"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sandboxed Luau runtime for agent visuals: scripts build a native element tree, canvas drawings, and 3D scenes"

[dependencies]
# Luau, vendored and built by `cc` (`luau0-src`); it builds and runs on iOS too
# (docs/decisions/ui.md, "Agent visuals adopted").
mlua = { version = "0.12.2", features = ["luau"] }
# The GLSL compiler wgpu uses, so a shader is validated exactly as it will run. slopty: the
# workspace's, at the wgpu revision GPUI builds (one naga in the graph).
naga = { workspace = true, features = ["glsl-in"] }
# glTF models (`s:model`): `.glb` or self-contained `.gltf`.
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_emissive_strength"] }
# Texture and environment-map assets.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "webp"] }
thiserror.workspace = true
# Images embedded in glTF models as data URIs.
base64 = "0.22"

# slopty: upstream code that clippy 1.99's defaults flag, allowed by name rather than edited, so
# the copy stays diffable (docs/decisions/ui.md).
[lints.clippy]
chunks_exact_to_as_chunks = "allow"
