[package]
name = "slopty-visual-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "GPU rendering for agent visuals: shaders and 3D scenes drawn offscreen with wgpu"

[lints]
workspace = true

[dependencies]
slopty-visual = { path = "../slopty-visual" }
# Already GPUI's renderer on Linux; here it draws offscreen on every desktop. The
# workspace's, at the revision GPUI builds (one wgpu in the graph).
wgpu = { workspace = true, features = ["glsl"] }
pollster = "1.0"
# The pipeline and texture caches, shared by every visual's render.
parking_lot.workspace = true
tracing.workspace = true

[dev-dependencies]
# Test textures and environment maps.
image = { version = "0.25.10", default-features = false, features = ["png"] }
