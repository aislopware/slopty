[package]
name = "slopty-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty worker core: session actors (engine + PTY), fan-out, session manager"

[lints]
workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
ec4rs.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
libc.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
# The still pictures orchestration takes, as PNG.
png.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
slopty-agent.workspace = true
slopty-capture.workspace = true
slopty-codec.workspace = true
slopty-core.workspace = true
slopty-engine.workspace = true
slopty-input.workspace = true
slopty-media.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
slopty-pty.workspace = true
# This machine's LAN ports for its caps, and the magic packet it sends for a sleeping peer.
slopty-tailnet.workspace = true
slopty-vdisplay.workspace = true
thiserror.workspace = true
rustix.workspace = true
tokio.workspace = true
tracing.workspace = true

# The main queue the virtual displays live on (`screen::sized`).
[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
objc2.workspace = true
# A worktree's index follows its whole tree on one FSEvents stream (`find::watch`).
objc2-core-foundation = { workspace = true, features = [ "CFArray", "CFString" ] }
objc2-core-services = { workspace = true, features = [ "FSEvents", "dispatch2" ] }
# Xcode's version, read from its `version.plist` rather than by running `xcodebuild` (`facts`).
plist.workspace = true

[dev-dependencies]
# The encoder's measurement surface (VBV mode, property probes) for `tests/screen.rs`.
slopty-codec = { workspace = true, features = [ "experiments" ] }
slopty-client.workspace = true
slopty-grid.workspace = true
# A live test's skip, which the VM lane counts as a failure (`slopty_testkit::live`).
slopty-testkit.workspace = true
tempfile.workspace = true
# Paused time for the change counts' coalescing test.
tokio = { workspace = true, features = [ "test-util" ] }

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
# FSEvents, measured against the kqueue follower in `tests/fswatch.rs`.
notify.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-video-toolbox.workspace = true
