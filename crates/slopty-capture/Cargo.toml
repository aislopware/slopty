[package]
name = "slopty-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Slopty worker's capture seam, with ScreenCaptureKit window and display capture on macOS"

[lints]
workspace = true

[dependencies]
slopty-core.workspace = true
slopty-proto.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
# `dlsym` for the window server's cursor calls (`cursor.rs`).
libc.workspace = true
objc2.workspace = true
# `block2` and `objc2-core-foundation` for the picture `tests/support/cursor_app.rs` draws.
objc2-app-kit = { workspace = true, features = [ "block2", "objc2-core-foundation" ] }
objc2-application-services.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
# `CGDisplayStream` for the `kCGDisplayStreamYCbCrMatrix_*` values SCStream's colorMatrix takes,
# `CGColor` for the black its backgroundColor paints a padded surface with, `CGSession` for
# whether the Mac is locked or this session is off its screens (`console`).
objc2-core-graphics = { workspace = true, features = [ "CGDisplayStream", "CGColor", "CGSession" ] }
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
parking_lot.workspace = true
slopty-codec.workspace = true
tracing.workspace = true

# The app `tests/cursor.rs` reads a cursor of known colours from: a test app, never installed.
[[bin]]
name = "slopty-cursor-app"
path = "tests/support/cursor_app.rs"
test = false
doc = false
bench = false

[dev-dependencies]
# A live test's skip, a failure in the VM lane (`slopty_testkit::live::skip`).
slopty-testkit.workspace = true
slopty-core.workspace = true
slopty-proto.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video.workspace = true
tempfile.workspace = true
