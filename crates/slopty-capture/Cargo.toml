[package]
name = "slopty-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Slopty worker's capture seam, with ScreenCaptureKit window and display capture on macOS"

[lints]
workspace = true

[dependencies]
slopty-core.workspace = true
slopty-proto.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-application-services.workspace = true
objc2-core-audio-types.workspace = true
objc2-core-foundation.workspace = true
# `CGDisplayStream` for the `kCGDisplayStreamYCbCrMatrix_*` values SCStream's colorMatrix takes.
objc2-core-graphics = { workspace = true, features = [ "CGDisplayStream" ] }
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
parking_lot.workspace = true
slopty-codec.workspace = true
tracing.workspace = true

[dev-dependencies]
slopty-core.workspace = true
slopty-proto.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-video.workspace = true
tempfile.workspace = true
