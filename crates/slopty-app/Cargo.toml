[package]
name = "slopty-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Slopty app shell shared by the macOS and iOS apps: workspace window, worker link loop"

[lints]
workspace = true

[features]
default = [  ]
# `Window::render_to_image` for the self-test socket (`cargo xtask e2e app`): GPUI's
# test-support on the platform crate. Off in the bundle.
e2e = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "slopty-ui/e2e",
    "slopty-kit/e2e",
    "dep:gpui_ios",
    "gpui_ios?/test-support",
    "dep:image",
]

[dependencies]
anyhow.workspace = true
data-encoding.workspace = true
# `profiler`: the foreground journal and the hang monitor that files hangs as reports (`hangs`).
gpui = { workspace = true, features = [ "profiler" ] }
gpui-kit.workspace = true
# GPUI's clipboard on the pasteboard the clipboard is shared through (`pasteboard`).
gpui_platform.workspace = true
serde_json.workspace = true
# A hang of the main thread, filed as a report next to the crashes (`hangs`).
slopty-crash.workspace = true
slopty-e2e.workspace = true
slopty-client.workspace = true
slopty-core.workspace = true
slopty-deploy.workspace = true
slopty-net.workspace = true
slopty-platform.workspace = true
slopty-proto.workspace = true
slopty-settings.workspace = true
slopty-tailnet.workspace = true
slopty-theme.workspace = true
slopty-kit.workspace = true
slopty-terminal.workspace = true
slopty-ui.workspace = true
tokio.workspace = true
tracing.workspace = true
# The app's window: the shell on the workspace (`interface`), with the Tokio bridge it
# runs its engine calls on, and its deep-link channel.
futures.workspace = true
gpui_tokio.workspace = true
slopty-view-proto.workspace = true
slopty-shell.workspace = true
# The self-test's surface material (`e2e`, `Command::Surface`).
slopty-shell-theme.workspace = true
# A render's frame put over its fixed backdrop (`e2e::over_backdrop`), with the `e2e` feature.
image = { workspace = true, optional = true }

# The test socket's UIKit-boundary delivery (`gpui_ios::inject`), with the `e2e` feature.
[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = [ "test-support" ] }
# `a11y::tree`, for a test to read what a screen reader hears.
slopty-kit = { workspace = true, features = [ "e2e" ] }
slopty-ui = { workspace = true, features = [ "e2e" ] }
tempfile.workspace = true
