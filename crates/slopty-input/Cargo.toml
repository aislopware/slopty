[package]
name = "slopty-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The Slopty worker's input and clipboard seams, with CGEvent injection and NSPasteboard on macOS"

[lints]
workspace = true

[dependencies]
slopty-capture.workspace = true
slopty-proto.workspace = true
thiserror.workspace = true
# The pointer a cursor loop waits on (`pointer`), and the input source's answers (`sources`).
tokio.workspace = true
# The input-source claims every stream shares (`sources`), and the Caps Lock claim.
parking_lot.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The input source is selected on the main queue (`sources`).
dispatch2.workspace = true
objc2.workspace = true
# The live gesture test's own app follows a swipe as Safari does (`tests/support/gesture_app.rs`).
objc2-app-kit = { workspace = true, features = [ "block2" ] }
block2.workspace = true
# A copied file named by reference resolved to its path (`pasteboard`).
# The spring delay a resting drag is nudged after (`nudge`).
objc2-foundation = { workspace = true, features = [ "NSURL", "NSRunLoop", "NSUserDefaults" ] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
# Caps Lock through the HID system (`backend`).
objc2-io-kit.workspace = true
libc.workspace = true
# The input thread's QoS class (`thread`), the input sources (`sources`), the key constants.
slopty-platform.workspace = true

[dev-dependencies]
slopty-core.workspace = true
slopty-proto.workspace = true
# A live test's skip, which the VM lane counts as a failure (`slopty_testkit::live`).
slopty-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [ "macros", "rt-multi-thread", "test-util", "time" ] }

# A measurement with a real `NSApplication` on the main thread, which libtest does not give a
# test; opt-in (`SLOPTY_MEASURE=1`), and it lists no test to a runner.
[[test]]
name = "key_path"
harness = false

# The live gesture test's own app, which it spawns and posts to: the one process a test here
# posts gestures to (`tests/inject.rs`).
[[bin]]
name = "slopty-gesture-app"
path = "tests/support/gesture_app.rs"
test = false
doc = false
bench = false
