# Slopty's macOS jobs on jmango360's two office Macs, the GitLab runners 834 and 842 (tart's custom
# executor), only while they are idle: jmango360's iOS builds come first. This is
# xtask/src/gitlab/ci.yml in github.com/aislopware/slopty; `cargo xtask gitlab publish` makes it
# the .gitlab-ci.yml of cong.tran/slopty-ci, which holds nothing else. `cargo xtask gitlab run`
# triggers a pipeline here for one commit and follows it; the names below are the ones it sends
# (`xtask/src/gitlab.rs`, whose tests read this file):
#   SLOPTY_TAG   the Mac's runner tag, so the job goes to that Mac alone;
#   SLOPTY_SHA   the commit; empty, the job only brings the image onto the Mac (`gitlab warm`);
#   SLOPTY_ARGS  the xtask commands, one per line, run one after another;
#   SLOPTY_IMAGE the guest's image, when not the one pinned here;
#   SLOPTY_PROBE a shell command run after the tools and before the commands, for trying a step
#                in the guest (`--var SLOPTY_PROBE=...`), as check.yml's `probe` on a hosted one.
# The project's own variables: SLOPTY_ZOT_USER and SLOPTY_ZOT_SECRET (the read-only account that
# pulls the image from Zot on office-1, the office LAN's registry), SLOPTY_R2_KEY_ID and
# SLOPTY_R2_SECRET (sccache's bucket), and GITLAB_READ_TOKEN (the guard reads its Mac's queue);
# the secrets masked.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"

variables:
  # The pinned image, by digest (`cargo xtask vm ci-image --push` prints it): macOS 27.0 with
  # Xcode 27.1, Rust and the gate's tools (xtask/src/vm.rs, "ci-image").
  SLOPTY_IMAGE: zot.jmango360.dev/slopty/macos-27-ci@sha256:2fbbf766588c6d5d1f88cdd448e3466b1c6227e0558ce31fc6c841727a930049
  GIT_STRATEGY: none

slopty:
  rules:
    - if: $SLOPTY_TAG
  tags: [$SLOPTY_TAG]
  image: $SLOPTY_IMAGE
  # A newer pipeline here cancels this one; jmango360's jobs wait behind it no more than the
  # guard's poll (`xtask gitlab guard`) or the bridge's cancel (`xtask gitlab run`).
  interruptible: true
  # The gate's Mac side (every test shard in one build, then the e2e smoke) takes about 20
  # minutes cold; a hung run gives the Mac back at this.
  timeout: 1h
  # 75 (EX_TEMPFAIL) is a yield: the Mac was wanted, or the job could not start (a fetch that
  # failed). The caller runs the job on GitHub instead. tart's executor passes the guest's exit
  # status on to GitLab (BUILD_EXIT_CODE_FILE).
  allow_failure:
    exit_codes: [75]
  variables:
    # The image is pinned by digest, so a held copy is the image: pull only when absent.
    TART_EXECUTOR_ALWAYS_PULL: "false"
    # Zot ends a request after a minute and tart resumes a layer from where it broke five times,
    # so a layer (up to 512 MiB) must get a fifth of itself a minute: three at once on the Mac
    # mini's 11 MB/s link get 220 MB each, as fast as eight would together.
    TART_EXECUTOR_PULL_CONCURRENCY: "3"
    # The guest's display in pixels, at 72 ppi: one pixel a point, as on GitHub's Macs, where the
    # render goldens are drawn. In points (tart's default) the guest takes the host's main
    # screen's scale, 2 on the Mac mini, and drew every frame at twice the golden's size (job
    # 356771).
    TART_EXECUTOR_DISPLAY: 1920x1080px
    TART_REGISTRY_USERNAME: $SLOPTY_ZOT_USER
    TART_REGISTRY_PASSWORD: $SLOPTY_ZOT_SECRET
    # The paths of GitHub's macOS runners, so a unit sccache stored there is a hit here and the
    # other way round: rustc's arguments name the registry's sources under CARGO_HOME and the
    # checkout's directory.
    CARGO_HOME: /Users/runner/.cargo
    RUSTUP_HOME: /Users/runner/.rustup
    SLOPTY_WORK: /Users/runner/work/slopty/slopty
    RUSTUP_TOOLCHAIN: 1.99.1
    DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    SCCACHE_BUCKET: slopty-ci-sccache
    SCCACHE_ENDPOINT: https://aaa05f0153bcd0fc4c7efb7f785401c8.r2.cloudflarestorage.com
    SCCACHE_REGION: auto
    SCCACHE_S3_KEY_PREFIX: macOS-ARM64/
    AWS_ACCESS_KEY_ID: $SLOPTY_R2_KEY_ID
    AWS_SECRET_ACCESS_KEY: $SLOPTY_R2_SECRET
    # The job's steps, which the guard runs: fetch the commit, build its xtask, install its tools
    # and run its commands (`xtask gitlab job`). A step that could not start the job yields.
    SLOPTY_STEPS:
      expand: false
      value: |
        yield() { echo "slopty-gitlab: yielded: $1"; exit 75; }
        # Rust's tools on the steps' own PATH, and none on a login shell's, as on a hosted Mac:
        # the e2e worker reads its facts through the login shell's PATH with a home of the
        # test's own, where rustup's proxy began installing the whole toolchain for every
        # worker and was cut at the 10 s bound of the first facts (`VERSION_WAIT`), over the
        # Mac mini's link. The pinned image still lists the tools in /etc/paths.d (made before
        # `xtask vm ci-image` stopped writing it).
        export PATH="$CARGO_HOME/bin:$PATH"
        sudo rm -f /etc/paths.d/10-cargo
        mkdir -p "$SLOPTY_WORK" && cd "$SLOPTY_WORK"
        git init -q && git remote add origin https://github.com/aislopware/slopty
        git fetch -q --depth 1 origin "$SLOPTY_SHA" || yield "could not fetch $SLOPTY_SHA"
        git checkout -q FETCH_HEAD
        git submodule update -q --init --recursive --depth 1 || yield "could not fetch the submodules"
        cp .cargo/ci-profile.toml "$CARGO_HOME/config.toml"
        CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
          --package xtask || yield "could not build xtask"
        export SLOPTY_XTASK="$PWD/target/xtask/debug/xtask"
        "$SLOPTY_XTASK" setup --lane tests || yield "could not install the tools"
        if [ -n "${SLOPTY_PROBE:-}" ]; then /bin/bash -c "$SLOPTY_PROBE" || echo "probe: exit $?"; fi
        "$SLOPTY_XTASK" gitlab job --reports "$CI_PROJECT_DIR/reports"
  script:
    - if [ -z "$SLOPTY_SHA" ]; then sysctl -n hw.ncpu hw.memsize; cat /etc/slopty-ci-image; exit 0; fi
    # The image's own xtask watches the Mac's queue from the first step: GitLab's cancel reaches
    # the runner only with its next log update (every 60 s by default), the guard's in seconds.
    - '[ -x /usr/local/bin/slopty-xtask ] || { echo "slopty-gitlab: yielded: no guard"; exit 75; }'
    - /usr/local/bin/slopty-xtask gitlab guard -- /bin/bash -eo pipefail -c "$SLOPTY_STEPS"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [reports/]
    reports:
      junit: reports/**/junit*.xml
