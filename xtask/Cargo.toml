[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Slopty automation: gates, builds, bundles, measurements"

[lints]
workspace = true

# A library with a binary of one call over it: sccache caches a library but never a binary, and
# every CI job compiles xtask before anything else (`cargo xtask setup`), so an unchanged xtask is
# linked from the cache instead of compiled (MEASUREMENTS 2026-10-02, "the tests lane's build").
# The unit tests and the docs are the library's.
[[bin]]
name = "xtask"
path = "src/main.rs"
doc = false
test = false

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
# The official Claude Code tarball's SHA-512, as the npm registry writes it (`claude`).
data-encoding.workspace = true
objc2-core-foundation.workspace = true
xshell.workspace = true
resvg.workspace = true
icns.workspace = true
# `cargo xtask vm` removes its run's guest on SIGINT, SIGTERM or SIGHUP (`signal`).
libc.workspace = true
# `symbolicate` reads the crash reports Slopty writes, and demangles what `atos` names.
slopty-crash.workspace = true
rustc-demangle.workspace = true
serde.workspace = true
serde_json.workspace = true
# `statvfs`: the free space `xtask prune` and the gate keep on the build volume.
rustix.workspace = true
# The daemons' footprint, descriptors and threads for `soak`, and the percentiles.
slopty-testkit.workspace = true
toml.workspace = true
# `codex fixtures` speaks to a real app-server over its WebSocket control socket.
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
# The icon tests read ictool's PNGs with their colour profile and 16-bit samples; tiny-skia's
# decoder drops both.
png.workspace = true
