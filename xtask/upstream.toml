# Where each fork branch sits on its upstream. `cargo xtask upstream check` reads this (and the
# gate warns when a fork was last known current more than seven days ago); `cargo xtask upstream
# sync` rebases the fork, pushes it, moves the workspace pins and rewrites the `base` /
# `base_date` / `checked` lines here, so drift shows up in git history. `checked` is the day a
# sync last confirmed the fork current: a quiet upstream keeps an old `base_date`, and the gate
# warns from the later of the two dates. `checkout` is relative to the main checkout of this
# repository (shared by every worktree) and is cloned on first use.

[zed]
upstream = "https://github.com/zed-industries/zed.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/zed.git"
branch = "main"
checkout = ".research/zed-main"
base = "397cbc84de333eeb56849dc90782d365b37e60d7"
base_date = "2026-09-25"
checked = "2026-09-25"

[gpui-kit]
upstream = "https://github.com/longbridge/gpui-kit.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/gpui-kit.git"
branch = "main"
checkout = ".research/gpui-kit"
base = "d565fd575618e4fdc016edd064eb4f14d0472480"
base_date = "2026-09-25"
checked = "2026-09-25"

[libghostty-rs]
upstream = "https://github.com/Uzaaft/libghostty-rs.git"
upstream_branch = "master"
fork = "https://github.com/aislopware/libghostty-rs.git"
branch = "master"
checkout = ".research/libghostty-rs"
base = "5988a0b78b4aa804d1c12e66bbfe662bd97d81c0"
base_date = "2026-09-01"
checked = "2026-09-25"
