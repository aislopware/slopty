# Where each fork branch sits on its upstream. `cargo xtask upstream check` reads this;
# `cargo xtask upstream sync` rebases the fork, pushes it, moves the workspace pins and rewrites
# the `base` / `base_date` / `checked` lines here, so drift shows up in git history. `checked` is
# the day a sync last confirmed the fork current: a quiet upstream keeps an old `base_date`.
# Once the later of the two dates is `check_every_days` old (0: always), the gate asks the upstream
# for its branch head and warns when it moved past `base`. `checkout` is relative to the main
# checkout of this repository (shared by every worktree) and is cloned on first use.

[zed]
upstream = "https://github.com/zed-industries/zed.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/zed.git"
branch = "main"
checkout = ".research/zed-main"
base = "dd510f99e04e7a5b464f9a4e8771fa978ada138b"
base_date = "2026-09-28"
checked = "2026-09-28"
check_every_days = 7

[gpui-kit]
upstream = "https://github.com/longbridge/gpui-kit.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/gpui-kit.git"
branch = "main"
checkout = ".research/gpui-kit"
base = "25d59c06f45cd81a02c5b9d5b81d32ee4985f87d"
base_date = "2026-09-28"
checked = "2026-09-28"
# It lands several changes a day, so every gate asks.
check_every_days = 0

[libghostty-rs]
upstream = "https://github.com/Uzaaft/libghostty-rs.git"
upstream_branch = "master"
fork = "https://github.com/aislopware/libghostty-rs.git"
branch = "master"
checkout = ".research/libghostty-rs"
base = "8953a740bc378cec3e07e1f6ca949f0595eab19b"
base_date = "2026-09-28"
checked = "2026-09-28"
check_every_days = 7
