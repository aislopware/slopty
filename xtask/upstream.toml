# Where each source Slopty builds on stands on its upstream. `cargo xtask upstream check` reads
# this; `cargo xtask upstream sync` takes each upstream into its fork (a rebase, or a merge where
# `strategy` says so), imports zed into the gpui-fast fork, pushes, moves the workspace pins and
# rewrites the `base` / `base_date` / `checked` lines here, so drift shows up in git history.
# `sync` also re-pins libghostty-rs to the ghostty fork and moves `vendor/ghostty`.
# `checked` is the day a sync last confirmed the source current: a quiet upstream keeps an old
# `base_date`. Once the later of the two dates is `check_every_days` old (0: always), the gate
# asks the upstream for its branch head and warns when it moved past `base`. `checkout` is
# relative to the main checkout of this repository (shared by every worktree) and is cloned on
# first use.

# GPUI. The fork's zed imports are merges of vendor commits beside its branch, which a rebase
# would replay or drop, so it merges longbridge's branch in. It lands changes most days, so every
# gate asks.
[gpui-fast]
upstream = "https://github.com/longbridge/gpui-fast.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/gpui-fast.git"
branch = "main"
checkout = ".research/gpui-fast"
strategy = "merge"
base = "7fcd37e6ef8caf212e484d5a8e4cd971dad690e1"
base_date = "2026-10-31"
checked = "2026-10-31"
check_every_days = 0

# zed is not forked: the gpui-fast fork imports it (its `UPSTREAM` file and
# `docs/upstream-sync.md`). `base` is the zed commit the fork is known current with; the zed
# clone lends its objects only.
[zed]
upstream = "https://github.com/zed-industries/zed.git"
upstream_branch = "main"
checkout = ".research/zed-main"
base = "14b7b0ef3764d62a85070c8b5ccea105a2ad3235"
base_date = "2026-10-30"
checked = "2026-10-31"
check_every_days = 7

[gpui-kit]
upstream = "https://github.com/longbridge/gpui-kit.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/gpui-kit.git"
branch = "main"
checkout = ".research/gpui-kit"
strategy = "rebase"
base = "944803984cf0ba3111861d6e1aa9d6265c109ff9"
base_date = "2026-10-29"
checked = "2026-10-29"
# It lands several changes a day, so every gate asks.
check_every_days = 0

# The terminal. `vendor/ghostty` is a submodule on the fork, whose `main` carries our commits on
# ghostty-org's `main`. `sync` merges upstream in the worktree `.research/ghostty`, never in
# `vendor/ghostty`, so the fork only moves forward and a pinned commit is never rewritten. It
# re-pins libghostty-rs (`GHOSTTY_COMMIT`, bindings) and builds and tests the binding against the
# merged tree before pushing anything; `vendor/ghostty` then moves to the
# pushed head. Upstream lands a dozen or more commits a day, about a third of them in what
# libghostty-vt builds from: `paths` is that part (the terminal, its C API and headers, the SIMD
# and Unicode code the parser and grid call, the key and mouse encoders we use, the lib-vt build
# and the Zig and dependency pins, and what the terminal imports from outside them: the data
# structures, the C ABI and allocator glue, and the small memory, assertion and checksum
# helpers). The gate asks once a day and warns only when a move touched `paths`; `watch` names a
# head move or pull request only when it does.
[ghostty]
upstream = "https://github.com/ghostty-org/ghostty.git"
upstream_branch = "main"
fork = "https://github.com/aislopware/ghostty.git"
branch = "main"
checkout = "vendor/ghostty"
strategy = "merge"
base = "ae0dc1b7136c2baddc3e067663aa041cd555cfda"
base_date = "2026-10-30"
checked = "2026-10-31"
check_every_days = 1
paths = [
    "src/terminal/",
    "src/lib_vt.zig",
    "include/ghostty/",
    "src/simd/",
    "src/unicode/",
    "src/input/",
    "src/build/GhosttyLibVt.zig",
    "build.zig.zon",
    "src/datastruct/",
    "src/lib/",
    "src/fastmem.zig",
    "src/fastprint.zig",
    "src/quirks.zig",
    "src/quirks_memset.zig",
    "src/tripwire.zig",
    "src/crc32c.zig",
    "src/os/string_encoding.zig",
]

[libghostty-rs]
upstream = "https://github.com/Uzaaft/libghostty-rs.git"
upstream_branch = "master"
fork = "https://github.com/aislopware/libghostty-rs.git"
branch = "master"
checkout = ".research/libghostty-rs"
strategy = "rebase"
base = "575ed6b8ceb79ffaf247ecf7e34333876b0d5be4"
base_date = "2026-10-30"
checked = "2026-10-31"
check_every_days = 7

# noq is vendored, not forked: `vendor/noq-proto` is the published noq-proto 1.4.0 (tag
# `noq-proto-v1.4.0`) with our patches on top (its `SLOPTY.md`), and `base` is `main` as last
# read (2026-10-31). Nothing syncs it; `cargo xtask upstream watch` reports its head and pull
# requests, and a bump is by hand.
[noq]
upstream = "https://github.com/n0-computer/noq.git"
upstream_branch = "main"
vendored = "vendor/noq-proto"
base = "70fdbfa24ea2a96646572d40d58ea7d3a2e4d7e6"

# Releases Slopty waits for rather than forking: the gate warns once crates.io has one. objc2's
# framework crates (0.3.2) were generated from Xcode 16.4, so the few 27 calls Slopty makes are
# declared by hand; 0.4.0 is upstream's Xcode 27 release, whose core and block2 changes break
# every crate on objc2 at once, so the whole graph moves when it is out
# (`docs/decisions/platform.md`, "Floor 27").
[[awaited]]
crate = "objc2-foundation"
version = "0.4.0"
then = "move objc2, block2, dispatch2 and the framework crates to it, fork any dependency still on 0.3, and delete the hand-declared 27 calls (continued::ios, playback_audio_session, corners::CORNERS_OFF, resources)"
