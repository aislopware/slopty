# The fuzz targets (`cargo xtask fuzz`, docs/TESTING.md "Fuzzing"). Its own workspace, outside
# the main one: libFuzzer's instrumented build is nightly-only, and AFL++'s is cargo-afl's. What
# each target does lives in the library, so `tests/regressions.rs` replays every input kept under
# `regressions/` and every committed corpus under `corpus/` on a plain build, in the gate.
[package]
name = "slopty-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Fuzz targets for every decoder that faces a peer or an agent"

[package.metadata]
cargo-fuzz = true

[workspace]
members = [ "." ]

[dependencies]
arbitrary = { version = "1.4.2", features = [ "derive" ] }
bytes = "1.12.1"
libfuzzer-sys = { version = "0.4.13", optional = true }
serde = "1.0.229"
serde_json = "1.0.151"
slopty-agent = { path = "../crates/slopty-agent" }
slopty-codec = { path = "../crates/slopty-codec" }
slopty-core = { path = "../crates/slopty-core" }
slopty-engine = { path = "../crates/slopty-engine" }
slopty-grid = { path = "../crates/slopty-grid" }
slopty-markdown = { path = "../crates/slopty-markdown" }
slopty-media = { path = "../crates/slopty-media" }
slopty-proto = { path = "../crates/slopty-proto" }
slopty-testkit = { path = "../crates/slopty-testkit" }
slopty-visual = { path = "../crates/slopty-visual" }
ziggy = { version = "1.7.3", default-features = false, optional = true }

# Which engine the targets' entry points are built for (`slopty_fuzz::target!`): libFuzzer's
# (`cargo xtask fuzz` builds with it), or ziggy's, which `cargo ziggy` builds for AFL++ by
# turning on `ziggy/afl` (`cargo xtask fuzz --ziggy`); with neither, each target is a plain
# binary that runs the files it is given. `afl` names that feature so the lock holds AFL++'s
# crate.
[features]
libfuzzer = [ "dep:libfuzzer-sys" ]
afl = [ "ziggy/afl" ]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [ "cfg(fuzzing)" ] }

# The main workspace's groups and restriction lints, less the two a harness exists to break: it
# reports a finding by panicking (`panic`, `expect_used`), as the tests do under `clippy.toml`.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
str_to_string = "warn"
missing_assert_message = "warn"
module_name_repetitions = "allow"
missing_panics_doc = "allow"

# The gate's replay (`cargo test`): every crate but this one optimised, Slopty's own too, since
# none is a member here. The replay ran 2.6 s unoptimised and runs 0.4 s so, and a rebuild after
# a landing takes no longer; debug assertions and overflow checks stay on (MEASUREMENTS
# 2026-10-30, "committed fuzz corpora").
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
debug = "line-tables-only"
overflow-checks = true

