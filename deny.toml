# cargo-deny 0.20 — https://embarkstudios.github.io/cargo-deny/checks/cfg.html
[graph]
targets = [
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
all-features = false
exclude-dev = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = [ "https://github.com/rustsec/advisory-db" ]
yanked = "deny"
# Unmaintained-crate advisories reachable only through the GPUI dependency tree (gpui, gpui-kit,
# gpui-component and their font/svg/http stacks). Nothing in Slopty's own code uses them; they
# leave when upstream drops them. Re-checked whenever the zed/gpui-kit pins move.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 via syntect (gpui-component)" },
    { id = "RUSTSEC-2024-0384", reason = "instant via gpui-base, gpui-component, notify" },
    { id = "RUSTSEC-2024-0436", reason = "paste via gpui-component, metal, pulp" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile via zed-reqwest (gpui-kit)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz via usvg (gpui)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via gpui, fontdb, rustybuzz" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OpenSSL",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8
exceptions = [
    # Mozilla's CA bundle as data; permissive, data-only licence.
    { allow = [ "CDLA-Permissive-2.0" ], crate = "webpki-roots" },
    # BSD-style; pulled by gpui's http_client through async-compression.
    { allow = [ "bzip2-1.0.6" ], crate = "bzip2" },
    { allow = [ "bzip2-1.0.6" ], crate = "libbz2-rs-sys" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "openssl", reason = "rustls only" },
    { crate = "audiopus", reason = "unmaintained; use `opus`" },
    { crate = "reed-solomon-erasure", reason = "unmaintained; use reed-solomon-simd" },
    # Slopty code uses objc2 only; the legacy crates are tolerated solely inside GPUI's macOS
    # platform layer (gpui_apple/gpui_macos, metal, media) until upstream finishes its migration.
    { crate = "objc", reason = "use objc2", wrappers = [
        "cocoa",
        "cocoa-foundation",
        "gpui_apple",
        "gpui_macos",
        "media",
        "metal",
    ] },
    { crate = "cocoa", reason = "use objc2-app-kit", wrappers = [ "gpui_apple", "gpui_macos" ] },
]
skip = [  ]
skip-tree = [  ]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
allow-git = [
    "https://github.com/Uzaaft/libghostty-rs",
    "https://github.com/aislopware/zed",
    "https://github.com/aislopware/gpui-kit",
    "https://github.com/zed-industries/zed",
    "https://github.com/zed-industries/font-kit",
    # gpui's `test-support` (dev-dependency of slopty-ui) pins proptest to a git revision.
    "https://github.com/proptest-rs/proptest",
]

[sources.allow-org]
github = [ "aislopware", "zed-industries" ]
