[package]
name = "gpui_tokio"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "Zed's GPUI and Tokio bridge, which the shell runs on (vendor/gpui_tokio/README.md)"

[lib]
path = "src/gpui_tokio.rs"
doctest = false
test = false

[dependencies]
anyhow = "1"
gpui.workspace = true
gpui_util.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
