name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `.cargo/config.toml` wraps rustc in sccache; on a runner it caches to the Actions cache.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # `cargo gate`, one lane per runner. A hosted Mac has three cores and 7 GB: the five lanes
  # side by side on one of them took 80 minutes cold, each lane compiling the world on its own
  # target dir while swapping. Here each lane takes the whole runner (docs/decisions/tooling.md).
  gate:
    name: gate (${{ matrix.lane }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        lane: [ tools, clippy-host, clippy-ios, tests, rustdoc ]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # `committed` lints every commit since the last tag; the other lanes read the tree.
          fetch-depth: ${{ matrix.lane != 'tools' && 1 || 0 }}
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      # The canonical formatter is nightly rustfmt; only the tools lane formats.
      - if: matrix.lane == 'tools'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # sccache holds the compiled units; this keeps only the registry, git checkouts and the
      # installed tools, so the two do not store every unit twice in the repository's cache
      # quota. One entry serves every lane, saved by the tools lane on main: its `cargo metadata`
      # fetches every package and it installs the most tools. The toolchains are left out of the
      # key, since none of this depends on them. A key per lane saved 5 × 270 MB on each lockfile
      # change and filled the 10 GB quota the compile cache lives in (MEASUREMENTS 2026-10-01).
      # Saved on failure too: a red lane is no reason to download it all again.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.lane == 'tools' }}
      - uses: cargo-bins/cargo-binstall@main
      # libghostty-vt-sys builds its library with zig in every lane that compiles.
      - if: matrix.lane != 'tools'
        run: brew install zig
      - run: cargo xtask setup --lane ${{ matrix.lane }}
      - run: cargo xtask gate --ci --lane ${{ matrix.lane }}
      # What a slow run is read from afterwards: each test's time, each unit of the build's, and
      # how much of the build the compile cache served.
      - if: always() && matrix.lane == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: timings
          path: |
            target/**/nextest/ci/junit.xml
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      - if: always() && matrix.lane != 'tools'
        run: $SCCACHE_PATH --show-stats

  # Unsigned, un-notarized artifacts for now; Developer-ID signing + notarization land with
  # `cargo xtask dist`.
  release:
    name: release ${{ github.ref_name }}
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      # `.cargo/config.toml` wraps rustc in sccache here too.
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      # The gate's one entry of registry, git checkouts and tools; a release saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          save-if: false
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm git-cliff@2.14.1
      - run: brew install zig
      - run: cargo build --profile dist -p slopty-workerd -p slopty-ptyd
      # The binaries ship lean; their dSYMs are an artifact of their own, each under its binary's
      # UUID, which `cargo xtask symbolicate --dsyms <archive>` reads a report against.
      - run: |
          mkdir -p dist
          tar -C target/dist -czf dist/slopty-worker-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz slopty-worker slopty-ptyd
          cargo xtask dsyms --from target/dist --out target/dsyms slopty-worker slopty-ptyd
          tar -C target/dsyms -czf dist/slopty-worker-${{ github.ref_name }}-aarch64-apple-darwin-dSYMs.tar.gz .
          git cliff --latest --strip all > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: dist/*.tar.gz
