name: CI

# The gate. `cargo xtask land` pushes a commit made on main to the `gate` branch; every lane runs
# here, and `promote` fast-forwards main to that commit once all of them passed. main itself is
# never gated again: whatever it holds passed here first. A tag is gated, then released.
on:
  push:
    branches: [ gate ]
    tags: [ "v*" ]
  pull_request:

# One run at a time per ref. A newer push to `gate` waits behind the run in progress instead of
# cancelling it: that run is often most of the way to promoting main, and cancelled runs threw
# away up to 48 minutes each (10 of 41 runs; MEASUREMENTS 2026-10-02, "the tests lane's build").
# GitHub keeps one run pending per group and replaces it with each newer push, so the queue never
# grows past the newest commit, whose green covers every commit under it. A pull request's run is
# still cancelled by its next push; a tag's never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The pinned toolchain by name, in place of rust-toolchain.toml: from the file rustup installs
  # every component and target it lists into each job on its first cargo call (llvm-tools,
  # rust-analyzer, rust-src, the iOS and musl standard libraries; 1.9 GB on a runner). Each job
  # installs what it uses (`dtolnay/rust-toolchain`), and `gate::tests` holds the version to
  # the file's.
  RUSTUP_TOOLCHAIN: 1.99.1
  # Xcode 27.1, as on the Macs the gate runs here: the image selects 27.0 and carries 27.1 under
  # this name (docs/decisions/platform.md, "Xcode 27.1").
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # `.cargo/config.toml` wraps rustc in sccache; where it keeps its units is
  # .github/actions/sccache's call.

jobs:
  # `cargo gate --full`, one lane per runner. A hosted Mac has three cores and 7 GB: the five lanes
  # side by side on one of them took 80 minutes cold, each lane compiling the world on its own
  # target dir while swapping. Here each lane takes the whole runner (docs/decisions/tooling.md).
  # The tests lane, whose CPU-bound build bounded every run, runs as three shards of packages
  # (`xtask gate --shard`, whose test checks that this matrix lists each). Only they need a Mac:
  # the plan runs five macOS jobs at once, shared with the remote checks and the e2e, and twenty
  # jobs in all. Everything else runs on Linux: the tools lane, which reads only text; clippy for
  # Linux; and clippy and rustdoc for the Apple triples, which never link, cross-checked from an
  # arm runner with zig compiling the C build scripts compile (`tools::apple_cargo`;
  # docs/decisions/tooling.md, "Apple targets are linted on Linux").
  gate:
    # The hosted matrix gates a pull request always, and a push unless the warm runners take it.
    if: vars.SLOPTY_RUNNERS != 'warm' || github.event_name == 'pull_request'
    name: gate (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The longest lane takes about 20 min; a hung one held the queue for an hour (run
    # 37134085979), and runs on `gate` wait for each other.
    timeout-minutes: 45
    # `actions: write` lets a red lane cancel its run once a newer push waits (the last step).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The gate's free-space floor is sized for this Mac's full gate; the tools lane builds
          # xtask alone.
          - { lane: tools, os: ubuntu-24.04, disk-floor-gb: 5 }
          - lane: clippy-linux
            os: ubuntu-24.04
            disk-floor-gb: 5
            targets: >-
              x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl
          - { lane: clippy-host, os: ubuntu-24.04-arm, targets: aarch64-apple-darwin }
          - lane: clippy-ios
            os: ubuntu-24.04-arm
            targets: aarch64-apple-ios, aarch64-apple-ios-sim
          - { lane: rustdoc, os: ubuntu-24.04-arm, targets: aarch64-apple-darwin }
          # A test shard writes at most 11 GB cold (worker; ui 9, rest 8), and the xcode-27 image
          # starts with 39.6 GB free, under the full gate's 50.
          - { lane: tests, shard: ui, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
          - { lane: tests, shard: worker, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
          - { lane: tests, shard: rest, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
    env:
      SLOPTY_DISK_FLOOR_GB: ${{ matrix.disk-floor-gb }}
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # `committed` lints every commit since the last tag; the other lanes read the tree.
          fetch-depth: ${{ matrix.lane != 'tools' && 1 || 0 }}
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Each lane's own triples, and clippy only where it lints: a test shard needs neither.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: ${{ matrix.lane != 'tests' && 'rustfmt, clippy' || '' }}
          targets: ${{ matrix.targets }}
      # The canonical formatter is nightly rustfmt; only the tools lane formats.
      - if: matrix.lane == 'tools'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # sccache holds the compiled units; this holds what cargo fetches: the registry's index and
      # crates and the git dependencies' clones, one entry per lock for every job of every OS
      # (their contents name no host, and actions/cache keys Linux's and macOS's alike), saved
      # by the tools lane on the gate, last in its job (below). A job on a new lock starts from
      # the newest entry and fetches only what came since. rust-cache, keyed with no environment
      # part, kept one key for ever, so its entry was restored whole and never saved again: 17
      # days stale on 2026-10-18, it had every Mac shard download 184 crates and fetch every fork
      # again on every run (`docs/decisions/tooling.md`, "The cargo cache is keyed by the lock").
      - id: cargo-home
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # Every proc-macro dependency unoptimised: sccache cannot cache one, and the workspace's
      # `package."*"` gave them opt-level 3 (xtask/src/ci_profile.rs). Cargo reads package
      # overrides from config files only.
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # libghostty-vt-sys builds its library with zig in the lanes that build it, and the Apple
      # lints on Linux compile their build scripts' C with it: the zig the vendored ghostty
      # names, not Homebrew's, which moves on its own.
      - if: matrix.lane != 'tools'
        uses: ./.github/actions/zig
      # libghostty-vt built once per set of inputs (`LIBGHOSTTY_VT_SYS_PREBUILT_DIR`), the head
      # of the build in most lanes: kept per lane, since each builds its own triples, and keyed
      # by the ghostty revision and the binding's, which a new entry needs. The build checks
      # every other input itself, so an entry for another zig or SDK is never used. The Apple
      # lints on Linux skip that build (`DOCS_RS`, `tools::apple_cargo`): they never link it.
      # clippy-host's fuzz replay does build it, once the lint's environment is gone, so that
      # lane keeps its build and its packages too (a codeberg.org fetch inside its build script
      # failed run 41037072359).
      - if: >-
          matrix.lane == 'clippy-linux' || matrix.lane == 'tests' || matrix.lane == 'clippy-host'
        id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - if: >-
          matrix.lane == 'clippy-linux' || matrix.lane == 'tests' || matrix.lane == 'clippy-host'
        id: prebuilt
        uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: >-
            ghostty-prebuilt-${{ runner.os }}-${{ matrix.lane }}${{ matrix.shard }}-${{
            steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786). Only a lane that builds libghostty-vt needs them: one whose build of
      # it came from the cache does not.
      - if: >-
          (matrix.lane == 'clippy-linux' || matrix.lane == 'tests' || matrix.lane == 'clippy-host')
          && steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: >-
          (matrix.lane == 'clippy-linux' || matrix.lane == 'tests' || matrix.lane == 'clippy-host')
          && steps.prebuilt.outputs.cache-hit != 'true'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # The icon test's verdicts (xtask/src/icon/tests.rs): on inputs it passed on before it
      # skips actool and ictool, 103 s beside the shard's other tests. Keyed by the runner's
      # image and the icon's sources; the test hashes those and the document it generates.
      - if: matrix.shard == 'rest'
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: matrix.shard == 'rest'
        uses: actions/cache@v6
        with:
          path: target/verdicts
          key: >-
            verdicts-${{ runner.os }}-${{ steps.image.outputs.version }}-${{
            hashFiles('assets/icon.svg', 'xtask/src/icon.rs', 'xtask/src/icon/**') }}
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      # binstall asks the GitHub API where a tool's release is. Unauthenticated, that hit the
      # runner's shared rate limit in a third of the test lanes, timed out and compiled nextest
      # from source: 5 to 8 minutes instead of 3 seconds (.research/dev-speed-2026-10-05.md).
      # The job's own token is read-only.
      - run: xtask setup --lane ${{ matrix.lane }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A failed lane writes the run's summary: the lane, its failed step and the failed tests.
      # The tests lane counts who holds the pseudo-terminals while it runs (`xtask/src/ptys.rs`)
      # and fails on a leak, on more than its budget, or on running out.
      # What a Mac shard ran on, and at its end how hard it pressed the machine, so a slow run
      # is told apart as a slow host or a full one (the test shards' times swing ±100 s).
      - if: runner.os == 'macOS'
        run: sysctl hw.model machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: >-
          xtask gate --ci --lane ${{ matrix.lane }}
          ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      # What a slow run is read from afterwards: each test's time, each unit of the build's, how
      # much of the build the compile cache served, and the pseudo-terminals held every 200 ms.
      - if: always() && matrix.lane == 'tests'
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.shard }}
          path: |
            target/**/nextest/ci/junit*.xml
            target/**/nextest/ci/ptys.log
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      # The cargo cache's entry for this lock, when none has it: every package of every platform,
      # the lock's alone, so an entry started from an older one keeps none of its versions. Last
      # in the tools lane, the job that ends first (a minute), on Linux, where it takes seconds:
      # on a Mac the same save took two minutes (run 38126044772).
      - id: fetch
        if: >-
          always() && github.ref == 'refs/heads/gate' && matrix.lane == 'tools'
          && steps.cargo-home.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          sed -n 's/^name = "\(.*\)"$/\1/p; s/^version = "\(.*\)"$/\1/p' Cargo.lock \
            | paste -d- - - | sed 's/$/.crate/' > "$RUNNER_TEMP/locked-crates"
          for dir in ~/.cargo/registry/cache/*/; do
            ls "$dir" | grep -vxFf "$RUNNER_TEMP/locked-crates" | sed "s|^|$dir|" | xargs rm -f
          done
      - if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-home.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      - if: always() && matrix.lane != 'tools'
        run: $SCCACHE_PATH --show-stats
      - if: always() && runner.os == 'macOS'
        run: sysctl vm.swapusage vm.loadavg && vm_stat | grep -E 'Pageouts|Swapouts|Compressions'
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # The Linux worker on Linux: its ptyd, the CLI and the server built natively, and the tests of
  # every crate of theirs that builds there (`cargo xtask gate --lane linux`), beside the gate on
  # a free Linux runner, so the run takes no longer. `promote` needs it as it needs the gate. Its
  # compile cache is on R2 with the others' (docs/decisions/tooling.md, "sccache lives on R2").
  linux:
    if: vars.SLOPTY_RUNNERS != 'warm' || github.event_name == 'pull_request'
    name: gate (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      SLOPTY_DISK_FLOOR_GB: 5
    steps:
      # The shells whose integration the PTY tests check besides the image's bash, tmux for the
      # marks that cross a real one, and the receive buffer a worker's socket asks for (4 MiB),
      # which Ubuntu caps at 208 KiB. The image leaves completion directories group-writable, so
      # Ubuntu's zshrc stopped at compinit's "insecure directories" question and ate the tests'
      # typed lines: those directories lose their group and other write bits.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh fish tmux
          sudo sysctl -w net.core.rmem_max=8388608
          { zsh -fc 'autoload -Uz compaudit; compaudit' || true; } | xargs -r sudo chmod g-w,o-w
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          # Without R2 the Linux units stay off the Actions cache, whose 10 GB the Mac lanes fill.
          actions-cache: "false"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # The cargo cache the tools lane saves, read only (the gate job's comment).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # Every proc-macro dependency unoptimised: sccache cannot cache one, and the workspace's
      # `package."*"` gave them opt-level 3 (xtask/src/ci_profile.rs). Cargo reads package
      # overrides from config files only.
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # libghostty-vt-sys builds its library with zig.
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-linux-${{ steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786).
      - uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: xtask gate --ci --lane linux
      - if: always()
        run: $SCCACHE_PATH --show-stats
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-linux
          path: |
            target/**/nextest/ci/junit.xml
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # The gate on the two warm runners on the Mac Studio, once the repository variable
  # `SLOPTY_RUNNERS` is `warm` (`cargo xtask warm`; docs/decisions/tooling.md, "The gate runs on
  # warm runners here"): each keeps its checkout, toolchains, tools and target dir between runs
  # and builds incrementally, so a push compiles what it changed. The Mac runs the tools, clippy
  # for the Apple triples, rustdoc and every Mac test in one job; the Linux VM clippy for the
  # Linux triples and the Linux tests. Only pushes come here, and each runner's job-started hook
  # refuses any job but the gate's (`xtask warm guard`), so a pull request that names these
  # runners still never runs on them. Any other value of the variable sends every job back to the
  # hosted matrix above at once.
  warm:
    if: vars.SLOPTY_RUNNERS == 'warm' && github.event_name == 'push'
    name: gate (warm ${{ matrix.host }})
    runs-on: ${{ format('slopty-warm-{0}', matrix.host) }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        host: [mac, linux]
    # Incremental builds on the target dir the last run left, which is the compile cache: no
    # sccache (an empty `RUSTC_WRAPPER` is cargo's none; the runner's `.env` drops an empty
    # value). The Mac's own Xcode, the one it selects (27.1, as on GitHub's image): an empty
    # `DEVELOPER_DIR` is xcrun's unset, and the image's path is missing here.
    env:
      CARGO_INCREMENTAL: 1
      DEVELOPER_DIR: ""
      RUSTC_WRAPPER: ""
    defaults:
      run:
        shell: bash
    steps:
      # The tree updated in place: unchanged files keep their times, so cargo's fingerprints of
      # them hold. The whole history, for `committed`, fetched as what is new.
      - uses: actions/checkout@v7
        with:
          clean: false
          submodules: recursive
          fetch-depth: 0
      # The toolchain, unless the runner has it; the gate adds the targets its lanes need.
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      # The zig the vendored ghostty names, as the hosted jobs have it; the runner keeps it in
      # its tool cache.
      - uses: ./.github/actions/zig
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      - run: cargo xtask gate --warm
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-warm-${{ matrix.host }}
          path: |
            target/nextest/warm/junit.xml
            target/nextest/warm/ptys.log
          if-no-files-found: ignore
      # As the hosted jobs: a red run cancels itself once a newer push waits behind it.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # main moves to the commit every lane passed on, only forward: a push without force is
  # refused unless main is an ancestor of it, and the check before says why in the summary.
  promote:
    needs: [gate, linux, warm]
    # Every lane passed: on the hosted matrix and the linux job, or on both warm runners.
    if: >-
      github.ref == 'refs/heads/gate' && !cancelled()
      && (needs.warm.result == 'success'
      || (needs.gate.result == 'success' && needs.linux.result == 'success'))
    runs-on: ubuntu-24.04
    # `actions: write` starts the app's e2e on the new main, and the Deep checks when overdue.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          git fetch --quiet origin main
          short=${GITHUB_SHA:0:10}
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "### ✘ not promoted: $short is not on top of main" >> "$GITHUB_STEP_SUMMARY"
            echo "main is at $(git rev-parse --short=10 origin/main); rebase onto it and land again." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$short is not a fast-forward of main"
            exit 1
          fi
          # GitHub never lets this job's token update a workflow file, however green the run.
          if [ -n "$(git diff --name-only origin/main "$GITHUB_SHA" -- .github/workflows)" ]; then
            echo "### ✋ not promoted: $short changes a workflow file" >> "$GITHUB_STEP_SUMMARY"
            echo "Every lane passed. From a checkout: \`cargo xtask promote $short\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$short changes .github/workflows, which this token may not push; run cargo xtask promote"
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"
          echo "### ✔ main fast-forwarded to $short" >> "$GITHUB_STEP_SUMMARY"
      # The app's e2e on the main just promoted, once four hours have passed since the last one
      # started and none is queued or running, since each holds a macOS slot the gate's five
      # jobs share. A schedule cannot do it: this job's push is not an event to GitHub, so a
      # scheduled run checked out the last commit a person pushed (e2e.yml). Dispatched on
      # `gate` with the commit, so it reads the compile cache the test shards just filled.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --limit 10 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" -gt 0 ]; then
            echo "the app's e2e is still running; none started" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 14400 ]; then
            gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref gate -f sha="$GITHUB_SHA"
            echo "the app's e2e started on the main just promoted" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The Deep checks, once 26 hours have passed since a Deep run on main last started. GitHub
      # starts a schedule late under load, by six hours (run 38133881188), or not at all: none
      # had started for 2026-10-12's 04:37 by 09:20. Its macOS jobs still wait for the gate to
      # go idle (deep.yml's `wait`), so a run started in the working day holds no gate Mac.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deep.yml --branch main \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 93600 ]; then
            gh workflow run deep.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "the Deep checks started: none on main for 26 hours" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A tag, gated, is built into a release by `cargo xtask dist`: the app, the Mac CLI and
  # daemons, the Linux workers and servers, the dSYMs and SHA256SUMS, each checked. It signs with
  # the Developer ID and notarises with the App Store Connect key that the Better Update vault
  # holds, reached as the Slopty project's robot (BETTER_UPDATE_ROBOT, the job's only secret).
  # Without it `dist` fails for a tag rather than publish an ad hoc build (`dist::publishable`;
  # docs/decisions/tooling.md, "A release signs and notarises from the Better Update vault").
  release:
    name: release ${{ github.ref_name }}
    needs: [gate, warm]
    if: >-
      github.ref_type == 'tag' && !cancelled()
      && (needs.warm.result == 'success' || needs.gate.result == 'success')
    runs-on: xcode-27
    # `bash` named, so a step runs with pipefail: GitHub's default shell runs without it, and
    # `dist … | tee` or `curl … | sh` would pass with the command before the pipe failed.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # `.cargo/config.toml` wraps rustc in sccache here too.
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: >-
            aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      # The cargo cache the gate's tools lane saves, read only; a release saves none of its own.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm git-cliff@2.14.2 cargo-zigbuild@0.23.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # zig builds libghostty-vt and links every Linux binary; its caches keep what it compiled
      # to link them.
      - uses: ./.github/actions/zig
        with:
          use-cache: "true"
      # The vault's client, the version `xtask/src/vault.rs` was proven against, by the installer
      # of that release's commit, which checks the download's SHA-256.
      - run: |
          curl -fsSL https://raw.githubusercontent.com/aislopware/better-update/84d3f253a039729e2a6c7c792ad620cec13897e8/install.sh \
            | BETTER_UPDATE_VERSION=0.81.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The image's Xcode comes without the Metal compiler the app's shaders build with, and
      # `bundle` refuses to build without it (the gate's jobs fetch it in `xtask setup`).
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: cargo xtask dist --out dist 2>&1 | tee dist.log
      # Whether it was signed and notarised, and anything else it warned of, on the run's page.
      - if: always()
        run: |
          {
            echo "### release ${GITHUB_REF_NAME}"
            grep -E '^  (signed|notarised|!)|^    ' dist.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - run: git cliff --latest --strip all > dist/notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
