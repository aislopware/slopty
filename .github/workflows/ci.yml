name: CI

# The gate. `cargo xtask land` pushes a commit made on main to the `gate` branch; every lane runs
# here, and `promote` fast-forwards main to that commit once all of them passed. main itself is
# never gated again: whatever it holds passed here first. A tag is gated, then released.
on:
  push:
    branches: [ gate ]
    tags: [ "v*" ]
  pull_request:

# One run at a time per ref. A newer push to `gate` waits behind the run in progress instead of
# cancelling it: that run is often most of the way to promoting main, and cancelled runs threw
# away up to 48 minutes each (10 of 41 runs; MEASUREMENTS 2026-10-02, "the tests lane's build").
# GitHub keeps one run pending per group and replaces it with each newer push, so the queue never
# grows past the newest commit, whose green covers every commit under it. A pull request's run is
# still cancelled by its next push; a tag's never is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `.cargo/config.toml` wraps rustc in sccache; on a runner it caches to the Actions cache.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # `cargo gate --full`, one lane per runner. A hosted Mac has three cores and 7 GB: the five lanes
  # side by side on one of them took 80 minutes cold, each lane compiling the world on its own
  # target dir while swapping. Here each lane takes the whole runner (docs/decisions/tooling.md).
  # The tests lane, whose CPU-bound build bounded every run, runs as three shards of packages
  # (`xtask gate --shard`, whose test checks that this matrix lists each). That keeps the Free
  # plan's five concurrent macOS jobs: rustdoc runs before iOS clippy on its runner, and what
  # needs no Mac runs on Linux, where twenty jobs run at once: the tools lane, which reads only
  # text, and clippy for Linux, which had made iOS clippy the last job in 7 of 18 runs
  # (.research/dev-speed-2026-10-05.md).
  gate:
    name: gate (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The longest lane takes about 20 min; a hung one held the queue for an hour (run
    # 37134085979), and runs on `gate` wait for each other.
    timeout-minutes: 45
    # `actions: write` lets a red lane cancel its run once a newer push waits (the last step).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The gate's free-space floor is sized for this Mac's full gate; the tools lane builds
          # xtask alone.
          - { lane: tools, os: ubuntu-24.04, disk-floor-gb: 5 }
          - lane: clippy-linux
            os: ubuntu-24.04
            disk-floor-gb: 5
            targets: >-
              x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl,
              wasm32-unknown-unknown
          - { lane: clippy-host, os: macos-26 }
          - { lane: clippy-ios, os: macos-26 }
          - { lane: tests, shard: ui, os: macos-26 }
          - { lane: tests, shard: worker, os: macos-26 }
          - { lane: tests, shard: rest, os: macos-26 }
    env:
      SLOPTY_DISK_FLOOR_GB: ${{ matrix.disk-floor-gb }}
    steps:
      # Linux clippy's target dir grows to about 19 GB (three triples' build scripts and
      # metadata), and a hosted Ubuntu image keeps about 14 GB free: these SDKs are what the
      # image holds that no step here uses, as in the linux job.
      - if: matrix.lane == 'clippy-linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # `committed` lints every commit since the last tag; the other lanes read the tree.
          fetch-depth: ${{ matrix.lane != 'tools' && 1 || 0 }}
      # A named version: without one the action asks the GitHub API for the latest release,
      # and that call timing out failed whole runs.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
          targets: >-
            ${{ matrix.targets
            || 'aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim' }}
      # The canonical formatter is nightly rustfmt; only the tools lane formats.
      - if: matrix.lane == 'tools'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # sccache holds the compiled units; this keeps only the registry, git checkouts and the
      # installed tools, so the two do not store every unit twice in the repository's cache
      # quota. The action keys an entry by the runner's OS, so there are two: the Linux tools
      # lane saves its own, and host clippy saves the one every Mac lane reads, after
      # `cargo fetch` (below) has every package in it. A cache is read by its own branch and the
      # ones based on main, so the Deep workflow saves its own on main. The toolchains are left
      # out of the key, since none of this depends on them. A key per lane saved 5 × 270 MB on
      # each lockfile change and filled the 10 GB quota the compile cache lives in (MEASUREMENTS
      # 2026-10-01). Saved on failure too: a red lane is no reason to download it all again.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          cache-on-failure: true
          save-if: >-
            ${{ github.ref == 'refs/heads/gate'
            && (matrix.lane == 'tools' || matrix.lane == 'clippy-host') }}
      - uses: cargo-bins/cargo-binstall@main
      # libghostty-vt-sys builds its library with zig in every lane that compiles, the version it
      # pins: Homebrew's `zig` moved to 0.17, which Ghostty's build.zig does not take.
      - if: matrix.lane != 'tools'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # Its cache holds zig's own caches, which libghostty-vt-sys never reads (it passes its
          # own --cache-dir), and took 2.3 GB of the 10 GB quota sccache lives in.
          use-cache: false
      # libghostty-vt built once per set of inputs (`LIBGHOSTTY_VT_SYS_PREBUILT_DIR`), the head
      # of the build in most lanes: kept per lane, since each builds its own triples, and keyed
      # by the ghostty revision and the binding's, which a new entry needs. The build checks
      # every other input itself, so an entry for another zig or SDK is never used.
      - if: matrix.lane != 'tools'
        id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - if: matrix.lane != 'tools'
        uses: actions/cache@v4
        with:
          path: target/ghostty-prebuilt
          key: >-
            ghostty-prebuilt-${{ runner.os }}-${{ matrix.lane }}${{ matrix.shard }}-${{
            steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786).
      - if: matrix.lane != 'tools'
        uses: actions/cache@v4
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: matrix.lane != 'tools'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # Every package of every platform, for the Mac lanes' cache entry this lane saves.
      - if: matrix.lane == 'clippy-host'
        run: cargo fetch --locked
      # binstall asks the GitHub API where a tool's release is. Unauthenticated, that hit the
      # runner's shared rate limit in a third of the test lanes, timed out and compiled nextest
      # from source: 5 to 8 minutes instead of 3 seconds (.research/dev-speed-2026-10-05.md).
      # The job's own token is read-only.
      - run: cargo xtask setup --lane ${{ matrix.lane }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # rustdoc on iOS clippy's runner, before it: it named 10 red runs in two days and iOS
      # clippy none, so it reports first (.research/dev-speed-2026-10-06.md item 3). Host
      # clippy's runner carries the fuzz crate's clippy and was the longer of the two.
      - if: matrix.lane == 'clippy-ios'
        run: cargo xtask gate --ci --lane rustdoc
      # A failed lane writes the run's summary: the lane, its failed step and the failed tests.
      # The tests lane counts who holds the pseudo-terminals while it runs (`xtask/src/ptys.rs`)
      # and fails on a leak, on more than its budget, or on running out. iOS clippy runs even
      # when rustdoc failed, so one run names both.
      - if: ${{ !cancelled() }}
        run: >-
          cargo xtask gate --ci --lane ${{ matrix.lane }}
          ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      # What a slow run is read from afterwards: each test's time, each unit of the build's, how
      # much of the build the compile cache served, and the pseudo-terminals held every 200 ms.
      - if: always() && matrix.lane == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.shard }}
          path: |
            target/**/nextest/ci/junit*.xml
            target/**/nextest/ci/ptys.log
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      - if: always() && matrix.lane != 'tools'
        run: $SCCACHE_PATH --show-stats
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # The Linux worker on Linux: its ptyd, the CLI and the server built natively, and the tests of
  # every crate of theirs that builds there (`cargo xtask gate --lane linux`), beside the gate on
  # a free Linux runner, so the run takes no longer. `promote` needs it as it needs the gate. Its
  # compile cache stays on the runner: the Actions cache is at its 10 GB quota, and Linux units
  # there would evict the Mac lanes' (MEASUREMENTS 2026-10-03, "a Linux lane in CI").
  linux:
    name: gate (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      SCCACHE_GHA_ENABLED: "false"
      SLOPTY_DISK_FLOOR_GB: 5
    steps:
      # A hosted Ubuntu image leaves about 14 GB free, which a test build can outgrow.
      # These SDKs are what the image holds that no step here uses.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      # The shells whose integration the PTY tests check besides the image's bash, tmux for the
      # marks that cross a real one, and the receive buffer a worker's socket asks for (4 MiB),
      # which Ubuntu caps at 208 KiB. The image leaves completion directories group-writable, so
      # Ubuntu's zshrc stopped at compinit's "insecure directories" question and ate the tests'
      # typed lines: those directories lose their group and other write bits.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh fish tmux
          sudo sysctl -w net.core.rmem_max=8388608
          { zsh -fc 'autoload -Uz compaudit; compaudit' || true; } | xargs -r sudo chmod g-w,o-w
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          save-if: false
      - uses: cargo-bins/cargo-binstall@main
      # libghostty-vt-sys builds its library with zig, the version it pins.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-linux-${{ steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786).
      - uses: actions/cache@v4
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      - run: cargo xtask setup --lane linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: cargo xtask gate --ci --lane linux
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-linux
          path: |
            target/**/nextest/ci/junit.xml
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # main moves to the commit every lane passed on, only forward: a push without force is
  # refused unless main is an ancestor of it, and the check before says why in the summary.
  promote:
    needs: [gate, linux]
    if: github.ref == 'refs/heads/gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          git fetch --quiet origin main
          short=${GITHUB_SHA:0:10}
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "### ✘ not promoted: $short is not on top of main" >> "$GITHUB_STEP_SUMMARY"
            echo "main is at $(git rev-parse --short=10 origin/main); rebase onto it and land again." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$short is not a fast-forward of main"
            exit 1
          fi
          # GitHub never lets this job's token update a workflow file, however green the run.
          if [ -n "$(git diff --name-only origin/main "$GITHUB_SHA" -- .github/workflows)" ]; then
            echo "### ✋ not promoted: $short changes a workflow file" >> "$GITHUB_STEP_SUMMARY"
            echo "Every lane passed. From a checkout: \`cargo xtask promote $short\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$short changes .github/workflows, which this token may not push; run cargo xtask promote"
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/main"
          echo "### ✔ main fast-forwarded to $short" >> "$GITHUB_STEP_SUMMARY"

  # A tag, gated, is built into a release by `cargo xtask dist`: the app, the Mac CLI and
  # daemons, the Linux workers and servers, the dSYMs and SHA256SUMS, each checked. It signs with
  # the Developer ID the MACOS_CERTIFICATE secrets hold and notarises with the App Store Connect
  # key the APPLE_API_KEY secrets hold. Without them `dist` fails for a tag rather than publish an
  # ad hoc build (`dist::publishable`; docs/decisions/tooling.md, "A release is what `cargo xtask
  # dist` builds").
  release:
    name: release ${{ github.ref_name }}
    needs: gate
    if: github.ref_type == 'tag'
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      # `.cargo/config.toml` wraps rustc in sccache here too.
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: >-
            aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      # The gate's one entry of registry, git checkouts and tools; a release saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          save-if: false
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm git-cliff@2.14.1 cargo-zigbuild@0.23.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # zig builds libghostty-vt and links every Linux binary, the version libghostty-vt pins.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # A keychain of the run's own, holding only the Developer ID, so codesign finds it.
      - if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - if: env.APPLE_API_KEY != ''
        run: |
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - run: cargo xtask dist --out dist 2>&1 | tee dist.log
      # Whether it was signed and notarised, and anything else it warned of, on the run's page.
      - if: always()
        run: |
          {
            echo "### release ${GITHUB_REF_NAME}"
            grep -E '^  (signed|notarised|!)|^    ' dist.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - run: git cliff --latest --strip all > dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
