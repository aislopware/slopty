name: CI

# The gate. `cargo xtask land` pushes a commit made on main to the `gate` branch; every lane runs
# here, and `promote` fast-forwards main to that commit once all of them passed. main itself is
# never gated again: whatever it holds passed here first. A tag is gated, then released.
on:
  push:
    branches: [ gate ]
    tags: [ "v*" ]
  pull_request:

# Runs on `gate` overlap: each push runs at once, in a group of its own, and `promote` takes the
# greens in whatever order they end, succeeding when main already holds the commit. A cancelled
# run threw away up to 48 minutes (MEASUREMENTS 2026-10-02, "the tests lane's build"), and waiting
# behind one cost a median 64 s and a p90 of 489 s a push (docs/decisions/tooling.md, "The gate
# and e2e run on free hosted runners; this Mac runs none", item 1). A red run still cancels
# itself once a newer push runs (each lane's last step), and so does one whose e2e has not
# started (`xtask/src/gate/order.rs`): the newer run carries its commit. A pull request's run is
# still cancelled by its next push; a tag's never is.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The pinned toolchain by name, in place of rust-toolchain.toml: from the file rustup installs
  # every component and target it lists into each job on its first cargo call (llvm-tools,
  # rust-analyzer, rust-src, the iOS and musl standard libraries; 1.9 GB on a runner). Each job
  # installs what it uses (`dtolnay/rust-toolchain`), and `gate::tests` holds the version to
  # the file's.
  RUSTUP_TOOLCHAIN: 1.99.1
  # Xcode 27.1, as on the Macs the gate runs here: the image selects 27.0 and carries 27.1 under
  # this name (docs/decisions/platform.md, "Xcode 27.1").
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # `.cargo/config.toml` wraps rustc in sccache; where it keeps its units is
  # .github/actions/sccache's call.

jobs:
  # `cargo gate --full`, one lane per runner. A hosted Mac has three cores and 7 GB: the five lanes
  # side by side on one of them took 80 minutes cold, each lane compiling the world on its own
  # target dir while swapping. Here each lane takes the whole runner (docs/decisions/tooling.md).
  # The tests lane, whose CPU-bound build bounded every run, runs as three shards of packages
  # (`xtask gate --shard`, whose test checks that this matrix lists each). Only they need a Mac:
  # the plan runs five macOS jobs at once, shared with the remote checks and the e2e, and twenty
  # jobs in all. Everything else runs on Linux: the tools lane, which reads only text; clippy for
  # Linux; and clippy and rustdoc for the Apple triples, which never link, cross-checked from an
  # arm runner with zig compiling the C build scripts compile (`tools::apple_cargo`;
  # docs/decisions/tooling.md, "Apple targets are linted on Linux").
  gate:
    # The hosted matrix gates a pull request always, and a push unless the warm runners take it.
    if: vars.SLOPTY_RUNNERS != 'warm' || github.event_name == 'pull_request'
    name: gate (${{ matrix.lane }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The longest lane takes about 20 min; a hung one held the queue for an hour (run
    # 37134085979), and runs on `gate` wait for each other.
    timeout-minutes: 45
    # `actions: write` lets a red lane cancel its run once a newer push waits (the last step).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The gate's free-space floor is sized for this Mac's full gate; the tools lane builds
          # xtask alone.
          - { lane: tools, os: ubuntu-24.04, disk-floor-gb: 5 }
          - lane: clippy-linux
            os: ubuntu-24.04
            disk-floor-gb: 5
            targets: >-
              x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl
          - { lane: clippy-host, os: ubuntu-24.04-arm, targets: aarch64-apple-darwin }
          - lane: clippy-ios
            os: ubuntu-24.04-arm
            targets: aarch64-apple-ios, aarch64-apple-ios-sim
          - { lane: rustdoc, os: ubuntu-24.04-arm, targets: aarch64-apple-darwin }
          # A test shard writes at most 11 GB cold (worker; ui 9, rest 8), and the xcode-27 image
          # starts with 39.6 GB free, under the full gate's 50.
          - { lane: tests, shard: ui, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
          - { lane: tests, shard: worker, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
          - { lane: tests, shard: rest, os: xcode-27, targets: aarch64-apple-darwin, disk-floor-gb: 15 }
    env:
      SLOPTY_DISK_FLOOR_GB: ${{ matrix.disk-floor-gb }}
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # `committed` lints every commit since the last tag; the other lanes read the tree.
          fetch-depth: ${{ matrix.lane != 'tools' && 1 || 0 }}
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Each lane's own triples, and clippy only where it lints: a test shard needs neither.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: ${{ matrix.lane != 'tests' && 'rustfmt, clippy' || '' }}
          targets: ${{ matrix.targets }}
      # The canonical formatter is nightly rustfmt; only the tools lane formats.
      - if: matrix.lane == 'tools'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # sccache holds the compiled units; this holds what cargo fetches: the registry's index and
      # crates and the git dependencies' clones, one entry per lock for every job of every OS
      # (their contents name no host, and actions/cache keys Linux's and macOS's alike), saved
      # by the tools lane on the gate, last in its job (below). A job on a new lock starts from
      # the newest entry and fetches only what came since. rust-cache, keyed with no environment
      # part, kept one key for ever, so its entry was restored whole and never saved again: 17
      # days stale on 2026-10-18, it had every Mac shard download 184 crates and fetch every fork
      # again on every run (`docs/decisions/tooling.md`, "The cargo cache is keyed by the lock").
      - id: cargo-home
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # Every proc-macro dependency unoptimised: sccache cannot cache one, and the workspace's
      # `package."*"` gave them opt-level 3 (xtask/src/ci_profile.rs). Cargo reads package
      # overrides from config files only.
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # libghostty-vt-sys builds its library with zig in the lanes that build it, and the Apple
      # lints on Linux compile their build scripts' C with it: the zig the vendored ghostty
      # names, not Homebrew's, which moves on its own. A lane whose build takes the prebuilt
      # library still needs it, since the entry's key holds `zig version`. The UI shard builds
      # none of it (no package of its depends on `slopty-engine`,
      # `gate::tests::the_ui_shard_builds_no_libghostty`): 76 s of zig steps a run
      # (.research/hosted-gate-2026-10-31/A-hosted-anatomy.md, section 1.2).
      - if: matrix.lane != 'tools' && matrix.shard != 'ui'
        uses: ./.github/actions/zig
      # libghostty-vt built once per set of inputs (`LIBGHOSTTY_VT_SYS_PREBUILT_DIR`), the head
      # of the build in most lanes: kept per lane, since each builds its own triples, and keyed
      # by the ghostty revision and the binding's, which a new entry needs. The build checks
      # every other input itself, so an entry for another zig or SDK is never used. The Apple
      # lints on Linux skip that build (`DOCS_RS`, `tools::apple_cargo`): they never link it.
      # clippy-host's fuzz replay does build it, once the lint's environment is gone, so that
      # lane keeps its build and its packages too (a codeberg.org fetch inside its build script
      # failed run 41037072359).
      - if: >-
          matrix.lane == 'clippy-linux' || matrix.lane == 'clippy-host'
          || (matrix.lane == 'tests' && matrix.shard != 'ui')
        id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - if: >-
          matrix.lane == 'clippy-linux' || matrix.lane == 'clippy-host'
          || (matrix.lane == 'tests' && matrix.shard != 'ui')
        id: prebuilt
        uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: >-
            ghostty-prebuilt-${{ runner.os }}-${{ matrix.lane }}${{ matrix.shard }}-${{
            steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786). Only a lane that builds libghostty-vt needs them: one whose build of
      # it came from the cache does not.
      - if: >-
          (matrix.lane == 'clippy-linux' || matrix.lane == 'clippy-host'
          || (matrix.lane == 'tests' && matrix.shard != 'ui'))
          && steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: >-
          (matrix.lane == 'clippy-linux' || matrix.lane == 'clippy-host'
          || (matrix.lane == 'tests' && matrix.shard != 'ui'))
          && steps.prebuilt.outputs.cache-hit != 'true'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # The icon test's verdicts (xtask/src/icon/tests.rs): on inputs it passed on before it
      # skips actool and ictool, 103 s beside the shard's other tests. Keyed by the runner's
      # image and the icon's sources; the test hashes those and the document it generates.
      - if: matrix.shard == 'rest'
        id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: matrix.shard == 'rest'
        uses: actions/cache@v6
        with:
          path: target/verdicts
          key: >-
            verdicts-${{ runner.os }}-${{ steps.image.outputs.version }}-${{
            hashFiles('assets/icon.svg', 'xtask/src/icon.rs', 'xtask/src/icon/**') }}
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      # binstall asks the GitHub API where a tool's release is. Unauthenticated, that hit the
      # runner's shared rate limit in a third of the test lanes, timed out and compiled nextest
      # from source: 5 to 8 minutes instead of 3 seconds (.research/dev-speed-2026-10-05.md).
      # The job's own token is read-only.
      - run: xtask setup --lane ${{ matrix.lane }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # nextest rides in xtask's entry, whose key holds its pin (`setup::TOOLS`): setup finds it
      # on PATH at that release and installs nothing. The Linux x64 entry is the linux job's,
      # which runs nextest there; the tools and clippy-linux lanes would save it without.
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          nextest=$(command -v cargo-nextest || true)
          if [ -n "$nextest" ] && [ "$nextest" != ~/.cache/slopty-xtask/cargo-nextest ]; then
            cp "$nextest" ~/.cache/slopty-xtask/
          fi
      - if: steps.xtask.outputs.cache-hit != 'true' && matrix.os != 'ubuntu-24.04'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      # A failed lane writes the run's summary: the lane, its failed step and the failed tests.
      # The tests lane counts who holds the pseudo-terminals while it runs (`xtask/src/ptys.rs`)
      # and fails on a leak, on more than its budget, or on running out.
      # What a Mac shard ran on, and at its end how hard it pressed the machine, so a slow run
      # is told apart as a slow host or a full one (the test shards' times swing ±100 s).
      - if: runner.os == 'macOS'
        run: sysctl hw.model machdep.cpu.brand_string hw.ncpu hw.memsize
      - run: >-
          xtask gate --ci --lane ${{ matrix.lane }}
          ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
      # What a slow run is read from afterwards: each test's time, each unit of the build's, how
      # much of the build the compile cache served, and the pseudo-terminals held every 200 ms.
      - if: always() && matrix.lane == 'tests'
        uses: actions/upload-artifact@v7
        with:
          name: timings-${{ matrix.shard }}
          path: |
            target/**/nextest/ci/junit*.xml
            target/**/nextest/ci/ptys.log
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      # The cargo cache's entry for this lock, when none has it: every package of every platform,
      # the lock's alone, so an entry started from an older one keeps none of its versions. Last
      # in the tools lane, the job that ends first (a minute), on Linux, where it takes seconds:
      # on a Mac the same save took two minutes (run 38126044772).
      - id: fetch
        if: >-
          always() && github.ref == 'refs/heads/gate' && matrix.lane == 'tools'
          && steps.cargo-home.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          sed -n 's/^name = "\(.*\)"$/\1/p; s/^version = "\(.*\)"$/\1/p' Cargo.lock \
            | paste -d- - - | sed 's/$/.crate/' > "$RUNNER_TEMP/locked-crates"
          for dir in ~/.cargo/registry/cache/*/; do
            ls "$dir" | grep -vxFf "$RUNNER_TEMP/locked-crates" | sed "s|^|$dir|" | xargs rm -f
          done
      - if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-home.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      # Every entry but each branch's newest two goes: a job restores its lock's entry or the
      # newest, so the older ones only filled the 10 GB the compile cache and the prebuilt
      # libraries need (26 stale ones, 8.8 GB, on 2026-10-31), and GitHub evicted those first.
      # Housekeeping, never a red: two overlapping runs prune the same entries, and the second
      # delete of one fails.
      - if: always() && steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key cargo-home- --limit 100 \
            --json id,ref,createdAt \
            --jq 'group_by(.ref)[] | sort_by(.createdAt) | reverse | .[2:][] | .id' \
            | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true; done
      - if: always() && matrix.lane != 'tools'
        run: $SCCACHE_PATH --show-stats
      - if: always() && runner.os == 'macOS'
        run: sysctl vm.swapusage vm.loadavg && vm_stat | grep -E 'Pageouts|Swapouts|Compressions'
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # The Linux worker on Linux: its ptyd, the CLI and the server built natively, and the tests of
  # every crate of theirs that builds there (`cargo xtask gate --lane linux`), beside the gate on
  # a free Linux runner, so the run takes no longer. `promote` needs it as it needs the gate. Its
  # compile cache is on R2 with the others' (docs/decisions/tooling.md, "sccache lives on R2").
  linux:
    if: vars.SLOPTY_RUNNERS != 'warm' || github.event_name == 'pull_request'
    name: gate (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    env:
      SLOPTY_DISK_FLOOR_GB: 5
    steps:
      # The shells whose integration the PTY tests check besides the image's bash, tmux for the
      # marks that cross a real one, and the receive buffer a worker's socket asks for (4 MiB),
      # which Ubuntu caps at 208 KiB. The image leaves completion directories group-writable, so
      # Ubuntu's zshrc stopped at compinit's "insecure directories" question and ate the tests'
      # typed lines: those directories lose their group and other write bits.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh fish tmux
          sudo sysctl -w net.core.rmem_max=8388608
          { zsh -fc 'autoload -Uz compaudit; compaudit' || true; } | xargs -r sudo chmod g-w,o-w
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          # Without R2 the Linux units stay off the Actions cache, whose 10 GB the Mac lanes fill.
          actions-cache: "false"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # The cargo cache the tools lane saves, read only (the gate job's comment).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # Every proc-macro dependency unoptimised: sccache cannot cache one, and the workspace's
      # `package."*"` gave them opt-level 3 (xtask/src/ci_profile.rs). Cargo reads package
      # overrides from config files only.
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # libghostty-vt-sys builds its library with zig.
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - id: prebuilt
        uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-linux-${{ steps.ghostty.outputs.key }}
      # Ghostty's zig packages are fetched into vendor/ghostty/zig-pkg ahead of the build, kept
      # by the root manifest's hash (which pins every package's), and fetched again with
      # retries on a miss: a fetch inside the build script failed a lane on one 502 from GitHub
      # (run 37080698786). Only for a build of libghostty-vt: with the prebuilt restored nothing
      # builds it, and the fetch was a median 83 s of every run.
      - if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: steps.prebuilt.outputs.cache-hit != 'true'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # nextest rides in xtask's entry (the gate job's comment).
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          nextest=$(command -v cargo-nextest || true)
          if [ -n "$nextest" ] && [ "$nextest" != ~/.cache/slopty-xtask/cargo-nextest ]; then
            cp "$nextest" ~/.cache/slopty-xtask/
          fi
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: xtask gate --ci --lane linux
      - if: always()
        run: $SCCACHE_PATH --show-stats
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-linux
          path: |
            target/**/nextest/ci/junit.xml
            target/**/cargo-timings/cargo-timing.html
          if-no-files-found: ignore
      # A red run never promotes, so once a newer push to `gate` waits behind it, its lanes
      # still running only hold the queue: in two days 13 red runs held a newer push a median
      # 12 minutes that way (.research/dev-speed-2026-10-06.md item 6). The newer run, which
      # holds this commit, reports what those lanes would have.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # The gate on the two warm runners on the Mac Studio, once the repository variable
  # `SLOPTY_RUNNERS` is `warm` (`cargo xtask warm`; docs/decisions/tooling.md, "The gate runs on
  # warm runners here"): each keeps its checkout, toolchains, tools and target dir between runs
  # and builds incrementally, so a push compiles what it changed. The Mac runs the tools, clippy
  # for the Apple triples, rustdoc and every Mac test in one job; the Linux VM clippy for the
  # Linux triples and the Linux tests. Only pushes come here, and each runner's job-started hook
  # refuses any job but the gate's (`xtask warm guard`), so a pull request that names these
  # runners still never runs on them. Any other value of the variable sends every job back to the
  # hosted matrix above at once.
  warm:
    if: vars.SLOPTY_RUNNERS == 'warm' && github.event_name == 'push'
    name: gate (warm ${{ matrix.host }})
    runs-on: ${{ format('slopty-warm-{0}', matrix.host) }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        host: [mac, linux]
    # Incremental builds on the target dir the last run left, which is the compile cache: no
    # sccache (an empty `RUSTC_WRAPPER` is cargo's none; the runner's `.env` drops an empty
    # value). The Mac's own Xcode, the one it selects (27.1, as on GitHub's image): an empty
    # `DEVELOPER_DIR` is xcrun's unset, and the image's path is missing here.
    env:
      CARGO_INCREMENTAL: 1
      DEVELOPER_DIR: ""
      RUSTC_WRAPPER: ""
    defaults:
      run:
        shell: bash
    steps:
      # The tree updated in place: unchanged files keep their times, so cargo's fingerprints of
      # them hold. The whole history, for `committed`, fetched as what is new.
      - uses: actions/checkout@v7
        with:
          clean: false
          submodules: recursive
          fetch-depth: 0
      # The toolchain, unless the runner has it; the gate adds the targets its lanes need.
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      # The zig the vendored ghostty names, as the hosted jobs have it; the runner keeps it in
      # its tool cache.
      - uses: ./.github/actions/zig
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      - run: cargo xtask gate --warm
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-warm-${{ matrix.host }}
          path: |
            target/nextest/warm/junit.xml
            target/nextest/warm/ptys.log
          if-no-files-found: ignore
      # As the hosted jobs: a red run cancels itself once a newer push waits behind it.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # What a push reaches of the e2e smoke set (`cargo xtask smoke plan`; docs/decisions/testing.md,
  # "A change's smoke cases follow from its paths"): the cases its changes since main reach
  # through the packages' dependency graph and their lines' `cfg`, as one job of `e2e` per kind
  # of Mac run, each with the filterset of its reached tests. A push it reaches none with skips
  # `e2e`. On Linux, beside the gate's first minute. As it ends it reads `gate`'s tip: once a
  # newer push has moved it, the run stands aside (`superseded`, xtask/src/gate/order.rs), and
  # one whose plan chose cases is cancelled whole, since it can never promote and the newer run
  # carries its commit; one that chose none runs on and may still promote.
  smoke-plan:
    if: github.ref == 'refs/heads/gate'
    name: smoke plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      superseded: ${{ steps.plan.outputs.superseded }}
    steps:
      # The whole history, without the files it does not read: the plan diffs from where the
      # commit left main, and git fetches a file's old side as it asks for it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # xtask, as the gate's lanes take it; built on a miss only.
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          actions-cache: "false"
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # The cargo cache the tools lane saves, read only (the gate job's comment).
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      # The plan does not judge a change to itself: when the change touches its code
      # (`xtask/src/gate/impact.rs` and `order.rs`, its wiring in `xtask/src/lib.rs`) or the jobs
      # that run it (this file), both e2e jobs must be in its matrix, as its rules put them, or the
      # job is red, so a plan that drops its own cases cannot pass.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          ~/.cache/slopty-xtask/xtask smoke plan --base origin/main --head "$GITHUB_SHA" \
            --stand-aside
          matrix=$(sed -n 's/^matrix=//p' "$GITHUB_OUTPUT" | tail -n1)
          if [ -z "$matrix" ]; then
            echo "::error::the plan wrote no matrix"
            exit 1
          fi
          own=$(git diff --name-only "origin/main...$GITHUB_SHA" -- xtask/src/gate/impact.rs \
            xtask/src/gate/order.rs xtask/src/lib.rs .github/workflows/ci.yml)
          if [ -n "$own" ]; then
            for case in mac ios; do
              if ! jq -e --arg case "$case" 'any(.[]; .case == $case)' <<<"$matrix" >/dev/null; then
                echo "::error::the change touches the plan's own code ($(tr '\n' ' ' <<<"$own")), and its plan leaves out e2e ($case)"
                exit 1
              fi
            done
          fi
          superseded=$(sed -n 's/^superseded=//p' "$GITHUB_OUTPUT" | tail -n1)
          if [ "$superseded" = true ] && [ "$matrix" != "[]" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              || echo "::warning::the run stands aside but could not be cancelled; its e2e and promote skip"
          fi

  # The smoke cases the plan chose, on hosted Macs beside the gate (docs/decisions/tooling.md, "The
  # gate and e2e run on free hosted runners; this Mac runs none", item 3). `e2e (mac)` builds the
  # daemons, the app and the test binaries once, in the check's one feature set, and runs the app's
  # cases (S1-S3) and the server's (S4), or `e2e (server)` the server's alone when the change
  # reaches no other; `e2e (ios)` builds the same and the iOS app, boots the iPhone while it builds
  # and the iPad once the iPhone's tests are done, waits for each to settle, and runs S5 on both.
  # Only the reached tests run, none retried (`NEXTEST_RETRIES=0`); a changed frame is a review, not
  # a red, on a runner's GPU (`--review`, as in e2e.yml). A job stops once any other job of its run
  # ended other than green (failed, past its timeout, or cancelled), since the run then never
  # promotes: before its setup, and through the run (`--stop-on-red`). It stands aside once a newer
  # push moved `gate` before it set up or built, its run cancelled whole, and the newer run carries
  # its commit; one already building runs on, and may still promote. `promote` needs it; a job the
  # plan leaves out never starts.
  e2e:
    needs: smoke-plan
    if: >-
      needs.smoke-plan.outputs.matrix != '' && needs.smoke-plan.outputs.matrix != '[]'
      && needs.smoke-plan.outputs.superseded != 'true'
    name: e2e (${{ matrix.case }})
    runs-on: xcode-27
    # A cold build of the app and its daemons on a three-core runner took over 30 minutes.
    timeout-minutes: 75
    # No concurrency group: one that keeps a job running and one waiting cancels the waiting one
    # when a third queues, and jobs queue as their plans end, not in their commits' order, so an
    # older run's job could cancel the newest run's and leave its commit off main with no run to
    # carry it. A run instead stands aside only by `gate`'s tip, which never sets the newest
    # aside (`xtask/src/gate/order.rs`, whose model test runs every order; docs/decisions/
    # testing.md, "The gate runs the smoke cases a push reaches").
    # `actions: write`: the job reads the run's lanes, cancels a run that stands aside, and a
    # red one cancels its run once a newer push runs.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.smoke-plan.outputs.matrix) }}
    # `bash` named, so a step runs with pipefail, which GitHub's default shell leaves off.
    defaults:
      run:
        shell: bash
    env:
      # The server stays up to the end, so the last step's statistics count the run.
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      # Spotlight off (the gate job's comment).
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      # A run already red never promotes: a job that waited for a Mac past a red sets nothing
      # up. GitHub lists a job past its timeout as cancelled, and says so in its annotations,
      # which tell it apart as red. One whose jobs were only cancelled is being cancelled whole,
      # and one whose commit `gate` moved off stands aside (`xtask/src/gate/order.rs`): each is
      # cancelled whole here, so it ends cancelled, not red, and `land --wait` follows the newer
      # run (`xtask e2e --stop-on-red` does the same before its build, and watches for a red
      # through the run). A look that fails stops nothing, nor a cancel that fails.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ended=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | "\(.id)\t\(.conclusion)\t\(.name)"') \
            || ended=
          red=
          cancelled=
          while IFS=$'\t' read -r id conclusion name; do
            [ -n "$id" ] || continue
            if [ "$conclusion" != cancelled ]; then
              red+="${red:+, }$name $conclusion"
            elif notes=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[].message') \
              && grep -q 'has exceeded the maximum execution time' <<<"$notes"; then
              red+="${red:+, }$name past its timeout"
            else
              cancelled+="${cancelled:+, }$name"
            fi
          done <<<"$ended"
          if [ -n "$red" ]; then
            echo "### ✋ red: $red; the run never promotes, so its e2e stops here" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::red: $red"
            exit 1
          fi
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/gate" --jq .object.sha) || tip=
          if [ -n "$cancelled" ]; then
            said="$cancelled cancelled: the run is being cancelled whole"
          elif [ -n "$tip" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            said="\`gate\` moved on to $tip, whose run carries this commit or replaced it: the run stands aside, cancelled whole"
          else
            exit 0
          fi
          echo "### ✋ $said" >> "$GITHUB_STEP_SUMMARY"
          if gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"; then
            sleep 300
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # The Mac's triple, and the simulator's for the iOS app.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: >-
            ${{ matrix.case == 'ios' && 'aarch64-apple-darwin, aarch64-apple-ios,
            aarch64-apple-ios-sim' || 'aarch64-apple-darwin' }}
      # The cargo cache the tools lane saves, read only (the gate job's comment).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # As the gate's lanes compile them, so the compile cache's entries are theirs
      # (xtask/src/ci_profile.rs).
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # The worker's libghostty-vt, from the prebuilt the e2e and the worker shard keep: zig
      # for the entry's key, and its packages only to build it. An entry restored by its prefix
      # whose key ends in these inputs' is theirs, so nothing builds it then either.
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - id: prebuilt
        uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-e2e-app-${{ steps.ghostty.outputs.key }}
          restore-keys: ghostty-prebuilt-${{ runner.os }}-tests
      - if: ${{ !endsWith(steps.prebuilt.outputs.cache-matched-key, steps.ghostty.outputs.key) }}
        uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: ${{ !endsWith(steps.prebuilt.outputs.cache-matched-key, steps.ghostty.outputs.key) }}
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xcodegen writes the iOS app's Xcode project (e2e.yml's comment).
      - if: matrix.case == 'ios'
        id: xcodegen
        uses: actions/cache@v6
        with:
          path: ~/.local/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      - if: matrix.case == 'ios' && steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d ~/.local/xcodegen
      - if: matrix.case == 'ios'
        run: echo "$HOME/.local/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # xtask and nextest from their cache entry, as the gate's lanes take them.
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - env:
          CASE: ${{ matrix.case }}
          FILTER: ${{ matrix.filter }}
          NEXTEST_RETRIES: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          args=("$CASE" --review --stop-on-red -E "$FILTER")
          if [ "$CASE" = ios ]; then
            args+=(--sim iphone --sim ipad)
          else
            # Three tests at a time on the runner's three cores.
            args+=(--test-threads 3)
          fi
          xtask e2e "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.case }}
          path: target/e2e/artifacts
          if-no-files-found: ignore
      - if: always() && env.SCCACHE_PATH != ''
        run: $SCCACHE_PATH --show-stats
      # As the gate's lanes: a red run cancels itself once a newer push runs.
      - if: failure() && github.ref == 'refs/heads/gate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git ls-remote origin refs/heads/gate | cut -f1)
          if [ -n "$newest" ] && [ "$newest" != "$GITHUB_SHA" ]; then
            gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
          fi

  # main moves to the commit every lane passed on, only forward: a push without force is
  # refused unless main is an ancestor of it, and the check before says why in the summary.
  promote:
    needs: [gate, linux, warm, smoke-plan, e2e]
    # Every lane passed: on the hosted matrix and the linux job, or on both warm runners; and the
    # smoke cases the plan chose passed, or it chose none. An e2e skipped for a run that stood
    # aside, with cases chosen, never promotes it unchecked.
    if: >-
      github.ref == 'refs/heads/gate' && !cancelled()
      && (needs.warm.result == 'success'
      || (needs.gate.result == 'success' && needs.linux.result == 'success'))
      && needs.smoke-plan.result == 'success'
      && (needs.e2e.result == 'success'
      || (needs.e2e.result == 'skipped' && needs.smoke-plan.outputs.matrix == '[]'))
    runs-on: ubuntu-24.04
    # The deploy key is the `promote` environment's secret, which GitHub hands only to a job on
    # `gate` (its deployment branch): a workflow on any other branch or pull request names it in
    # vain.
    environment: promote
    # `actions: write` starts the e2e cases and the Deep checks on the new main when overdue.
    # The push to main goes with the repository's deploy key, not this token.
    permissions:
      contents: read
      actions: write
    steps:
      # The deploy key that may write to this repository alone (`SLOPTY_PROMOTE_KEY`): unlike
      # the run's token, GitHub lets it push a change to `.github/workflows`, which this token
      # was refused however green (runs 37254289819, 37255378937), and which a probe push of one
      # with the key settled (docs/decisions/testing.md, "The gate runs the smoke cases a push
      # reaches"). No workflow runs on a push to main. The action that holds the key is pinned
      # by commit (v7.0.1), as a tag can move. Rulesets keep the key from more: main takes no
      # force push and no deletion, and only the repository's admins create, move or delete a
      # `v*` tag, so the key cannot cut a release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SLOPTY_PROMOTE_KEY }}
      - id: push
        run: |
          git fetch --quiet origin main gate
          short=${GITHUB_SHA:0:10}
          # Runs overlap: a later push's green may have carried main past this commit already.
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "### ✔ main already holds $short" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A commit `gate` no longer holds was withdrawn: `land` replaced it (an amend landed
          # again), and only what gate still holds may reach main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/gate; then
            echo "### – not promoted: gate no longer holds $short (at $(git rev-parse --short=10 origin/gate)), so it was withdrawn" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "### ✘ not promoted: $short is not on top of main" >> "$GITHUB_STEP_SUMMARY"
            echo "main is at $(git rev-parse --short=10 origin/main); rebase onto it and land again." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$short is not a fast-forward of main"
            exit 1
          fi
          # Another run's promote may move main between the fetch and the push: then this one is
          # done if main now holds the commit, and pushes again, after a wait, while it is still
          # ahead of main. A refusal with main unmoved is GitHub's or a rule's, said as such.
          for wait in 0 5 15 30; do
            sleep "$wait"
            if git push origin "$GITHUB_SHA:refs/heads/main" 2> "$RUNNER_TEMP/push.err"; then
              echo "### ✔ main fast-forwarded to $short" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cat "$RUNNER_TEMP/push.err" >&2
            before=$(git rev-parse origin/main)
            git fetch --quiet origin main
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "### ✔ main already holds $short" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git merge-base --is-ancestor origin/main "$GITHUB_SHA" || break
            if [ "$(git rev-parse origin/main)" = "$before" ]; then
              refused=$(grep -m1 -E 'remote:|rejected|error' "$RUNNER_TEMP/push.err" || echo "no reason given")
              echo "the push was refused with main unmoved: $refused" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "### ✘ not promoted: the push of $short was refused four times, main still under it" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::the push to main was refused: $(head -c 300 "$RUNNER_TEMP/push.err" | tr '\n' ' ')"
          else
            echo "### ✘ not promoted: main moved to $(git rev-parse --short=10 origin/main), not under $short" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::main moved past a commit $short is not on top of"
          fi
          exit 1
      # Every e2e case on main's head, once 26 hours have passed since an e2e run last started
      # and none is queued or running: e2e.yml's nightly schedule, which GitHub starts late under
      # load or not at all (as the Deep checks' below). Dispatched on `gate` with the commit, so
      # it reads the compile cache the test shards just filled. Main has moved by now, so this
      # and the next step are best-effort: a failed call (the token's hourly budget, an outage)
      # leaves the run green.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse origin/main)
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e.yml --limit 10 \
            --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" -gt 0 ]; then
            echo "an e2e run is still going; none started" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 93600 ]; then
            gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref gate -f sha="$head"
            echo "every e2e case started on main's head: none for 26 hours" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      # The Deep checks, once 26 hours have passed since a Deep run on main last started. GitHub
      # starts a schedule late under load, by six hours (run 38133881188), or not at all: none
      # had started for 2026-10-12's 04:37 by 09:20. Its macOS jobs still wait for the gate to
      # go idle (deep.yml's `wait`), so a run started in the working day holds no gate Mac.
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deep.yml --branch main \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -ge 93600 ]; then
            gh workflow run deep.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "the Deep checks started: none on main for 26 hours" >> "$GITHUB_STEP_SUMMARY"
          fi

  # A tag, gated, is built into a release by `cargo xtask dist`: the app, the Mac CLI and
  # daemons, the Linux workers and servers, the dSYMs and SHA256SUMS, each checked. It signs with
  # the Developer ID and notarises with the App Store Connect key that the Better Update vault
  # holds, reached as the Slopty project's robot (BETTER_UPDATE_ROBOT, the job's only secret).
  # Without it `dist` fails for a tag rather than publish an ad hoc build (`dist::publishable`;
  # docs/decisions/tooling.md, "A release signs and notarises from the Better Update vault").
  release:
    name: release ${{ github.ref_name }}
    needs: [gate, warm]
    if: >-
      github.ref_type == 'tag' && !cancelled()
      && (needs.warm.result == 'success' || needs.gate.result == 'success')
    runs-on: xcode-27
    # `bash` named, so a step runs with pipefail: GitHub's default shell runs without it, and
    # `dist … | tee` or `curl … | sh` would pass with the command before the pipe failed.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      BETTER_UPDATE_ROBOT: ${{ secrets.BETTER_UPDATE_ROBOT }}
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      # `.cargo/config.toml` wraps rustc in sccache here too.
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: >-
            aarch64-apple-darwin, aarch64-unknown-linux-gnu, x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-musl, x86_64-unknown-linux-musl
      # The cargo cache the gate's tools lane saves, read only; a release saves none of its own.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # zig builds libghostty-vt and links every Linux binary; its caches keep what it compiled
      # to link them.
      - uses: ./.github/actions/zig
        with:
          use-cache: "true"
      # The releases `xtask/src/setup.rs` pins, the list the gate's jobs install from, and
      # ghostty's patches into that zig, as on a Mac that bundles.
      - run: cargo xtask setup --tool git-cliff --tool cargo-zigbuild
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The vault's client, the version `xtask/src/vault.rs` was proven against, by the installer
      # of that release's commit, which checks the download's SHA-256.
      - run: |
          curl -fsSL https://raw.githubusercontent.com/aislopware/better-update/84d3f253a039729e2a6c7c792ad620cec13897e8/install.sh \
            | BETTER_UPDATE_VERSION=0.81.0 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The image's Xcode comes without the Metal compiler the app's shaders build with, and
      # `bundle` refuses to build without it (the gate's jobs fetch it in `xtask setup`).
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: cargo xtask dist --out dist 2>&1 | tee dist.log
      # Whether it was signed and notarised, and anything else it warned of, on the run's page.
      - if: always()
        run: |
          {
            echo "### release ${GITHUB_REF_NAME}"
            grep -E '^  (signed|notarised|!)|^    ' dist.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - run: git cliff --latest --strip all > dist/notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
