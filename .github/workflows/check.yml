name: Check

# A working tree's checks on a runner instead of this Mac (`cargo xtask remote`): nothing heavy
# runs on a developer's Mac, whose cores and disk are the person's (docs/decisions/tooling.md,
# "Every compile runs on a runner"). `remote` commits the tree as it is (staged or not) to a
# branch `check/<name>` and starts this with that commit. Dispatched on `gate`, so the run reads
# and fills the compile cache the gate's lanes use: a cache is read by its own branch and main
# only, and a `check/*` branch of its own would start cold every time.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Who asks (a lane's name); a newer check of the same name cancels the older
        required: true
      sha:
        description: The commit `remote` pushed to check/<name>
        required: true
      packages:
        description: Crates for `cargo xtask check`, space-separated; empty for none
        default: ""
      e2e:
        description: An `xtask e2e` case (app, ios, worker, …); empty for none
        default: ""
      filter:
        description: The e2e case's nextest filterset
        default: ""
      goldens:
        description: "What the e2e case does with the goldens: compare, accept, accept-all, review"
        default: compare
      sim:
        description: The simulator the ios case uses
        default: iphone
      snapshots:
        description: "What the tests do with insta snapshots: compare, accept"
        default: compare
      full:
        description: "yes: every check (iOS and Linux clippy, rustdoc); no: fmt, host clippy, tests"
        default: "no"
      runner:
        description: The runner image of the probe and the e2e case (xcode-27, ubuntu-24.04, ubuntu-24.04-arm)
        default: xcode-27
      test_runner:
        description: The runner image of the tests (`remote` picks Linux when every crate tests there), or none
        default: xcode-27
      probe:
        description: A shell command to run after setup, for trying a step on a runner
        default: ""
      warm:
        description: "The gate's warm jobs (ci.yml's `warm`) on the commit: yes (both runners), mac, linux or no"
        default: "no"

run-name: check ${{ inputs.name }} ${{ inputs.sha }}

concurrency:
  group: check-${{ inputs.name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The pinned toolchain by name, in place of rust-toolchain.toml: from the file rustup installs
  # every component and target it lists into each job on its first cargo call (llvm-tools,
  # rust-analyzer, rust-src, the iOS and musl standard libraries; 1.9 GB on a runner). Each job
  # installs what it uses (`dtolnay/rust-toolchain`), and `gate::tests` holds the version to
  # the file's.
  RUSTUP_TOOLCHAIN: 1.99.1
  # Xcode 27.1, as on the Macs the gate runs here: the image selects 27.0 and carries 27.1 under
  # this name (docs/decisions/platform.md, "Xcode 27.1").
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  # The checks of the crates named, in two jobs side by side (`xtask check --part`): the lints on
  # an arm Linux runner, as the gate's Apple and Linux lint lanes run them, and the tests on Linux
  # when every crate tests there, else on a Mac. Only what needs a Mac takes one of the five
  # (docs/decisions/tooling.md, "A remote check lints on Linux").
  lint:
    if: inputs.packages != ''
    name: lint (${{ inputs.name }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    # A step with no shell named runs `bash -e`, without pipefail, so a failed check piped
    # through `tee` passed (run 38107934242).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Host clippy and rustdoc for the Mac; with --full, both iOS triples and Linux.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
          targets: >-
            aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim,
            x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # The cargo cache the gate's tools lane saves (ci.yml), read and never saved.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # zig compiles the build scripts' C for every triple linted here.
      - uses: ./.github/actions/zig
      # Linux clippy (--full) builds libghostty-vt for the Linux triples.
      - if: inputs.full == 'yes'
        id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - if: inputs.full == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-clippy-linux-${{ steps.ghostty.outputs.key }}
      - if: inputs.full == 'yes'
        uses: actions/cache/restore@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: inputs.full == 'yes'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      # Of the tools lane's six, the lints run the two `xtask check` runs: shear and typos.
      - run: >-
          xtask setup --lane clippy-host --lane clippy-ios --lane clippy-linux --lane rustdoc
          --tool cargo-shear --tool typos-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mkdir -p target/remote
      - env:
          PACKAGES: ${{ inputs.packages }}
          FULL: ${{ inputs.full }}
        run: |
          args=(--part lint)
          for p in $PACKAGES; do args+=(-p "$p"); done
          [ "$FULL" = yes ] || args+=(--quick)
          xtask check "${args[@]}" 2>&1 | tee target/remote/lint.log
      - if: always()
        run: $SCCACHE_PATH --show-stats
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-lint
          path: target/remote
          if-no-files-found: ignore
          retention-days: 3

  test:
    # `none` when the crates' tests ran on the Mac that asked (`xtask remote`, `local`).
    if: inputs.packages != '' && inputs.test_runner != 'none'
    name: test (${{ inputs.name }})
    runs-on: ${{ inputs.test_runner }}
    # One of the five macOS slots the gate's test shards need: a hung check gives it back.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      # As the gate's linux job: the shells the PTY tests check, tmux, and the receive buffer a
      # worker's socket asks for, with Ubuntu's completion directories made safe for zsh.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh fish tmux
          sudo sysctl -w net.core.rmem_max=8388608
          { zsh -fc 'autoload -Uz compaudit; compaudit' || true; } | xargs -r sudo chmod g-w,o-w
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          actions-cache: ${{ !startsWith(inputs.test_runner, 'ubuntu') && 'true' || 'false' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # The cargo cache the gate's tools lane saves (ci.yml), read only.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      # The gate's builds of libghostty-vt, read only: a test shard's on a Mac, the linux job's
      # on Linux. A hit needs no zig packages.
      - id: prebuilt
        uses: actions/cache/restore@v6
        with:
          path: target/ghostty-prebuilt
          key: >-
            ghostty-prebuilt-${{ runner.os }}-${{ runner.os == 'Linux' && 'linux'
            || 'testsworker' }}-${{ steps.ghostty.outputs.key }}
          restore-keys: ghostty-prebuilt-${{ runner.os }}-
      - if: steps.prebuilt.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: steps.prebuilt.outputs.cache-hit != 'true'
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mkdir -p target/remote
      - env:
          PACKAGES: ${{ inputs.packages }}
          # An accept writes every changed snapshot and lets its assertion pass.
          INSTA_UPDATE: ${{ inputs.snapshots == 'accept' && 'always' || 'no' }}
          INSTA_FORCE_PASS: ${{ inputs.snapshots == 'accept' && '1' || '0' }}
        run: |
          args=(--part tests)
          for p in $PACKAGES; do args+=(-p "$p"); done
          xtask check "${args[@]}" 2>&1 | tee target/remote/test.log
      # The snapshots the tests wrote, as a patch on the commit checked, which `remote` applies
      # to the tree it came from. Only what an accept writes: anything else in the runner's tree
      # (zig's cache) is not ours to bring back, and `remote` refuses a patch with it.
      - if: always()
        run: |
          accepted=(crates/slopty-e2e/golden ':(glob)**/*.snap')
          git add --intent-to-add -- "${accepted[@]}"
          git diff --binary -- "${accepted[@]}" > target/remote/changes.patch
      - if: always()
        run: $SCCACHE_PATH --show-stats
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-test
          path: target/remote
          if-no-files-found: ignore
          retention-days: 3

  # The gate as the warm runners run it on a push to `gate` (ci.yml's `warm`), on the commit
  # `remote` pushed: every lane, before it lands. The runners' guard lets a dispatch of this
  # workflow by one of the repository's own actors run there, and nothing else but the gate.
  warm:
    if: inputs.warm == 'yes' || inputs.warm == 'mac' || inputs.warm == 'linux'
    name: warm ${{ matrix.host }} (${{ inputs.name }})
    runs-on: ${{ format('slopty-warm-{0}', matrix.host) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.warm == 'yes' && '["mac", "linux"]' || format('["{0}"]', inputs.warm)) }}
    env:
      CARGO_INCREMENTAL: 1
      DEVELOPER_DIR: ""
      RUSTC_WRAPPER: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          clean: false
          submodules: recursive
          fetch-depth: 0
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: ./.github/actions/zig
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      - run: mkdir -p target/remote
      - run: cargo xtask gate --warm 2>&1 | tee target/remote/warm.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-warm-${{ matrix.host }}
          path: |
            target/remote
            target/nextest/warm/junit.xml
          if-no-files-found: ignore
          retention-days: 3

  # A Linux-only warm check's wake: the Linux runner's VM boots when a job starts on the Mac
  # runner, whose job-started hook wakes it (`xtask warm guard --wake`), so a check that runs no
  # warm Mac job runs this one, which does nothing else. Its runner is named as the warm job
  # names its own.
  wake:
    if: inputs.warm == 'linux'
    name: wake the Linux runner (${{ inputs.name }})
    runs-on: ${{ format('slopty-warm-{0}', matrix.host) }}
    timeout-minutes: 5
    strategy:
      matrix:
        host: [mac]
    steps:
      - run: echo "this job's start woke the Linux runner's VM"

  # A probe (a shell command tried on a runner) or an `xtask e2e` case, on the runner named.
  run:
    if: inputs.probe != '' || inputs.e2e != ''
    name: run (${{ inputs.name }})
    runs-on: ${{ inputs.runner }}
    # A probe is a step tried once; one that lost its runner held a Mac slot for 79 minutes
    # (run 38130090331). An e2e case builds the daemons and the app first.
    timeout-minutes: ${{ inputs.e2e != '' && 90 || 45 }}
    defaults:
      run:
        shell: bash
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          actions-cache: ${{ !startsWith(inputs.runner, 'ubuntu') && 'true' || 'false' }}
      # A probe may try any step, so it gets every target, clippy and nightly; an e2e case only
      # builds and runs for the Mac (the ios case for the simulator too): 25 s less setup.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: ${{ inputs.probe != '' && 'rustfmt, clippy' || '' }}
          targets: >-
            ${{ inputs.probe != '' && 'aarch64-apple-darwin, aarch64-apple-ios,
            aarch64-apple-ios-sim, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu,
            x86_64-unknown-linux-musl' || inputs.e2e == 'ios' && 'aarch64-apple-darwin,
            aarch64-apple-ios, aarch64-apple-ios-sim' || 'aarch64-apple-darwin' }}
      - if: inputs.probe != ''
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # The cargo cache the gate's tools lane saves (ci.yml), read only.
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-testsui-${{ steps.ghostty.outputs.key }}
          restore-keys: ghostty-prebuilt-${{ runner.os }}-
      - uses: actions/cache/restore@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xcodegen writes the iOS app's Xcode project, which the simulator cases build: XcodeGen's
      # release, pinned by version and checksum and kept in the cache; Homebrew took minutes.
      - if: inputs.e2e == 'ios'
        id: xcodegen
        uses: actions/cache@v6
        with:
          path: ~/.local/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      - if: >-
          inputs.e2e == 'ios'
          && steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d ~/.local/xcodegen
      - if: inputs.e2e == 'ios'
        run: echo "$HOME/.local/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - if: inputs.probe != ''
        run: >-
          xtask setup --lane tools --lane clippy-host --lane clippy-ios --lane clippy-linux
          --lane tests --lane rustdoc
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: inputs.probe == ''
        run: xtask setup --lane tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mkdir -p target/remote
      - if: inputs.probe != ''
        env:
          PROBE: ${{ inputs.probe }}
        run: bash -c "$PROBE" 2>&1 | tee target/remote/probe.log
      - if: ${{ !cancelled() && inputs.e2e != '' }}
        env:
          CASE: ${{ inputs.e2e }}
          FILTER: ${{ inputs.filter }}
          GOLDENS: ${{ inputs.goldens }}
          SIM: ${{ inputs.sim }}
        run: |
          args=("$CASE")
          [ -n "$FILTER" ] && args+=(-E "$FILTER")
          [ "$GOLDENS" != compare ] && args+=("--$GOLDENS")
          [ "$CASE" = ios ] && args+=(--sim "$SIM")
          # Three tests at a time on the runner's three cores: the app's suite took 103 s
          # against 193 s one at a time, the same tests failing (`docs/decisions/tooling.md`,
          # "An e2e case runs in a guest here").
          [ "$CASE" = app ] && args+=(--test-threads 3)
          xtask e2e "${args[@]}" 2>&1 | tee target/remote/e2e.log
      # The goldens and snapshots the run accepted, as a patch on the commit checked, which
      # `remote` applies to the tree it came from; nothing else of the runner's tree.
      - if: always()
        run: |
          accepted=(crates/slopty-e2e/golden ':(glob)**/*.snap')
          git add --intent-to-add -- "${accepted[@]}"
          git diff --binary -- "${accepted[@]}" > target/remote/changes.patch
      - if: ${{ always() && inputs.e2e != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: renders
          path: target/e2e/artifacts
          if-no-files-found: ignore
          retention-days: 3
      # How much of the build the compile cache served.
      - if: always()
        run: $SCCACHE_PATH --show-stats
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-run
          path: target/remote
          if-no-files-found: ignore
          retention-days: 3
