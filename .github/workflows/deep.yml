name: Deep

# The checks too slow for every commit (`cargo xtask deep`): weekly, and on demand. Each job
# is its own runner so a slow one never holds the others; a failure is a finding to file, not
# a red gate.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deep:
    name: ${{ matrix.check }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        check: [ features, miri, sanitize thread, sanitize address, coverage ]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: aarch64-apple-darwin
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: brew install zig
      - run: cargo xtask setup
      - run: cargo xtask deep ${{ matrix.check }}
