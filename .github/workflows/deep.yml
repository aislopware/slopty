name: Deep

# The checks too slow for every commit (`cargo xtask deep`): weekly, and on demand. Each job
# is its own runner so a slow one never holds the others; a failure is a finding to file, not
# a red gate.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # `.cargo/config.toml` wraps rustc in sccache; on a runner it caches to the Actions cache.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  deep:
    name: ${{ matrix.check }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        check: [ features, miri, sanitize thread, sanitize address, coverage, fuzz ]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: llvm-tools
          targets: aarch64-apple-darwin
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src, rustfmt
      # sccache holds the compiled units; this keeps only the registry and git checkouts, so the
      # two do not store every unit twice in the repository's cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - uses: cargo-bins/cargo-binstall@main
      - run: brew install zig
      - run: cargo xtask setup
      - run: cargo xtask deep ${{ matrix.check }}
      # A fuzz finding is its input: keep the crashes for `cargo xtask fuzz --keep`.
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.check == 'fuzz'
        with:
          name: fuzz-artifacts
          path: target/fuzz/artifacts
          if-no-files-found: ignore
