name: Deep

# The bug-catching checks too slow for every commit (`cargo xtask deep`, docs/TESTING.md "Beyond
# the layers"). They run here and not on the Mac someone works on. Every day at 04:37 UTC, in the
# gate's calmest hours (05–08Z, 7–8 gate runs an hour against 15 in the old 23–04Z window), off
# the top of the hour, which GitHub delays under load (02:00 Bangkok started up to 4 h late),
# since the macOS job holds one of the five slots for hours
# (.research/dev-speed-2026-10-10.md item 5); mutation testing once a week; and on demand
# (`gh workflow run deep.yml`, `-f mutants=true` to add mutation testing, `-f macos=false` for the
# Linux checks alone). Each check is a job of its own, so a slow one holds no other, on Linux
# where its crates build there and on macOS only where they need Apple's frameworks
# (`docs/decisions/tooling.md`, "Deep's macOS jobs wait for the gate"). A failure opens (or adds
# to) the "Deep checks failing" issue.
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "0 7 * * 6"
  workflow_dispatch:
    inputs:
      mutants:
        description: Also run mutation testing
        type: boolean
        default: false
      macos:
        description: Run the macOS checks too
        type: boolean
        default: true

permissions:
  contents: read

# `bash` named, so a step runs with pipefail. GitHub's default shell runs without it, so each
# check's `cargo xtask … | tee` passed whatever the check said: on 2026-10-10 (run 38001943825)
# miri, the three sanitizers, the gpui seeds and coverage failed and the fuzzers found a crash in
# `reassemble`, and every job was green and no issue opened.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Xcode 27.1, as on the Macs the gate runs here: the image selects 27.0 and carries 27.1 under
  # this name (docs/decisions/platform.md, "Xcode 27.1").
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # `.cargo/config.toml` wraps rustc in sccache; where it keeps its units is
  # .github/actions/sccache's call.

jobs:
  # GitHub starts a schedule late when it is busy, by hours (run 38133881188, due 04:37, began
  # 10:58), into the gate's working day. The macOS checks take a Mac each for up to an hour, so
  # they start only once none of the gate's macOS jobs is queued or running, waited for here on
  # a Linux runner rather than on a Mac. A gate that never goes idle in five hours skips the
  # night's macOS checks quietly; the Linux ones run regardless.
  wait:
    if: >-
      github.event.schedule != '0 7 * * 6'
      && (github.event_name != 'workflow_dispatch' || inputs.macos)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      actions: read
    outputs:
      idle: ${{ steps.gate.outputs.idle }}
    steps:
      - uses: actions/checkout@v7
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      # Built as the gate builds it (`ci.yml`), so the compile cache serves it.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_PROFILE_DEV_OPT_LEVEL: 0
        run: echo "idle=$(cargo xtask gate-wait --hours 5)" >> "$GITHUB_OUTPUT"

  # What needs macOS: the sanitized crates call Apple's frameworks, the loom model checks the
  # CoreAudio ring, which builds for Apple alone, `leaks` is macOS's own, the UI's tests run on
  # the Mac's GPUI, and coverage covers every crate, the Mac's among them. The rest runs on Linux
  # (below), so a night takes a Mac for about 200 minutes instead of 290.
  mac:
    name: ${{ matrix.check }}
    needs: wait
    if: needs.wait.outputs.idle == 'true'
    runs-on: xcode-27
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # The account runs five macOS jobs at once, and the gate's three test shards need three of
      # them. One at a time leaves four; a job that waited for the gate inside itself would hold
      # its Mac while it waited.
      max-parallel: 1
      matrix:
        include:
          - { check: sanitize address, run: deep sanitize address, slug: asan }
          - { check: sanitize thread, run: deep sanitize thread, slug: tsan }
          - { check: sanitize realtime, run: deep sanitize realtime, slug: rtsan }
          - { check: loom, run: deep loom, slug: loom }
          - { check: leaks, run: deep leaks, slug: leaks }
          - { check: gpui seeds, run: nightly run --only gpui-iterations, slug: gpui }
          - { check: coverage, run: deep coverage, slug: coverage }
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: llvm-tools
          targets: aarch64-apple-darwin
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt
      # The cargo cache of `ci.yml`, one entry per lock for every OS. The gate saves it on its
      # own branch, which a run on main cannot read, so the features check saves main's (below),
      # which every branch reads, the gate's included.
      - id: cargo-home
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      - uses: ./.github/actions/zig
      # As in the gate (`ci.yml`): Ghostty's zig packages fetched ahead of the build, with
      # retries and a bound. Left to the build script, a fetch that stalled held asan, loom and
      # coverage silent until their 240-minute timeout (run 37156507396).
      - uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # The job's read-only token, so binstall's GitHub API calls are not rate limited (ci.yml).
      - run: cargo xtask setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p target/deep
          cargo xtask ${{ matrix.run }} 2>&1 | tee target/deep/report.log
      # Each check's report: its log, the tests' JUnit and `leaks`' reports.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.slug }}
          path: |
            target/deep/report.log
            target/deep/**/junit.xml
            target/deep/leaks/reports
            target/nightly/**/*.log
          if-no-files-found: ignore

  # What calls no Apple framework, on arm Linux beside each other: the fuzzers (no target calls
  # Apple code; libFuzzer, then AFL++ through ziggy, on one corpus), the property tests of the
  # wire, media and grid crates, and every crate's features checked for the Mac as the gate's
  # host clippy checks it there, through zig (`tools::apple_cargo`).
  linux-deep:
    name: ${{ matrix.check }}
    if: github.event.schedule != '0 7 * * 6'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two minutes a target on the runner's four cores, one under each engine: what one
          # engine finds, the other starts from, and the terminal target's surface is the widest.
          - check: fuzz
            run: deep fuzz --time 60 --jobs 4 --ziggy
            slug: fuzz
            tools: --tool cargo-fuzz
          - check: proptest
            run: nightly run --only proptest
            slug: proptest
            tools: --tool cargo-nextest
          - check: features
            run: deep features
            slug: features
            tools: --tool cargo-hack --tool cargo-zigbuild
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # The cargo cache, as the macOS checks' (above); the features check saves main's entry.
      - id: cargo-home
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      # What the fuzzers found interesting grows from night to night: restored from the last run,
      # saved under this one's.
      - if: matrix.slug == 'fuzz'
        uses: actions/cache@v6
        with:
          path: target/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - uses: cargo-bins/cargo-binstall@main
      - uses: ./.github/actions/zig
      - uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      - run: cargo xtask setup ${{ matrix.tools }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The fuzzers' second engine: ziggy runs AFL++, which cargo-afl builds (with its runtime
      # for this toolchain) and instruments the targets for, on stable, where no LLVM plugin is
      # wanted.
      - if: matrix.slug == 'fuzz'
        run: |
          cargo binstall --no-confirm --locked ziggy@1.7.3 cargo-afl@0.18.2
          cargo afl config --build --force
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p target/deep
          cargo xtask ${{ matrix.run }} 2>&1 | tee target/deep/report.log
      # main's cargo cache entry for this lock, when none has it: every package of every
      # platform, the lock's alone (as `ci.yml`'s tools lane saves the gate's).
      - id: fetch
        if: >-
          always() && github.ref == 'refs/heads/main' && matrix.slug == 'features'
          && steps.cargo-home.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          sed -n 's/^name = "\(.*\)"$/\1/p; s/^version = "\(.*\)"$/\1/p' Cargo.lock \
            | paste -d- - - | sed 's/$/.crate/' > "$RUNNER_TEMP/locked-crates"
          for dir in ~/.cargo/registry/cache/*/; do
            ls "$dir" | grep -vxFf "$RUNNER_TEMP/locked-crates" | sed "s|^|$dir|" | xargs rm -f
          done
      - if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.cargo-home.outputs.cache-primary-key }}
          enableCrossOsArchive: true
      # The fuzzers' crashes (an input for `cargo xtask fuzz --keep`) and logs too, AFL++'s own
      # among them.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-${{ matrix.slug }}
          path: |
            target/deep/report.log
            target/deep/**/junit.xml
            target/nightly/**/*.log
            target/fuzz/artifacts
            target/fuzz/logs
            target/fuzz/ziggy/out/*/logs
          if-no-files-found: ignore

  # The vendored QUIC stack's own suites (`cargo xtask deep noq`), whose random-interaction
  # proptest draws new cases every night; `noq.yml` runs them on every change to the stack.
  noq:
    if: github.event.schedule != '0 7 * * 6'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - run: |
          mkdir -p target/deep
          cargo xtask deep noq 2>&1 | tee target/deep/report.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-noq
          path: target/deep/report.log
          if-no-files-found: ignore

  # Miri interprets the pure crates' tests, which build on Linux as they do here.
  linux:
    name: miri
    if: github.event.schedule != '0 7 * * 6'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --locked cargo-nextest@0.9.146
      - run: |
          mkdir -p target/deep
          cargo xtask deep miri 2>&1 | tee target/deep/report.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-miri
          path: |
            target/deep/report.log
            target/deep/**/junit.xml
          if-no-files-found: ignore

  # Mutation testing of the core crates: which changes no test catches. Weekly, as the code it
  # reads changes slowly and a crate takes hours; the wire crate is split over four runners.
  mutants:
    name: mutants ${{ matrix.package }} ${{ matrix.shard }}
    if: github.event.schedule == '0 7 * * 6' || inputs.mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # `cargo mutants --shard k/n` counts from 0.
          - { package: slopty-core, shard: 0/1 }
          - { package: slopty-grid, shard: 0/1 }
          - { package: slopty-predict, shard: 0/1 }
          - { package: slopty-proto, shard: 0/4 }
          - { package: slopty-proto, shard: 1/4 }
          - { package: slopty-proto, shard: 2/4 }
          - { package: slopty-proto, shard: 3/4 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --locked cargo-mutants@27.1.0
      - id: name
        run: echo "slug=${{ matrix.package }}-${{ matrix.shard }}" | tr '/' 'o' >> "$GITHUB_OUTPUT"
      # A missed mutant is a finding to rank, not a failure: the report is the result.
      - run: |
          mkdir -p target/deep
          cargo xtask deep mutants -p ${{ matrix.package }} --shard ${{ matrix.shard }} --jobs 2 --timeout 300 2>&1 | tee target/deep/report.log || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ steps.name.outputs.slug }}
          path: |
            target/deep/report.log
            target/deep/mutants/*/mutants.out/*.txt
            target/deep/mutants/*/mutants.out/outcomes.json
          if-no-files-found: ignore

  # A failing night opens an issue, or comments on the open one; a clean night closes it. A
  # cancelled run says nothing, and the weekly mutation run alone closes nothing, since a missed
  # mutant is a finding and not a failure.
  report:
    needs: [wait, mac, linux-deep, noq, linux, mutants]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NIGHTLY: ${{ github.event.schedule != '0 7 * * 6' }}
    steps:
      - run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"')
          title="Deep checks failing"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            body=$(printf 'The [Deep run](%s) on %s failed:\n\n%s\n\nEach job uploads its report as an artifact.' "$RUN_URL" "${{ github.sha }}" "$failed")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$open" ] && [ "$NIGHTLY" = true ]; then
            gh issue close "$open" --comment "The [Deep run]($RUN_URL) on ${{ github.sha }} passed."
          fi
