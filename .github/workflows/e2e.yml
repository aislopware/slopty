name: E2E

# The app's live tests (`cargo xtask e2e app`): the real app with ptyd and the worker, driven
# through its test socket, its frames compared with the goldens. They used to run only on a
# developer's Mac before each land, minutes of every core there; here they take a runner instead
# (docs/decisions/tooling.md, "Nothing heavy runs here before a land"). A workflow of its own, so
# its build never holds the gate's concurrency group, and `promote` waits for none of it: it is
# not a gate lane until its renders are shown to match the goldens drawn on a Mac with a GPU of
# its own. A changed frame leaves its render and diff in the `e2e-app` artifact, which
# `cargo xtask e2e app --accept` reproduces locally. It runs at most every four hours, started by
# `ci.yml`'s `promote` once main moves, and by hand; not on each land: on every push it held a
# sixth macOS slot almost all the time, so the gate's fifth lane waited for it. Not on a
# schedule, as main moves only by `promote`'s token, which GitHub does not count as a push, so a
# scheduled run kept checking out the last commit a person pushed (0d67253b, for two days)
# (docs/decisions/tooling.md, "The app's e2e runs on a schedule").
on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to test; `promote` names the one it pushed to main
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The pinned toolchain by name, in place of rust-toolchain.toml: from the file rustup installs
  # every component and target it lists into each job on its first cargo call (llvm-tools,
  # rust-analyzer, rust-src, the iOS and musl standard libraries; 1.9 GB on a runner). Each job
  # installs what it uses (`dtolnay/rust-toolchain`), and `gate::tests` holds the version to
  # the file's.
  RUSTUP_TOOLCHAIN: 1.99.1
  # `.cargo/config.toml` wraps rustc in sccache; where it keeps its units is
  # .github/actions/sccache's call.
  # `promote` dispatches this on `gate`, whose cache the test shards fill: a run on main read
  # main's, which nothing else fills, and built the app and daemons for 600 s
  # (.research/ci-speed-2026-10-11.md item 10). On R2 every ref shares one cache.
  # The server stays up to the end, so the last step's statistics count the run: idle for ten
  # minutes while the tests ran, it had exited and shown none.
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  e2e-app:
    name: e2e (app)
    runs-on: macos-26
    # A cold build of the app and its daemons on a three-core runner took over 30 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate
          add-rust-environment-hash-key: false
          cache-targets: false
          save-if: false
      - uses: cargo-bins/cargo-binstall@main
      # As the gate's lanes compile them, so the compile cache's entries are theirs
      # (xtask/src/ci_profile.rs).
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-e2e-app-${{ steps.ghostty.outputs.key }}
          restore-keys: ghostty-prebuilt-${{ runner.os }}-tests
      - uses: actions/cache@v4
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Three tests at a time on the runner's three cores (`docs/decisions/tooling.md`, "An e2e
      # case runs in a guest here").
      - run: xtask e2e app --review --test-threads 3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app
          path: target/e2e/artifacts
          if-no-files-found: ignore
      - if: always()
        run: $SCCACHE_PATH --show-stats

