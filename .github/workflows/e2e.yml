name: E2E
run-name: >-
  ${{ github.event_name == 'schedule' && 'E2E nightly' || format('E2E: {0}', inputs.sha || github.sha) }}

# The live tests (`cargo xtask e2e`): the real app with ptyd and the worker, the server with the
# CLI and MCP, and the iOS app in the simulator on the iPhone and the iPad, each driven through
# its test socket, every case on one commit (docs/decisions/testing.md, "Goldens render in the
# test process; e2e is a smoke set chosen by what a change reaches"), in two jobs that build once
# each: `mac` runs the app's and the server's, `ios` the simulator's on both devices. The gate
# runs the cases a push reaches in the same two jobs (ci.yml's `e2e`). Two ways in, both
# dispatched on `gate`, so the run reads the compile cache the test shards fill there (a cache is
# read by its own branch alone, and a run on main built the app for 600 s,
# .research/ci-speed-2026-10-11.md item 10):
# - Nightly: the schedule, which runs on main, only dispatches this on `gate` with main's head.
#   Until 2026-10-31 main moved by `promote`'s token, which GitHub does not count as a push, so a
#   scheduled run's own commit was the last one a person pushed (0d67253b, for two days). GitHub starts a
#   schedule late or not at all under load, so `promote` starts one when none started for 26
#   hours. At 19:47 UTC, 02:47 in the person's time zone (UTC+7), so it holds no Mac the working
#   day's gate wants.
# - By hand, on the commit named (`gh workflow run e2e.yml --ref gate -f sha=<commit>`).
# `--review`: a changed frame fails nothing here and leaves its render and diff in the
# `e2e-<case>` artifact, since a runner's GPU draws apart from the Macs the goldens were drawn
# on; a red here is the behaviour's, and is never retried (`NEXTEST_RETRIES=0`). Each job's
# summary holds the run's record: every phase's seconds, the whole run's tests and each that
# failed.
on:
  schedule:
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to test; empty for the ref's head
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# `bash` named, so a step runs with pipefail, which GitHub's default shell leaves off.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The pinned toolchain by name, in place of rust-toolchain.toml: from the file rustup installs
  # every component and target it lists into each job on its first cargo call (llvm-tools,
  # rust-analyzer, rust-src, the iOS and musl standard libraries; 1.9 GB on a runner). Each job
  # installs what it uses (`dtolnay/rust-toolchain`), and `gate::tests` holds the version to
  # the file's.
  RUSTUP_TOOLCHAIN: 1.99.1
  # Xcode 27.1, as on the Macs the gate runs here: the image selects 27.0 and carries 27.1 under
  # this name (docs/decisions/platform.md, "Xcode 27.1").
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  # `.cargo/config.toml` wraps rustc in sccache; where it keeps its units is
  # .github/actions/sccache's call. On R2 every ref shares one cache.
  # The server stays up to the end, so the last step's statistics count the run: idle for ten
  # minutes while the tests ran, it had exited and shown none.
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  # The schedule's run: every case on main's head, dispatched on `gate` (the header).
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          gh workflow run e2e.yml --repo "$GITHUB_REPOSITORY" --ref gate -f sha="$sha"
          echo "every e2e case started on main's head, $sha, on gate" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    if: github.event_name == 'workflow_dispatch'
    name: e2e (${{ matrix.case }})
    runs-on: xcode-27
    # A cold build of the app and its daemons on a three-core runner took over 30 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [mac, ios]
    steps:
      # Spotlight off: it indexes every file a build and its tests write, and on a three-core
      # runner it took 200 CPU-seconds of a 353 s build of the worker crate's tests and 106 of
      # their 139 s run, against 1 once off (`docs/MEASUREMENTS.md`, "the gate's reds and its
      # runners").
      - if: runner.os == 'macOS'
        run: sudo mdutil -a -i off
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          submodules: recursive
      # sccache on R2, or the Actions cache without its credentials (.github/actions/sccache).
      - uses: ./.github/actions/sccache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # The Mac's triple, and the simulator's for the ios case.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: >-
            ${{ matrix.case == 'ios' && 'aarch64-apple-darwin, aarch64-apple-ios,
            aarch64-apple-ios-sim' || 'aarch64-apple-darwin' }}
      # The cargo cache the gate's tools lane saves (ci.yml), read only.
      - id: cargo-home
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-
          enableCrossOsArchive: true
      - uses: cargo-bins/cargo-binstall@main
      # As the gate's lanes compile them, so the compile cache's entries are theirs
      # (xtask/src/ci_profile.rs).
      - run: cp .cargo/ci-profile.toml "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: ./.github/actions/zig
      - id: ghostty
        run: >-
          echo "key=$(git rev-parse HEAD:vendor/ghostty)-$(grep -m1 -o
          'libghostty-rs.git#[0-9a-f]*' Cargo.lock | cut -d'#' -f2)" >> "$GITHUB_OUTPUT"
      - id: prebuilt
        uses: actions/cache@v6
        with:
          path: target/ghostty-prebuilt
          key: ghostty-prebuilt-${{ runner.os }}-e2e-app-${{ steps.ghostty.outputs.key }}
          restore-keys: ghostty-prebuilt-${{ runner.os }}-tests
      # Ghostty's zig packages only for a build of libghostty-vt: with the prebuilt for these
      # exact inputs restored, nothing builds it, and the fetch was 51-74 s of every run
      # (.research/e2e-reduction-2026-10-31/B-anatomy.md), as ci.yml's lanes already skip it.
      # An entry a test shard saved, restored by its prefix, is for these inputs when its key
      # ends in theirs.
      - if: ${{ !endsWith(steps.prebuilt.outputs.cache-matched-key, steps.ghostty.outputs.key) }}
        uses: actions/cache@v6
        with:
          path: vendor/ghostty/zig-pkg
          key: zig-pkg-${{ hashFiles('vendor/ghostty/build.zig.zon') }}
      - if: ${{ !endsWith(steps.prebuilt.outputs.cache-matched-key, steps.ghostty.outputs.key) }}
        working-directory: vendor/ghostty
        timeout-minutes: 15
        run: for i in 1 2 3 4 5; do zig build --fetch=all && exit 0; sleep $((i * 15)); done; exit 1
      # xcodegen writes the iOS app's Xcode project, which the simulator cases build: XcodeGen's
      # release, pinned by version and checksum and kept in the cache; Homebrew took minutes.
      - if: matrix.case == 'ios'
        id: xcodegen
        uses: actions/cache@v6
        with:
          path: ~/.local/xcodegen
          key: xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      - if: matrix.case == 'ios' && steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d ~/.local/xcodegen
      - if: matrix.case == 'ios'
        run: echo "$HOME/.local/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # xtask built once per change to what it is built from, rather than in every job: 20-90 s
      # a job (.research/ci-speed-2026-10-11.md item 4). The key names every input of its
      # build (`gate::tests::xtask_s_cache_key_names_every_input`). nextest's setup script runs
      # it through `SLOPTY_XTASK` (.config/nextest.toml), so cargo never rebuilds it there.
      # Unoptimised, its dependencies aside: it orchestrates, and its own crates compile in half
      # the time (`docs/decisions/tooling.md`, "CI builds xtask unoptimised").
      - id: xtask
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/slopty-xtask
          key: >-
            xtask-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xtask/**',
            'crates/slopty-crash/**', 'crates/slopty-testkit/**', 'Cargo.toml', 'Cargo.lock',
            'rust-toolchain.toml', '.cargo/*.toml') }}
      - if: steps.xtask.outputs.cache-hit != 'true'
        run: |
          CARGO_PROFILE_DEV_OPT_LEVEL=0 cargo build --locked --quiet --target-dir target/xtask \
            --package xtask
          mkdir -p ~/.cache/slopty-xtask
          cp target/xtask/debug/xtask ~/.cache/slopty-xtask/
      - if: steps.xtask.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/slopty-xtask
          key: ${{ steps.xtask.outputs.cache-primary-key }}
      - run: |
          echo "$HOME/.cache/slopty-xtask" >> "$GITHUB_PATH"
          echo "SLOPTY_XTASK=$HOME/.cache/slopty-xtask/xtask" >> "$GITHUB_ENV"
      - run: xtask setup --lane tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A red is the behaviour's: no test is retried, the named overrides' retries included.
      - env:
          CASE: ${{ matrix.case }}
          NEXTEST_RETRIES: "0"
        run: |
          args=("$CASE" --review)
          if [ "$CASE" = ios ]; then
            # The iPhone, then the iPad, from one build: the iPad boots while the iPhone tests.
            args+=(--sim iphone --sim ipad)
          else
            # Three tests at a time on the runner's three cores (`docs/decisions/tooling.md`,
            # "An e2e case runs in a guest here").
            args+=(--test-threads 3)
          fi
          xtask e2e "${args[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.case }}
          path: target/e2e/artifacts
          if-no-files-found: ignore
      - if: always()
        run: $SCCACHE_PATH --show-stats
