# sccache for a job, and the one place that decides where it keeps its units
# (docs/decisions/tooling.md, "sccache lives on R2"): Cloudflare R2 when the job has the R2
# credentials, the Actions cache otherwise (a pull request from a fork gets no secrets).
#
# R2 has neither the Actions cache's 10 GB quota, which evicted the gate's units within an hour,
# nor its 200 uploads a minute per repository, which dropped most of a cold run's writes. The
# units sit under one prefix per OS and architecture; the key sccache hashes already tells
# targets, compilers and flags apart, so every job of an image shares one key space.
name: sccache
description: Install sccache and point it at R2, or at the Actions cache without R2 credentials.
inputs:
  r2-access-key-id:
    description: The bucket's S3 access key id (`secrets.SCCACHE_R2_ACCESS_KEY_ID`); empty without it.
    required: false
    default: ""
  r2-secret-access-key:
    description: Its secret (`secrets.SCCACHE_R2_SECRET_ACCESS_KEY`).
    required: false
    default: ""
  actions-cache:
    description: Without R2, whether to use the Actions cache ("true") or only the runner's disk.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # A named version: without one the action asks the GitHub API for the latest release, and
    # that call timing out failed whole runs. 0.19 hands cargo a unit's metadata as soon as rustc
    # writes it on a miss, so its dependents start before its codegen ends; 0.18 held them for
    # the whole compile (docs/decisions/tooling.md, "taplo comes from its release, and CI's
    # sccache is 0.19").
    - uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.19.0
    - shell: bash
      env:
        KEY_ID: ${{ inputs.r2-access-key-id }}
        SECRET: ${{ inputs.r2-secret-access-key }}
        ACTIONS_CACHE: ${{ inputs.actions-cache }}
        PREFIX: ${{ runner.os }}-${{ runner.arch }}
      run: |
        if [ -n "$KEY_ID" ] && [ -n "$SECRET" ]; then
          echo "::add-mask::$KEY_ID"
          echo "::add-mask::$SECRET"
          {
            echo "SCCACHE_GHA_ENABLED=false"
            echo "SCCACHE_BUCKET=slopty-ci-sccache"
            echo "SCCACHE_ENDPOINT=https://aaa05f0153bcd0fc4c7efb7f785401c8.r2.cloudflarestorage.com"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_KEY_PREFIX=$PREFIX/"
            echo "AWS_ACCESS_KEY_ID=$KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
          } >> "$GITHUB_ENV"
          echo "sccache: R2, prefix $PREFIX/"
        else
          echo "SCCACHE_GHA_ENABLED=$ACTIONS_CACHE" >> "$GITHUB_ENV"
          echo "sccache: no R2 credentials; Actions cache: $ACTIONS_CACHE"
        fi
        # A start waits for the server, which reads and writes the bucket before it answers
        # (`storage.check()` in sccache 0.19's `start_server`), 10 s unless a config file says
        # otherwise: on a Mac booting a simulator beside the first compile, the start took longer
        # and `e2e (ios)` failed on `sccache rustc -vV` (run 41212022782). A minute, in the one
        # setting only a file holds.
        conf="$RUNNER_TEMP/sccache.toml"
        echo 'server_startup_timeout_ms = 60000' > "$conf"
        echo "SCCACHE_CONF=$conf" >> "$GITHUB_ENV"
    # The server, started now, before the job's work takes the cores, and kept up to the job's
    # end (`SCCACHE_IDLE_TIMEOUT=0`), so no compile waits on a start; a second try follows a
    # failed first. Should both fail, the job compiles without the wrapper (an empty
    # `RUSTC_WRAPPER` is cargo's none), cold rather than red, says so in its summary, and skips
    # its statistics (`SLOPTY_SCCACHE=off`). `gate.rs` runs this step against stand-ins.
    - id: sccache-start
      shell: bash
      run: |
        for try in 1 2; do
          if SCCACHE_IDLE_TIMEOUT=0 "$SCCACHE_PATH" --start-server; then
            echo "sccache: server up, try $try"
            exit 0
          fi
          # A start that timed out may still come up: stopped, so the next one can bind.
          "$SCCACHE_PATH" --stop-server > /dev/null 2>&1 || true
          [ "$try" = 2 ] || sleep 10
        done
        {
          echo "RUSTC_WRAPPER="
          echo "SLOPTY_SCCACHE=off"
        } >> "$GITHUB_ENV"
        echo "### ⚠ sccache's server did not start, twice: this job compiles without its cache" \
          >> "$GITHUB_STEP_SUMMARY"
        echo "::warning::sccache's server did not start; the job compiles without its cache"
