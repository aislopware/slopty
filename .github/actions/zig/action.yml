# zig for a job: the one the vendored ghostty builds with, its `build.zig.zon`'s
# `minimum_zig_version`, which xtask reads too (`tools::ghostty_zig`). That manifest is zig's one
# pin, so a ghostty bump moves every job's zig with it (docs/decisions/tooling.md, "zig is the
# one the pinned ghostty names"). The job checks the submodules out first, and its
# `xtask setup` puts ghostty's patches into the zig's standard library after.
name: zig
description: Install the zig the vendored ghostty builds with.
inputs:
  use-cache:
    description: >-
      Whether to keep zig's own caches in the Actions cache: libghostty-vt-sys never reads them
      (it passes its own --cache-dir), and they took 2.3 GB of the 10 GB quota.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        version=$(sed -n 's/^[[:space:]]*\.minimum_zig_version = "\([^"]*\)".*/\1/p' vendor/ghostty/build.zig.zon)
        if [ -z "$version" ]; then
          echo "::error file=vendor/ghostty/build.zig.zon::names no minimum_zig_version"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ steps.version.outputs.version }}
        use-cache: ${{ inputs.use-cache }}
    # The packages ghostty's build fetches (highway, wuffs and the rest of its lazy
    # dependencies) live under the global cache's `p/`, by their hash. Only that folder is
    # kept, keyed by the manifests that name them and by the job, since a job saves only the
    # packages its own builds fetched (the fuzz build fetches lazy ones the others never ask
    # for) and a key once saved is never written again. A run then fetches nothing, so an
    # outage of deps.files.ghostty.org (a 500 failed run 41035489712's fuzz build) cannot fail
    # a gate.
    - id: packages
      shell: bash
      run: echo "dir=${ZIG_GLOBAL_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/zig}/p" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ${{ steps.packages.outputs.dir }}
        key: zig-packages-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vendor/ghostty/build.zig.zon', 'vendor/ghostty/pkg/**/build.zig.zon') }}
        restore-keys: |
          zig-packages-${{ runner.os }}-${{ github.job }}-
          zig-packages-${{ runner.os }}-
