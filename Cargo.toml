[workspace]
resolver = "3"
members = [ "crates/*", "apps/*", "xtask" ]
# default-members: every member builds on the host; iOS-only crates are cfg-gated internally
exclude = [ "vendor", ".research" ]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/aislopware/slopty"
publish = false

# ---------------------------------------------------------------------------------------------
# Dependencies. Versions verified on crates.io 2026-09-04. objc2 family is pinned exact: the
# framework crates share one generated ABI surface and move as a unit.
# ---------------------------------------------------------------------------------------------
[workspace.dependencies]
# workspace crates
slopty-core = { path = "crates/slopty-core" }
slopty-proto = { path = "crates/slopty-proto" }
slopty-grid = { path = "crates/slopty-grid" }
slopty-engine = { path = "crates/slopty-engine" }
slopty-pty = { path = "crates/slopty-pty" }
slopty-host = { path = "crates/slopty-host" }
slopty-net = { path = "crates/slopty-net" }
slopty-client = { path = "crates/slopty-client" }
slopty-predict = { path = "crates/slopty-predict" }
slopty-codec = { path = "crates/slopty-codec" }
slopty-capture = { path = "crates/slopty-capture" }
slopty-input = { path = "crates/slopty-input" }
slopty-app = { path = "crates/slopty-app" }
slopty-platform = { path = "crates/slopty-platform" }
slopty-media = { path = "crates/slopty-media" }
slopty-theme = { path = "crates/slopty-theme" }
slopty-ui = { path = "crates/slopty-ui" }
slopty-agent = { path = "crates/slopty-agent" }
slopty-settings = { path = "crates/slopty-settings" }
slopty-e2e = { path = "crates/slopty-e2e", default-features = false }

# core
anyhow = "1.0.104"
thiserror = "2.0.20"
regex = "1.13.1"
bitflags = { version = "2.13.2", features = [ "serde" ] }
bytes = { version = "1.12.1", features = [ "serde" ] }
futures-core = "0.3.34"
core-foundation = "0.10.1"
# core-video follows the GPUI fork: `SurfaceSource: From<CVPixelBuffer>` needs the same crate version.
core-video = "0.5.2"
memchr = "2.8.3"
parking_lot = "0.12.5"
uuid = { version = "1.26.1", features = [ "v4", "v7", "serde", "fast-rng" ] }
camino = { version = "1.2.5", features = [ "serde1" ] }

# serialization
serde = { version = "1.0.229", features = [ "derive", "rc" ] }
serde_json = "1.0.151"
similar = "3.2.0"
# Syntax colouring for file cards and fenced code (`slopty_ui::highlight`): the bundled
# Sublime grammars on the pure-Rust regex engine; no onig, no C.
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
    "dump-load",
] }
# Transcript timestamps (RFC 3339 in the JSONL) and their local-time display.
chrono = { version = "0.4.45", default-features = false, features = [ "std", "clock" ] }
postcard = { version = "1.1.3", default-features = false, features = [ "alloc", "use-std" ] }
zerocopy = { version = "0.8.57", features = [ "derive" ] }
toml = "1.1.6"

# async / io
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
    "signal",
    "process",
    "fs",
] }

# observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "json", "fmt" ] }
plist = "1.10.1"
rustix = { version = "1.1.4", features = [
    "fs",
    "process",
    "pty",
    "termios",
    "net",
    "event",
    "pipe",
] }
libc = "0.2.189"
nix = { version = "0.31.3", features = [
    "term",
    "user",
    "process",
    "signal",
    "fs",
    "poll",
    "socket",
    "uio",
] }

# networking. iroh 1.x runs on n0's own QUIC stack (noq), not quinn. Default features are OFF:
# the default `fast-apple-datapath` (private `sendmsg_x`/`recvmsg_x`) costs ~50 ms of round-trip
# latency on macOS (measured 2026-09-04, docs/MEASUREMENTS.md) and must never be enabled.
iroh = { version = "1.2.0", default-features = false, features = [ "tls-ring" ] }
iroh-mdns-address-lookup = "0.5.0"
iroh-tickets = "1.0.0"
noq-proto = { version = "1.3.0", default-features = false }
data-encoding = "2.11.1"

# media: systematic Reed–Solomon over GF(2^16) with NEON; parity per video frame
reed-solomon-simd = "3.1.0"

# Apple frameworks (objc2 family, pinned exact; see the note above). Feature lists are trimmed
# to the headers each crate needs so the generated surface stays small.
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDate",
    "NSGeometry",
    "NSRunLoop",
    "NSError",
    "NSString",
    "NSObject",
    "NSEnumerator",
    "NSProcessInfo",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFCGTypes",
    "CFDate",
    "CFRunLoop",
] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CMBase",
    "CMTime",
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMAttachment",
    "CMSync",
    "objc2-core-video",
    "objc2-core-audio-types",
] }
objc2-application-services = { version = "=0.3.2", default-features = false, features = [
    "std",
    "AXError",
    "AXNotificationConstants",
    "AXUIElement",
    "AXValue",
    "HIServices",
    "libc",
] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferIOSurface",
    "CVReturn",
    "objc2-core-graphics",
] }
objc2-video-toolbox = { version = "=0.3.2", default-features = false, features = [
    "std",
    "VTBase",
    "VTSession",
    "VTErrors",
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTDecompressionSession",
    "VTDecompressionProperties",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "SCStream",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCError",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBase",
    "CGGeometry",
    "CGImage",
    "CGDataProvider",
    "CGDirectDisplay",
    "CGWindow",
    "CGWindowLevel",
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
    "CGError",
    "libc",
] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSColor",
    "NSCursor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "objc2-core-graphics",
    "NSWindow",
    "NSPanel",
    "NSRunningApplication",
    "NSPasteboard",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
    "libc",
] }
objc2-audio-toolbox = { version = "=0.3.2", default-features = false, features = [
    "std",
    "AudioServices",
    "AudioConverter",
    "AudioQueue",
    "objc2-core-audio-types",
    "objc2-core-foundation",
] }
objc2-core-audio-types = { version = "=0.3.2", default-features = false, features = [ "std" ] }
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
] }
objc2-game-controller = { version = "=0.3.2", default-features = false, features = [
    "std",
    "GCKeyboard",
] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "UIFeedbackGenerator",
    "UINotificationFeedbackGenerator",
] }
block2 = "=0.6.2"
dispatch2 = "=0.3.1"

# UI. GPUI from our zed fork (branch `slopty` = zed@801c087, the commit gpui-kit's gpui-pre 0.3.1
# snapshots) and gpui-kit from our fork (v0.6.0 + one commit pointing it at the zed fork). Both
# use `branch` so the two sources unify; Cargo.lock pins the commits.
gpui = { git = "https://github.com/aislopware/zed.git", branch = "slopty" }
gpui_ios = { git = "https://github.com/aislopware/zed.git", branch = "slopty", features = [
    "runtime_shaders",
] }
# The platform crate behind `gpui_kit::application()`; named directly only so the `e2e`
# feature can turn on its `test-support` (`Window::render_to_image` on a real window).
gpui_platform = { git = "https://github.com/aislopware/zed.git", branch = "slopty" }
# PNG in/out for the e2e render snapshots; the version gpui already builds.
image = { version = "0.25.10", default-features = false, features = [ "png" ] }
# The kitty graphics PNG decoder the engine hands libghostty (the version it builds with).
png = "0.18.1"
gpui-kit = { git = "https://github.com/aislopware/gpui-kit.git", branch = "slopty", default-features = false, features = [
    "component",
    "assets",
] }

# terminal engine
libghostty-vt = { git = "https://github.com/aislopware/libghostty-rs.git", branch = "slopty", features = [
    "png",
] }

# cli / scripts
clap = { version = "4.6.6", features = [ "derive", "env" ] }
xshell = "0.2.7"
resvg = { version = "0.48.1", default-features = false }
icns = "0.4.0"

# testing
insta = { version = "1.48.0", features = [ "yaml", "redactions" ] }
proptest = "1.11.0"
tempfile = "3.27.0"
ignore = "0.4.23"
pretty_assertions = "1.4.1"

# ---------------------------------------------------------------------------------------------
# Lints. Groups are `warn` here; the gate (`cargo gate`) runs clippy with `-D warnings`, so a
# warning never reaches main. Restriction lints are opted in one by one.
# ---------------------------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unreachable_pub = "allow"                                         # binaries have many crate-level pub items; re-enable per crate
trivial_casts = "warn"
trivial_numeric_casts = "warn"
meta_variable_misuse = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
single_use_lifetimes = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"
redundant_lifetimes = "warn"
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
closure_returning_async_block = "warn"
deref_into_dyn_supertrait = "warn"
absolute_paths_not_starting_with_crate = "warn"
missing_copy_implementations = "warn"
unnameable_types = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [ "cfg(miri)" ] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# restriction: things that must never ship. Denied outright (not only under `-D warnings`):
# a library never panics; tests may (`clippy.toml` allows unwrap/expect/panic/indexing there).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
exit = "warn"
mem_forget = "warn"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unwrap_in_result = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"
str_to_string = "warn"

clone_on_ref_ptr = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
verbose_file_reads = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
mixed_read_write_in_expression = "warn"
same_name_method = "warn"
semicolon_inside_block = "warn"
tests_outside_test_module = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
large_include_file = "warn"
missing_assert_message = "warn"
renamed_function_params = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
map_err_ignore = "warn"
non_zero_suggestions = "warn"
pathbuf_init_then_push = "warn"
partial_pub_fields = "warn"
precedence_bits = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
try_err = "warn"
unused_result_ok = "warn"

# Adopted 2026-09-12 after a survey of every allow-by-default lint (decisions/tooling.md):
# each of these fired nowhere or at a handful of sites that were fixed in the same change.
string_slice = "warn"
mod_module_files = "warn"
get_unwrap = "warn"
deref_by_slicing = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
create_dir = "warn"
filetype_is_file = "warn"
fn_to_numeric_cast_any = "warn"
format_push_string = "warn"
map_with_unused_argument_over_ranges = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
string_add = "warn"
unused_trait_names = "warn"
doc_include_without_cfg = "warn"
non_std_lazy_statics = "warn"
error_impl_error = "warn"
empty_enum_variants_with_brackets = "warn"
field_scoped_visibility_modifiers = "warn"
as_underscore = "warn"
as_pointer_underscore = "warn"
pub_without_shorthand = "warn"
redundant_test_prefix = "warn"
large_stack_frames = "warn"
unchecked_time_subtraction = "warn"
unnecessary_debug_formatting = "warn"
pointer_format = "warn"
ineffective_open_options = "warn"
doc_paragraphs_missing_punctuation = "warn"
doc_comment_double_space_linebreaks = "warn"
disallowed_script_idents = "warn"
unicode_not_nfc = "warn"
set_contains_or_insert = "warn"

# Not enabled on purpose (surveyed 2026-09-12, counts over the whole tree at the time):
# `shadow_unrelated` (sequential test steps legitimately reuse names); `pattern_type_mismatch`
# (342, `&` in patterns is the idiom); `default_numeric_fallback` (309); `elided_lifetimes_in_paths`
# (282, `Formatter<'_>` everywhere for nothing); `wildcard_enum_match_arm` (119, `_ =>` on
# wire enums is the forward-compatible arm); `integer_division` (77, grid arithmetic on
# literals); `ffi_unwind_calls` (34, the `C-unwind` ABI is what lets objc2 catch an exception);
# `impl_trait_in_params` (27, GPUI builders); `return_and_then` (23, `?` inside a builder
# closure reads worse); `iter_over_hash_type` (17, every loop is order-free: theme fan-out,
# teardown; the palette and the dumps sort explicitly); `non_ascii_idents` (fires on zerocopy's
# derive output only); `single_char_lifetime_names`, `use_debug`, `multiple_inherent_impl`
# (GPUI views split their impls by concern), `variant_size_differences` (a 23-byte variant is
# not worth a `Box`), `panic_in_result_fn` (tests that return `Result` still assert).

# pedantic/nursery relief with reasons
module_name_repetitions = "allow" # `grid::GridRow` is clearer than `grid::Row` at call sites
missing_errors_doc = "allow"      # error enums are documented on the type
missing_panics_doc = "allow"      # `panic` lint forbids panics; the doc would lie
must_use_candidate = "allow"      # too noisy for builders; applied by hand where it matters
cargo_common_metadata = "allow"   # publish = false
multiple_crate_versions = "allow" # gated by cargo-deny instead
similar_names = "allow"           # `rx`/`tx`, `cols`/`rows`
struct_excessive_bools = "allow"  # config structs
too_many_lines = "allow"          # judged in review
option_if_let_else = "allow"      # nursery; frequently less readable
future_not_send = "allow"         # GPUI is !Send by design

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

# ---------------------------------------------------------------------------------------------
# Profiles. `panic = "unwind"` everywhere: objc2 catches Objective-C exceptions by unwinding, and
# `abort` would turn any of them into a process abort.
# ---------------------------------------------------------------------------------------------
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"
overflow-checks = true
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = "none"
overflow-checks = true

# Shipping builds: symbols packed into dSYMs by xtask, then stripped.
[profile.dist]
inherits = "release"
split-debuginfo = "packed"
strip = "debuginfo"

# Fast-starting per-event binaries (hook relay): size over throughput.
[profile.tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
